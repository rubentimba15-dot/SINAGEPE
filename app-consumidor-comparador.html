<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Consumidor — Comparador</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app-consumidor.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><b>09:41</b><span class="status-icons">📶 📡 🔋</span></div>
  <div class="mob-header">
    <a class="mob-back" href="app-consumidor-produto-detalhe.html">‹ Produto</a>
    <div class="mob-title" style="margin-top:8px">Comparar Lojas — Arroz</div>
    <div class="mob-sub">Menor preço próximo de si</div>
  </div>
  <div class="mob-content">
    <div id="comp-list"></div>
  </div>
  <div class="bottom-nav">
    <a class="nav-tab" href="app-consumidor-home.html"><span class="ic">🏠</span>Início</a>
    <a class="nav-tab active" href="app-consumidor-precos.html"><span class="ic">📈</span>Preços</a>
    <a class="nav-tab" href="app-consumidor-mapa.html"><span class="ic">🗺️</span>Mapa</a>
    <a class="nav-tab" href="app-consumidor-alertas.html"><span class="ic">🔔</span>Alertas</a>
  </div>
</div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  const lojas = [...data.appConsumidor.lojasPreco].sort((a,b) => a.preco - b.preco);
  document.getElementById('comp-list').innerHTML = lojas.map((l, i) => `
    <div class="mob-card row-between" style="margin-bottom:12px">
      <div><div style="color:var(--mob-ink);font-weight:700;font-size:14px">${i===0 ? '🏆 ' : ''}${l.loja}</div><div style="color:var(--mob-dim);font-size:11.5px">${l.distanciaKm} km</div></div>
      <div style="color:${i===0?'var(--mob-teal)':'var(--mob-ink)'};font-weight:800;font-size:16px">${l.preco} MZN/kg</div>
    </div>`).join('');
});
</script>
</body>
</html>
