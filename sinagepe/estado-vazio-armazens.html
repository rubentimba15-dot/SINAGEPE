<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem Armazéns Registados — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .empty-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 60px 40px; text-align: center; }
  .empty-icon { width: 150px; height: 150px; border-radius: 90px; background: var(--bg-input); border: 2px dashed var(--border-input); display: flex; align-items: center; justify-content: center; font-size: 56px; }
  .empty-title { font-size: 21px; font-weight: 700; color: #fff; }
  .empty-desc { font-size: 14px; color: var(--ink-dim); max-width: 460px; line-height: 1.6; }
  .empty-btn { background: var(--accent-orange); color: #040712; border: none; border-radius: 6px; padding: 13px 22px; font-weight: 700; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('armazens', 'Gestão de Armazéns', 'Sistema de Armazenamento Geral');
document.getElementById('content-mount').innerHTML = `
  <div class="empty-wrap">
    <div class="empty-icon">🏭</div>
    <div class="empty-title">Nenhum armazém registado</div>
    <div class="empty-desc">De momento, não existem infraestruturas de armazenamento registadas no sistema para a sua área de jurisdição. Registar armazéns permite gerir stock de emergência e logística de PMEs.</div>
    <a href="formulario-registar-armazem.html" style="text-decoration:none"><button class="empty-btn">+ Registar Armazém</button></a>
  </div>
`;
SINAGEPE.load().then(data => {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = data.meta.ultimaActualizacao;
});
</script>
</body>
</html>
