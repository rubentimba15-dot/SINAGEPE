<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Transportes — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('painel', 'Dashboard Transportes', 'Ministério dos Transportes e Comunicações');

document.getElementById('content-mount').innerHTML = `
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)" id="kpi-row-1"></div>
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)" id="kpi-row-2"></div>

  <div class="row-2">
    <div class="card">
      <div class="card-title">Utilização de Capacidade por Via</div>
      <div class="card-subtitle">Mesmos dados já usados no Mapa Nacional e no Módulo de Logística — sem duplicar números desalinhados</div>
      <div id="util-list"></div>
    </div>
    <div class="card">
      <div class="card-title">Tempo Médio de Desembaraço Portuário</div>
      <div id="desembaraco-list" style="margin-bottom:16px"></div>
      <div class="kpi-label" style="margin-bottom:8px">Rotas Alternativas Inteligentes (IA)</div>
      <div id="rotas-list"></div>
    </div>
  </div>

  <div class="card" style="background:var(--navy-800);border-color:var(--bronze-dim)">
    <div class="card-title">Calculadora de Melhor Rota Nacional</div>
    <div class="card-subtitle">Selecciona um produto — o sistema escolhe o corredor operacional de menor custo</div>
    <select id="calc-produto" style="background:var(--navy-900);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:10px;min-width:220px"></select>
    <button id="calc-btn" style="background:var(--bronze);color:var(--navy-950);border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;margin-left:8px">Calcular Rota Ideal</button>
    <div id="calc-resultado" style="margin-top:14px;font-size:13px;color:var(--ink-dim)"></div>
  </div>
`;

SINAGEPE.load().then(renderDashboardTransportes);

function renderDashboardTransportes(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  const t = data.dashboardTransportes;
  const kpi1 = [
    { label: 'Estradas Cortadas', valor: t.kpis.estradasCortadas + ' Pontos', estado: 'Crítico', tipo: 'crit' },
    { label: 'Pontes Condicionadas', valor: t.kpis.pontesCondicionadas, estado: 'Atenção', tipo: 'warn' },
    { label: 'Portos Operacionais', valor: t.kpis.portosOperacionaisTotal, estado: 'Normal', tipo: 'ok' },
  ];
  const kpi2 = [
    { label: 'Aeroportos Activos', valor: t.kpis.aeroportosActivos + ' Term.', estado: 'Estável', tipo: 'info' },
    { label: 'CFM Operacional', valor: t.kpis.cfmOperacionalPercent + '%', estado: 'Estável', tipo: 'info' },
    { label: 'Custo Médio de Frete', valor: t.kpis.custoMedioFreteUsd + ' USD/t', estado: 'Elevado', tipo: 'warn' },
  ];
  document.getElementById('kpi-row-1').innerHTML = kpi1.map(SINAGEPE.kpiCard).join('');
  document.getElementById('kpi-row-2').innerHTML = kpi2.map(SINAGEPE.kpiCard).join('');

  document.getElementById('util-list').innerHTML = data.utilizacaoModal.map(u => {
    const tipo = u.percentagem >= 85 ? 'crit' : u.percentagem >= 70 ? 'warn' : 'ok';
    return `<div class="util-row"><div class="util-label-row"><span>${u.modal}</span><span>${u.percentagem}%</span></div>
      <div class="util-track"><div class="util-fill pill-${tipo}" style="width:${u.percentagem}%"></div></div></div>`;
  }).join('');

  document.getElementById('desembaraco-list').innerHTML = t.tempoDesembaraco.map(d => `
    <div class="medida-row"><span>${d.porto}</span><span>${d.dias} Dias</span></div>`).join('');

  document.getElementById('rotas-list').innerHTML = t.rotasAlternativas.map(r => `
    <div class="alert-card ok"><div class="alert-title">${r.nome}</div><div class="alert-desc">${r.beneficio}</div></div>`).join('');

  document.getElementById('calc-produto').innerHTML = data.balancoNacional.map(p => `<option>${p.produto}</option>`).join('');

  document.getElementById('calc-btn').addEventListener('click', () => {
    const operacionais = data.corredores.filter(c => c.estado === 'Operacional' && c.custoTKm !== null);
    const melhor = operacionais.reduce((min, c) => c.custoTKm < min.custoTKm ? c : min, operacionais[0]);
    const produto = document.getElementById('calc-produto').value;
    document.getElementById('calc-resultado').innerHTML =
      `Para <b>${produto}</b>, a rota mais económica actualmente é o <b>${melhor.nome}</b> (${melhor.origem} → ${melhor.destino}), a ${melhor.custoTKm} USD/t·km, com ${melhor.tempoH}h de trânsito.`;
  });
}
</script>
</body>
</html>
