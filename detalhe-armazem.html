<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhe do Armazém — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .breadcrumb { font-size: 12px; color: var(--ink-faint); margin-bottom: 4px; }
  .page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-title { font-size: 24px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 14px; }
  .back-btn { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--bronze); }
</style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<script src="assets/chart.umd.min.js"></script>
<script>
/* A biblioteca de gráficos vinha de cdnjs.cloudflare.com, num endereço que
   nunca existiu: a versão 4.4.4 não está publicada nesse repositório, e o
   pedido devolvia sempre 404. Consequência: `new Chart(...)` rebentava e
   interrompia a função de desenho, deixando em branco não só o gráfico mas
   tudo o que vinha depois dele no ecrã — sem aviso nenhum ao utilizador.

   Passa a ser servida do próprio repositório (assets/chart.umd.min.js,
   versão 4.4.1), pelo que funciona sem Internet e sem depender de terceiros.

   O bloco abaixo é a rede de segurança: se um dia a biblioteca faltar, cada
   tela de gráfico é substituída por uma linha a dizê-lo, e o resto do ecrã
   continua a desenhar. Um gráfico em falta deve declarar-se, não desaparecer
   em silêncio nem levar o ecrã atrás. */
if (typeof Chart === 'undefined') {
  window.Chart = function (alvo) {
    var tela = alvo && alvo.canvas ? alvo.canvas : alvo;
    if (tela && tela.parentNode) {
      var aviso = document.createElement('div');
      aviso.className = 'grafico-indisponivel';
      aviso.textContent = 'Gráfico indisponível — a biblioteca de gráficos não carregou.';
      aviso.style.cssText = 'display:flex;align-items:center;justify-content:center;' +
        'min-height:120px;padding:18px;border:1px dashed rgba(201,138,60,.45);' +
        'border-radius:10px;color:#8FA1B8;font-size:12px;text-align:center';
      tela.parentNode.replaceChild(aviso, tela);
    }
    return { destroy: function () {}, update: function () {}, resize: function () {} };
  };
}
</script>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('armazens', 'Atlas de Monitoria de Mercadorias e Corredores', 'Sistema Vivo');
const params = new URLSearchParams(location.search);

document.getElementById('content-mount').innerHTML = `
  <div class="page-title-row">
    <div><div class="breadcrumb">Cadastro de Armazéns &gt; Detalhe</div>
    <div class="page-title" id="wh-titulo">—</div></div>
    <a class="back-btn" href="cadastro-armazens.html">← Voltar ao Cadastro</a>
  </div>
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)" id="kpi-row"></div>
  <div class="row-2">
    <div class="card">
      <div class="card-title">Distribuição de Armazenamento</div>
      <canvas id="chart-produtos" height="160"></canvas>
    </div>
    <div class="card">
      <div class="card-title">Condições Físicas de Conservação</div>
      <div id="cond-list"></div>
    </div>
  </div>
`;

SINAGEPE.load().then(data => {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = data.meta.ultimaActualizacao;

  const codigo = params.get('codigo');
  const w = data.armazens.find(x => x.codigo === codigo) || data.armazens[0];
  document.getElementById('wh-titulo').innerHTML = `${w.nome} <span class="pill pill-${w.ocupacaoPercent>95?'crit':w.ocupacaoPercent>=60?'warn':'ok'}">${w.ocupacaoPercent}% Ocupado</span>`;

  const kpis = [
    { label: 'Capacidade Total', valor: SINAGEPE.fmt(w.capacidadeTotalT) + ' t', estado: 'Registada', tipo: 'info' },
    { label: 'Operador', valor: w.operador, estado: w.provincia, tipo: 'info' },
    { label: 'Condição Física', valor: w.condicaoFisica, estado: 'Inspeccionado', tipo: w.condicaoFisica==='Boa'?'ok':w.condicaoFisica==='Razoável'?'warn':'crit' },
    { label: 'Última Inspecção', valor: w.ultimaInspeccao, estado: 'Auditoria', tipo: 'ok' },
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(SINAGEPE.kpiCard).join('');

  if (w.produtos) {
    new Chart(document.getElementById('chart-produtos'), {
      type: 'bar',
      data: { labels: w.produtos.map(p=>p.produto), datasets: [{ data: w.produtos.map(p=>p.toneladas), backgroundColor: '#d97706', borderRadius: 6 }] },
      options: { indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{ticks:{color:'#64748b',font:{size:10}},grid:{color:'rgba(30,45,75,0.4)'}},y:{ticks:{color:'#cbd5e1',font:{size:11}},grid:{display:false}}} }
    });
    document.getElementById('cond-list').innerHTML = `
      <div class="medida-row"><span>Tempo Médio de Permanência</span><span>${w.condicoesConservacao.tempoMedioPermanenciaDias} dias</span></div>
      <div class="medida-row"><span>Taxa de Perdas de Stock</span><span style="color:${w.condicoesConservacao.taxaPerdasPercent>1?'var(--warn)':'var(--ok)'}">${w.condicoesConservacao.taxaPerdasPercent}%</span></div>
      <div class="medida-row"><span>Humidade</span><span>${w.condicoesConservacao.humidadePercent}%</span></div>
      <div class="medida-row"><span>Temperatura</span><span>${w.condicoesConservacao.temperaturaC}°C</span></div>
      <div class="medida-row"><span>Pragas Detectadas</span><span>${w.condicoesConservacao.pragas}</span></div>`;
  } else {
    document.getElementById('chart-produtos').outerHTML = '<p style="font-size:12px;color:var(--ink-faint)">Distribuição por produto ainda não disponível para este armazém.</p>';
    document.getElementById('cond-list').innerHTML = '<p style="font-size:12px;color:var(--ink-faint)">Condições de conservação ainda não registadas.</p>';
  }
});
</script>
</body>
</html>
