<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>
<script src="assets/nav-sinagepe.js"></script>
<script src="assets/pesquisa-sinagepe.js"></script>
<script src="assets/selo-proveniencia.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Bancos — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="nav-mount"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title-group"><div class="topbar-title">Portal Bancos</div><div class="topbar-badge">Financiamento de Cadeias de Valor</div></div>
      <div class="live-indicator" style="color:var(--amber)">Dados de demonstra&ccedil;&atilde;o</div>
    </div>
    <div class="content" id="content-mount"></div>
    <div class="footer"><span>© 2026 SINAGEPE Moçambique — Acesso Privado</span><span id="footer-updated">—</span></div>
  </div>
</div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  /* A fonte declara-se simulada; o ecrã tem de o dizer. Os nomes das entidades
     mantêm-se com aparência realista por decisão de apresentação — o aviso de
     simulação é dado por esta faixa e verbalmente em cada demonstração. */
  if (window.SeloProveniencia) SeloProveniencia.aplicar({
    modo: (data.meta && data.meta.modo) || null,
    bloco: 'portalBancos',
    quando: data.meta && data.meta.ultimaActualizacao
  });

  const b = data.portalBancos;
  SINAGEPE.renderUserFooter({ utilizador: { nome: b.banco, instituicao: 'Sector Bancário', direccao: 'Diretor de Risco Agro' } });
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  document.getElementById('content-mount').innerHTML = `
    <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)">
      ${SINAGEPE.kpiCard({ label: 'Procura de Financiamento', valor: '+' + b.kpis.procuraFinanciamentoPercent + '%', estado: 'Alta Demanda', tipo: 'ok' })}
      ${SINAGEPE.kpiCard({ label: 'Crédito Homologado', valor: (b.kpis.creditoHomologadoMzn / 1e9).toFixed(1) + 'B MZN', estado: 'Volume Saudável', tipo: 'ok' })}
      ${SINAGEPE.kpiCard({ label: 'Lotes Qualificados', valor: b.kpis.lotesQualificados, estado: 'Garantia Estatal', tipo: 'info' })}
    </div>

    <div class="card">
      <div class="card-title">Cadeia de Valor do Trigo</div>
      <div id="cadeia-list"></div>
    </div>

    <div class="row-2">
      <div class="card">
        <div class="card-title">Empresas Candidatas ao Fundo de Garantia</div>
        <div class="card-subtitle">Score IA = rating gerado só com dados SINAGEPE; complementar, não substitui a análise de crédito do banco</div>
        <table class="balance-table">
          <thead><tr><th>Empresa</th><th>Sector</th><th>Montante</th><th>Classificação</th><th>Score IA</th></tr></thead>
          <tbody id="candidatas-body"></tbody>
        </table>
      </div>
      <div class="card">
        <div class="card-title">Classificação de Risco Sectorial</div>
        <div class="card-subtitle">Score leva em conta a cotação de câmbio e o tempo médio de desembaraço aduaneiro</div>
        <div id="risco-list"></div>
      </div>
    </div>
  `;

  document.getElementById('cadeia-list').innerHTML = b.cadeiaValorTrigo.map((f, i) => `
    <div class="medida-row" style="display:block;padding:10px 0">
      <div style="display:flex;justify-content:space-between"><b style="font-size:12.5px">Fase ${i + 1}: ${f.fase}</b><span style="font-family:var(--font-data)">${(f.montanteMzn / 1e6).toFixed(0)}M MZN</span></div>
      <div style="font-size:11.5px;color:var(--ink-faint);margin-top:3px">${f.nota}</div>
    </div>`).join('');

  const CLASS_TIPO = { 'Baixo': 'ok', 'Moderado': 'warn', 'Alto': 'crit' };
  document.getElementById('candidatas-body').innerHTML = b.empresasCandidatas.map(e => `
    <tr><td>${e.empresa}</td><td>${e.sector}</td><td>${(e.montanteMzn / 1e6).toFixed(1)}M MZN</td>
    <td><span class="state-tag" style="background:var(--${CLASS_TIPO[e.classificacao]}-bg);color:var(--${CLASS_TIPO[e.classificacao]})">${e.classificacao}</span></td>
    <td style="font-family:var(--font-data)">${e.scoreIA}</td></tr>`).join('');

  const RISCO_TIPO = { 'Baixo Risco': 'ok', 'Moderado': 'warn', 'Alto Risco': 'crit' };
  document.getElementById('risco-list').innerHTML = b.riscoSectorial.map(r => `
    <div class="medida-row"><span>${r.produto}</span><span class="state-tag" style="background:var(--${RISCO_TIPO[r.nivel]}-bg);color:var(--${RISCO_TIPO[r.nivel]})">${r.nivel}</span></div>`).join('');
});
</script>

<script>
/* A barra deste portal estava escrita \u00e0 mão, com sete destinos por preencher.
   Passa a vir de assets/nav-sinagepe.js, como os outros ecr\u00e3s: os itens s\u00e3o
   gerados de uma lista \u00fanica, sempre com destino real, e filtrados pelo acesso
   da conta. Um banco v\u00ea o que lhe diz respeito, n\u00e3o portas fechadas. */
(function(){
  function montar(){
    try{
      if(window.SinagepeNav) SinagepeNav.montar('portal-bancos');
      if(window.SinagepePesquisa) SinagepePesquisa.iniciar();
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',montar);
  else montar();
  /* o Banco Central constr\u00f3i a casca por c\u00f3digo; volta a montar quando ela existir */
  setTimeout(montar,400);
})();
</script>
</body>
</html>
