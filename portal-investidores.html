<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>
<script src="assets/nav-sinagepe.js"></script>
<script src="assets/pesquisa-sinagepe.js"></script>
<script src="assets/selo-proveniencia.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Investimento Agro-Industrial — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .op-card { background: var(--bg-card-hover); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .op-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .op-nome { font-size: 13px; font-weight: 700; color: #fff; }
  .op-meta { font-size: 11.5px; color: var(--ink-dim); }
  .op-risco { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .hotspot-map { background: var(--bg-input); border-radius: 12px; height: 220px; position: relative; overflow: hidden; }
  .hotspot-tag { position: absolute; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; }
  .hotspot-dot { width: 8px; height: 8px; border-radius: 50%; }
  .sim-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-input); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="nav-mount"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title-group"><div class="topbar-title">Portal de Investimento Agro-Industrial Moçambicano</div><div class="topbar-badge">Investidor Privado</div></div>
      <div class="live-indicator"><span class="live-dot"></span> Conexão Segura · API Activa</div>
    </div>
    <div class="content" id="content-mount"></div>
    <div class="footer"><span>© 2026 Agência para a Promoção de Investimento e Exportações (APIEX) — Acesso Privado SINAGEPE</span><span id="footer-updated">—</span></div>
  </div>
</div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  /* A fonte declara-se simulada; o ecrã tem de o dizer. Os nomes das entidades
     mantêm-se com aparência realista por decisão de apresentação — o aviso de
     simulação é dado por esta faixa e verbalmente em cada demonstração. */
  if (window.SeloProveniencia) SeloProveniencia.aplicar({
    modo: (data.meta && data.meta.modo) || null,
    bloco: 'portalInvestidores',
    quando: data.meta && data.meta.ultimaActualizacao
  });

  const p = data.portalInvestidores;
  SINAGEPE.renderUserFooter({ utilizador: { nome: p.investidor, instituicao: 'Investidor Privado', direccao: 'Director de Portefólio' } });
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  document.getElementById('content-mount').innerHTML = `
    <div class="kpi-row" id="kpi-row"></div>
    <div class="row-2">
      <div class="card">
        <div class="card-title">Oportunidades de Investimento</div>
        <div id="oportunidades-list"></div>
      </div>
      <div class="card">
        <div class="card-title">Hotspots de Investimento SINAGEPE</div>
        <div class="card-subtitle">Zonas francas activas</div>
        <div class="hotspot-map" id="hotspot-map"></div>
      </div>
      <div class="card">
        <div class="card-title">🧮 Simulador de Retorno (IA)</div>
        <div class="card-subtitle">Projecção média com base no histórico das províncias de Moçambique</div>
        <div class="sim-row"><span style="font-weight:700;color:#fff">Investimento Base</span><span id="sim-base" style="font-weight:700;color:var(--ok)"></span></div>
        <div class="kpi-label">Retorno Projectado (<span id="sim-anos"></span> Anos)</div>
        <div class="kpi-value" style="font-size:20px;margin:4px 0" id="sim-retorno"></div>
        <div style="font-size:11px;color:var(--ok);font-weight:600" id="sim-taxa"></div>
      </div>
    </div>
  `;

  const kpiDefs = p.kpis.map(k => ({ label: k.label, valor: k.valor, estado: k.tag, tipo: k.tipo || 'ok' }));
  document.getElementById('kpi-row').innerHTML = kpiDefs.map(SINAGEPE.kpiCard).join('');

  document.getElementById('oportunidades-list').innerHTML = p.oportunidades.map(o => `
    <div class="op-card">
      <div class="op-top"><span class="op-nome">${o.nome}</span><span class="pill pill-ok">${o.roi}% ROI</span></div>
      <div class="op-meta">${o.local} · Invest: ${SINAGEPE.fmt(o.investimento)} MZN</div>
      <div class="op-risco">Risco: ${o.risco}</div>
    </div>`).join('');

  const cores = ['var(--ok)', 'var(--warn)'];
  const posicoes = [[15, 15, 55, 55], [55, 40, 40, 40]];
  document.getElementById('hotspot-map').innerHTML = p.hotspots.map((h, i) => {
    const [top, left] = posicoes[i];
    return `<div class="hotspot-tag" style="top:${top}%;left:${left}%"><span class="hotspot-dot" style="background:${cores[i % 2]}"></span>${h.nome}</div>`;
  }).join('');

  document.getElementById('sim-base').textContent = SINAGEPE.fmt(p.simulador.investimentoBaseMzn) + ' MZN';
  document.getElementById('sim-anos').textContent = p.simulador.anos;
  const retorno = Math.round(p.simulador.investimentoBaseMzn * (1 + p.simulador.taxaRentabilidadePercent / 100 * p.simulador.anos));
  document.getElementById('sim-retorno').textContent = SINAGEPE.fmt(retorno) + ' MZN';
  document.getElementById('sim-taxa').textContent = 'Taxa interna de rentabilidade de ' + p.simulador.taxaRentabilidadePercent + '%';
});
</script>

<script>
/* A barra deste portal estava escrita \u00e0 mão, com sete destinos por preencher.
   Passa a vir de assets/nav-sinagepe.js, como os outros ecr\u00e3s: os itens s\u00e3o
   gerados de uma lista \u00fanica, sempre com destino real, e filtrados pelo acesso
   da conta. Um banco v\u00ea o que lhe diz respeito, n\u00e3o portas fechadas. */
(function(){
  function montar(){
    try{
      if(window.SinagepeNav) SinagepeNav.montar('portal-investidores');
      if(window.SinagepePesquisa) SinagepePesquisa.iniciar();
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',montar);
  else montar();
  /* o Banco Central constr\u00f3i a casca por c\u00f3digo; volta a montar quando ela existir */
  setTimeout(montar,400);
})();
</script>
</body>
</html>
