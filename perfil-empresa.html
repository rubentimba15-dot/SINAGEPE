<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil de Empresa — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .breadcrumb { font-size: 12px; color: var(--ink-faint); margin-bottom: 4px; }
  .page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-title { font-size: 24px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 14px; }
  .back-btn { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--bronze); }
</style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('painel', 'Atlas de Monitoria de Mercadorias e Corredores', 'Sistema Vivo');

document.getElementById('content-mount').innerHTML = `
  <div class="page-title-row">
    <div><div class="breadcrumb">Marketplace B2B &gt; Perfil de Empresa</div>
    <div class="page-title">Importadora Silva Lda. <span class="pill pill-ok">Verificada</span></div></div>
    <a class="back-btn" href="marketplace-b2b.html">← Voltar ao Marketplace</a>
  </div>
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)" id="kpi-row"></div>
  <div class="row-2">
    <div class="card">
      <div class="card-title">Anúncios Publicados</div>
      <div id="anuncios-list"></div>
    </div>
    <div class="card">
      <div class="card-title">Sobre a Empresa</div>
      <div class="medida-row"><span>Sector</span><span>Importação de Produtos Essenciais</span></div>
      <div class="medida-row"><span>Sede</span><span>Maputo</span></div>
      <div class="medida-row"><span>No sistema desde</span><span>2024</span></div>
    </div>
  </div>
`;

SINAGEPE.load().then(data => {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = data.meta.ultimaActualizacao;

  const anuncios = data.marketplace.anuncios.filter(a => a.vendedor === 'Importadora Silva Lda.').length || 1;
  const kpis = [
    { label: 'Anúncios Activos', valor: anuncios, estado: 'No Marketplace', tipo: 'info' },
    { label: 'Transacções Concluídas', valor: '18', estado: 'Histórico', tipo: 'ok' },
    { label: 'Taxa de Cumprimento', valor: '96%', estado: 'Fiável', tipo: 'ok' },
    { label: 'Avaliação Média', valor: '4.7/5', estado: 'Boa Reputação', tipo: 'ok' },
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(SINAGEPE.kpiCard).join('');

  const meus = data.marketplace.anuncios.filter(a => a.vendedor === 'Importadora Silva Lda.');
  const ESTADO_TIPO = { 'Activo': 'ok', 'Em Negociação': 'warn', 'Vendido': 'info' };
  document.getElementById('anuncios-list').innerHTML = (meus.length ? meus : data.marketplace.anuncios.slice(0,1)).map(a => `
    <div class="medida-row"><span>${a.produto} — ${a.quantidadeT} t</span><span class="state-tag" style="background:var(--${ESTADO_TIPO[a.estado]}-bg);color:var(--${ESTADO_TIPO[a.estado]})">${a.estado}</span></div>`).join('');
});
</script>
</body>
</html>
