<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Consumidor — Preços</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app-consumidor.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><b>09:41</b><span class="status-icons">📶 📡 🔋</span></div>
  <div class="mob-header">
    <div class="mob-title">Preços Hoje</div>
    <div class="mob-sub">Tabela diária de produtos essenciais em Maputo</div>
  </div>
  <div class="mob-content">
    <div class="mob-card" id="precos-card"></div>
  </div>
  <div class="bottom-nav">
    <a class="nav-tab" href="app-consumidor-home.html"><span class="ic">🏠</span>Início</a>
    <a class="nav-tab active" href="app-consumidor-precos.html"><span class="ic">📈</span>Preços</a>
    <a class="nav-tab" href="app-consumidor-mapa.html"><span class="ic">🗺️</span>Mapa</a>
    <a class="nav-tab" href="app-consumidor-alertas.html"><span class="ic">🔔</span>Alertas</a>
  </div>
</div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  const ESTADO_COR = { 'Excelente':'var(--mob-teal)','Estável':'var(--mob-teal)','Atenção':'var(--mob-amber)','Crítico':'var(--mob-red)' };
  document.getElementById('precos-card').innerHTML = data.balancoNacional.map(p => `
    <a href="app-consumidor-produto-detalhe.html?produto=${encodeURIComponent(p.produto)}" style="text-decoration:none">
    <div class="price-row">
      <div><div style="color:var(--mob-ink);font-weight:700;font-size:14px">${p.produto}</div><div style="color:var(--mob-dim);font-size:11px">${p.cobertura} dias de cobertura</div></div>
      <span class="pill-tag" style="color:${ESTADO_COR[p.estado]};background:${ESTADO_COR[p.estado]}1a">${p.estado}</span>
    </div></a>`).join('');
});
</script>
</body>
</html>
