<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhe da Oferta — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .breadcrumb { font-size: 12px; color: var(--ink-faint); margin-bottom: 4px; }
  .page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-title { font-size: 24px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 14px; }
  .back-btn { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--bronze); }
</style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('painel', 'Atlas de Monitoria de Mercadorias e Corredores', 'Sistema Vivo');
const params = new URLSearchParams(location.search);

document.getElementById('content-mount').innerHTML = `
  <div class="page-title-row">
    <div><div class="breadcrumb">Marketplace B2B &gt; Oferta</div>
    <div class="page-title" id="of-titulo">—</div></div>
    <a class="back-btn" href="marketplace-b2b.html">← Voltar ao Marketplace</a>
  </div>
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)" id="kpi-row"></div>
  <div class="card">
    <div class="card-title">Detalhes da Oferta</div>
    <div id="of-detalhes"></div>
  </div>
`;

SINAGEPE.load().then(data => {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = data.meta.ultimaActualizacao;

  const id = params.get('id');
  const a = data.marketplace.anuncios.find(x => x.id === id) || data.marketplace.anuncios[0];
  const ESTADO_TIPO = { 'Activo': 'ok', 'Em Negociação': 'warn', 'Vendido': 'info' };
  document.getElementById('of-titulo').innerHTML = `${a.produto} <span class="pill pill-${ESTADO_TIPO[a.estado]}">${a.estado}</span>`;

  const kpis = [
    { label: 'Quantidade Disponível', valor: a.quantidadeT + ' t', estado: a.provincia, tipo: 'info' },
    { label: 'Preço por Tonelada', valor: SINAGEPE.fmt(a.precoMznT) + ' MZN/t', estado: 'Mercado', tipo: 'ok' },
    { label: 'Valor Total da Oferta', valor: SINAGEPE.fmt(a.quantidadeT * a.precoMznT) + ' MZN', estado: 'Estimado', tipo: 'ok' },
    { label: 'Vendedor', valor: a.vendedor, estado: 'Verificado', tipo: 'info' },
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(SINAGEPE.kpiCard).join('');

  document.getElementById('of-detalhes').innerHTML = `
    <div class="medida-row"><span>Código da Oferta</span><span>#${a.id}</span></div>
    <div class="medida-row"><span>Localização</span><span>${a.provincia}</span></div>
    <div class="medida-row"><span>Estado da Negociação</span><span>${a.estado}</span></div>`;
});
</script>
</body>
</html>
