<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhe de Corredor — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .route-trace { display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 18px 4px; }
  .route-point { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 92px; flex-shrink: 0; }
  .route-dot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--navy-950); }
  .route-dot.ok { background: var(--ok); } .route-dot.warn { background: var(--warn); } .route-dot.crit { background: var(--crit); }
  .route-name { font-size: 11px; font-weight: 600; text-align: center; }
  .route-code { font-family: var(--font-data); font-size: 9.5px; color: var(--ink-faint); }
  .route-segment { height: 3px; width: 56px; flex-shrink: 0; margin-bottom: 22px; }
  .route-segment.ok { background: var(--ok); } .route-segment.warn { background: var(--warn); } .route-segment.crit { background: var(--crit); }
  .btn-action { background: var(--bronze); color: var(--navy-950); border: none; border-radius: 8px; padding: 10px 18px; font-family: var(--font-body); font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn-action:disabled { background: var(--navy-700); color: var(--ink-faint); cursor: default; }
</style>
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('logistica', 'Detalhe de Corredor', 'Drill-down · Mapa Nacional / Logística');

document.getElementById('content-mount').innerHTML = `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <div>
        <div class="card-title" id="corredor-nome">—</div>
        <div class="card-subtitle" style="margin-bottom:0" id="corredor-rota">—</div>
      </div>
      <div id="corredor-estado-badge"></div>
    </div>
    <div style="font-size:12px;color:var(--ink-faint);margin-bottom:4px">Índice de Acessibilidade (IAM) deste corredor</div>
    <div class="kpi-value" id="corredor-iam" style="font-size:20px"></div>
  </div>

  <div class="card">
    <div class="card-title">Esquema de Vias e Pontos de Trânsito</div>
    <div class="card-subtitle">Estado por ponto e por segmento — a rota é fixa, só o estado muda</div>
    <div class="route-trace" id="route-trace"></div>
  </div>

  <div class="row-3" id="cartoes-op"></div>

  <div class="row-2">
    <div class="card">
      <div class="card-title">Utilização e Histórico de Carga</div>
      <div class="card-subtitle">Capacidade actual e tendência de fluxo (30 dias)</div>
      <canvas id="chart-util" height="160"></canvas>
    </div>
    <div class="card">
      <div class="card-title">Alertas Activos no Corredor</div>
      <div id="alertas-list"></div>
    </div>
  </div>

  <div class="card" style="background:var(--navy-800);border-color:var(--bronze-dim)">
    <div class="kpi-label">Rota Alternativa Recomendada (IA)</div>
    <div style="font-size:16px;font-weight:700;margin:8px 0 14px" id="rota-nome">—</div>
    <div style="display:flex;gap:32px;margin-bottom:16px">
      <div><div style="font-size:11px;color:var(--ink-faint)">Tempo Estimado</div><div class="kpi-value" id="rota-tempo" style="font-size:18px;color:var(--ok)"></div></div>
      <div><div style="font-size:11px;color:var(--ink-faint)">Custo de Frete</div><div class="kpi-value" id="rota-custo" style="font-size:18px;color:var(--ok)"></div></div>
    </div>
    <button class="btn-action" id="btn-desvio">Solicitar Desvio de Carga</button>
    <div id="desvio-status" style="margin-top:10px;font-size:12px;color:var(--ink-dim)"></div>
  </div>
`;

SINAGEPE.load().then(renderDetalheCorredor);

function renderDetalheCorredor(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  const d = data.corredorDetalhe;
  document.getElementById('corredor-nome').textContent = d.corredor;
  document.getElementById('corredor-rota').textContent = 'Rota: ' + d.rota;
  document.getElementById('corredor-iam').textContent = Math.round(d.iam * 100) + '%';

  // estado geral do corredor = pior estado entre pontos e segmentos (secção 19 do documento)
  const todosEstados = [...d.pontosTransito.map(p => p.estado), ...d.segmentos.map(s => s.estado)];
  const piorEstado = todosEstados.includes('Bloqueado') ? { texto: 'Fluxo Condicionado', tipo: 'warn' }
    : todosEstados.includes('Atenção') ? { texto: 'Fluxo Condicionado', tipo: 'warn' }
    : { texto: 'Fluxo Normal', tipo: 'ok' };
  document.getElementById('corredor-estado-badge').innerHTML = `<span class="pill pill-${piorEstado.tipo}">${piorEstado.texto}</span>`;

  // esquema de pontos e segmentos
  const TIPO = { 'Livre': 'ok', 'Atenção': 'warn', 'Bloqueado': 'crit' };
  let trace = '';
  d.pontosTransito.forEach((p, i) => {
    trace += `<div class="route-point">
      <div class="route-dot ${TIPO[p.estado]}" title="${p.estado}${p.motivo ? ' — ' + p.motivo : ''}"></div>
      <div class="route-name">${p.nome}</div>
      <div class="route-code">${p.codigo}</div>
    </div>`;
    if (i < d.segmentos.length) {
      trace += `<div class="route-segment ${TIPO[d.segmentos[i].estado]}"></div>`;
    }
  });
  document.getElementById('route-trace').innerHTML = trace;

  // cartões de operacionalidade — limiar confirmado: <70 Crítico, 70-99 Atenção, 100 Normal
  function cartaoOp(label, ok, total, sufixo) {
    const pct = Math.round((ok / total) * 100);
    const estado = pct === 100 ? { t: 'Normal', tipo: 'ok' } : pct >= 70 ? { t: 'Atenção', tipo: 'warn' } : { t: 'Crítico', tipo: 'crit' };
    return `<div class="card">
      <div class="kpi-label">${label}</div>
      <div class="kpi-value-row" style="margin-bottom:8px"><div class="kpi-value">${pct}%</div><span class="pill pill-${estado.tipo}">${estado.t}</span></div>
      <div style="font-size:12px;color:var(--ink-dim)">${ok} / ${total} ${sufixo}</div>
    </div>`;
  }
  document.getElementById('cartoes-op').innerHTML =
    cartaoOp('Estradas (km)', d.cartoes.estradas.operacionalKm, d.cartoes.estradas.totalKm, 'km transitáveis') +
    cartaoOp('Pontes Críticas', d.cartoes.pontes.operacionais, d.cartoes.pontes.total, 'pontes operacionais') +
    cartaoOp('Terminais Logísticos', d.cartoes.terminais.operacionais, d.cartoes.terminais.total, 'terminais activos');

  // alertas
  const SEV_TIPO = { 'Crítico': 'crit', 'Atenção': 'warn' };
  document.getElementById('alertas-list').innerHTML = d.alertas.map(a => `
    <div class="alert-card ${SEV_TIPO[a.severidade]}">
      <div class="alert-title">${a.titulo}</div>
      <div class="alert-meta">${a.severidade} · ${a.tempo}</div>
      <div class="alert-desc">${a.descricao}</div>
    </div>`).join('');

  // gráfico de utilização
  new Chart(document.getElementById('chart-util'), {
    type: 'line',
    data: {
      labels: d.tendenciaFluxo30dias.map((_, i) => `D${(i + 1) * 4}`),
      datasets: [{ label: 'Ocupação %', data: d.tendenciaFluxo30dias, borderColor: '#d9a441', backgroundColor: 'rgba(217,164,65,0.12)', fill: true, tension: 0.35, pointRadius: 3 }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#5f6d90', font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: '#5f6d90', font: { size: 10 } }, grid: { color: 'rgba(179,130,74,0.08)' } },
      }
    }
  });

  // rota alternativa + acção (simulada — sem backend real, ver documento secção 24)
  document.getElementById('rota-nome').textContent = d.rotaAlternativa.nome;
  document.getElementById('rota-tempo').textContent = d.rotaAlternativa.tempoEstimadoDelta;
  document.getElementById('rota-custo').textContent = 'Poupe ' + d.rotaAlternativa.poupancaPercent + '% por ton';

  document.getElementById('btn-desvio').addEventListener('click', function () {
    this.disabled = true;
    this.textContent = 'Pedido Enviado';
    document.getElementById('desvio-status').innerHTML =
      '⏳ Pedido registado — aguarda aprovação conjunta do Ministério dos Transportes e do MIC. (Simulação — sem envio real neste protótipo.)';
  });
}
</script>
</body>
</html>
