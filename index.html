<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Nacional — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('painel', 'Painel Nacional', 'Disponibilidade Física · Governo');

document.getElementById('content-mount').innerHTML = `
  <div class="kpi-row" id="kpi-row"></div>
  <div class="row-2">
    <div class="card">
      <div class="card-title">Disponibilidade por Província</div>
      <div class="card-subtitle">Percentagem do stock mínimo estratégico coberto, por província</div>
      <div class="province-grid" id="province-grid"></div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--ok)"></span> Normal (&ge;80%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span> Aviso (50&ndash;80%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--crit)"></span> Ruptura (&lt;50%)</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Alertas por Severidade</div>
      <div class="card-subtitle" id="alertas-subtitle">A carregar...</div>
      <canvas id="chart-alertas" height="180"></canvas>
    </div>
  </div>
  <div class="row-2">
    <div class="card">
      <div class="card-title"><a href="balanco-nacional-vivo.html" style="color:inherit">Balanço Nacional Vivo →</a></div>
      <div class="card-subtitle">Stock, fluxos e cobertura por produto essencial</div>
      <table class="balance-table">
        <thead><tr><th>Produto</th><th>Stock</th><th>Prod.</th><th>Import.</th><th>Export.</th><th>Consumo</th><th>Cobertura</th><th>Estado</th></tr></thead>
        <tbody id="balance-body"></tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-title">Tendência de Preços</div>
      <div class="card-subtitle">MZN/kg, últimos 6 meses</div>
      <canvas id="chart-precos" height="200"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Outros Módulos, Dashboards e Portais</div>
    <div class="card-subtitle">Ecrãs sem item próprio na sidebar principal — acesso directo aqui</div>
    <div class="row-2">
      <div>
        <div class="kpi-label" style="margin-bottom:8px">Dashboards Sectoriais</div>
        <div class="medida-row"><a href="dashboard-agricultura.html" style="color:var(--bronze-light)">Agricultura (MASA)</a></div>
        <div class="medida-row"><a href="dashboard-financas.html" style="color:var(--bronze-light)">Finanças</a></div>
        <div class="medida-row"><a href="dashboard-banco-central.html" style="color:var(--bronze-light)">Banco Central</a></div>
        <div class="medida-row"><a href="dashboard-transportes.html" style="color:var(--bronze-light)">Transportes</a></div>
      </div>
      <div>
        <div class="kpi-label" style="margin-bottom:8px">Fiscalização e Regulação</div>
        <div class="medida-row"><a href="dashboard-igsae.html" style="color:var(--bronze-light)">IGSAE</a></div>
        <div class="medida-row"><a href="dashboard-arc.html" style="color:var(--bronze-light)">ARC (Concorrência)</a></div>
      </div>
    </div>
    <div class="row-2" style="margin-top:14px">
      <div>
        <div class="kpi-label" style="margin-bottom:8px">Portais por Agente Económico</div>
        <div class="medida-row"><a href="portal-empresas.html" style="color:var(--bronze-light)">Empresas</a></div>
        <div class="medida-row"><a href="portal-produtores.html" style="color:var(--bronze-light)">Produtores</a></div>
        <div class="medida-row"><a href="portal-comerciantes.html" style="color:var(--bronze-light)">Comerciantes</a></div>
        <div class="medida-row"><a href="portal-transportadores.html" style="color:var(--bronze-light)">Transportadores</a></div>
      </div>
      <div>
        <div class="kpi-label" style="margin-bottom:8px">Parceiros Institucionais</div>
        <div class="medida-row"><a href="portal-bancos.html" style="color:var(--bronze-light)">Bancos</a></div>
        <div class="medida-row"><a href="portal-universidades.html" style="color:var(--bronze-light)">Universidades</a></div>
        <div class="medida-row"><a href="portal-parceiros.html" style="color:var(--bronze-light)">Parceiros Internacionais</a></div>
      </div>
    </div>
  </div>
`;

SINAGEPE.load().then(renderPainelNacional);

function renderPainelNacional(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  const k = data.kpis;
  // Alertas Activos, Produtos Críticos e Severidade calculados a partir dos
  // dados reais (alertasDetalhe / balancoNacional) — não hardcoded, para nunca
  // ficarem desalinhados como aconteceu na primeira versão deste ecrã.
  const alertasActivos = data.alertasDetalhe.length;
  const produtosCriticos = data.balancoNacional.filter(p => p.estado === 'Crítico').length;
  const severidadeCount = { Crítico: 0, Atenção: 0, Normal: 0 };
  data.alertasDetalhe.forEach(a => { severidadeCount[a.severidade] = (severidadeCount[a.severidade] || 0) + 1; });

  const kpiDefs = [
    { label: 'Disponibilidade Nacional (Stock Físico)', valor: k.disponibilidadeNacional.valor + '%', estado: k.disponibilidadeNacional.estado, tipo: 'warn' },
    { label: 'Dias de Cobertura (Média)', valor: k.diasCoberturaMedia.valor, estado: k.diasCoberturaMedia.estado, tipo: 'ok' },
    { label: 'Alertas Activos', valor: alertasActivos, estado: alertasActivos > 0 ? 'Atenção' : 'Normal', tipo: alertasActivos > 0 ? 'warn' : 'ok' },
    { label: 'Produtos Críticos', valor: produtosCriticos, estado: produtosCriticos > 0 ? 'Crítico' : 'Normal', tipo: produtosCriticos > 0 ? 'crit' : 'ok' },
    { label: 'Importações em Trânsito', valor: k.importacoesTransito.valor + 'k ton', estado: k.importacoesTransito.estado, tipo: 'info' },
    { label: 'Índice Logístico Nacional', valor: k.indiceLogisticoNacional.valor, estado: k.indiceLogisticoNacional.estado, tipo: 'info' },
  ];
  document.getElementById('alertas-subtitle').innerHTML = `${alertasActivos} alertas activos a nível nacional — <a href="alertas.html" style="color:var(--bronze-light)">ver todos</a>`;
  document.getElementById('kpi-row').innerHTML = kpiDefs.map(SINAGEPE.kpiCard).join('');

  document.getElementById('province-grid').innerHTML = data.provincias.map(p => {
    const cls = p.disponibilidade >= 80 ? 'tile-ok' : p.disponibilidade >= 50 ? 'tile-warn' : 'tile-crit';
    const nomeHtml = p.nome === data.painelProvincial.provincia
      ? `<a href="painel-provincial.html" style="color:inherit;text-decoration:underline">${p.nome}</a>`
      : p.nome;
    return `<div class="province-tile ${cls}"><div class="province-name">${nomeHtml}</div><div class="province-value">${p.disponibilidade}%</div></div>`;
  }).join('');

  document.getElementById('balance-body').innerHTML = data.balancoNacional.map(row => `<tr>
      <td>${row.produto}</td><td>${SINAGEPE.fmt(row.stock)}</td><td>${SINAGEPE.fmt(row.producao)}</td>
      <td>${SINAGEPE.fmt(row.importacao)}</td><td>${SINAGEPE.fmt(row.exportacao)}</td><td>${SINAGEPE.fmt(row.consumo)}</td>
      <td>${row.cobertura} dias</td><td>${SINAGEPE.stateTag(row.estado)}</td>
    </tr>`).join('');

  new Chart(document.getElementById('chart-alertas'), {
    type: 'doughnut',
    data: { labels: ['Crítico', 'Atenção', 'Normal'], datasets: [{
      data: [severidadeCount['Crítico'], severidadeCount['Atenção'], severidadeCount['Normal']],
      backgroundColor: ['#e2555c', '#e0a83e', '#3ecf8e'], borderWidth: 0 }] },
    options: { plugins: { legend: { position: 'bottom', labels: { color: '#97a3c2', font: { size: 11 }, boxWidth: 10 } } }, cutout: '68%' }
  });

  new Chart(document.getElementById('chart-precos'), {
    type: 'line',
    data: { labels: data.precoTendencia.meses, datasets: data.precoTendencia.series.map(s => ({
      label: s.nome, data: s.valores, borderColor: s.cor, backgroundColor: s.cor, tension: 0.35, pointRadius: 3 })) },
    options: {
      plugins: { legend: { position: 'bottom', labels: { color: '#97a3c2', font: { size: 11 }, boxWidth: 10 } } },
      scales: {
        x: { ticks: { color: '#5f6d90', font: { size: 10 } }, grid: { color: 'rgba(179,130,74,0.08)' } },
        y: { ticks: { color: '#5f6d90', font: { size: 10 } }, grid: { color: 'rgba(179,130,74,0.08)' } },
      }
    }
  });
}
</script>
</body>
</html>
