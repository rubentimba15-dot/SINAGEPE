<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Agricultura — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('painel', 'Dashboard Agricultura', 'MASA — Ministério da Agricultura e Desenvolvimento Rural');

document.getElementById('content-mount').innerHTML = `
  <div class="kpi-row" style="grid-template-columns:repeat(5,1fr)" id="kpi-row"></div>

  <div class="row-2">
    <div class="card">
      <div class="card-title">Produtividade por Província (t/ha)</div>
      <div class="card-subtitle">Alta &gt;2,5 t/ha · Moderada 1,2&ndash;2,5 · Crítica &lt;1,2</div>
      <div id="produtividade-list"></div>
    </div>
    <div class="card">
      <div class="card-title">Calendário Agrícola por Região</div>
      <div id="calendario-list"></div>
    </div>
  </div>

  <div class="row-2">
    <div class="card">
      <div class="card-title">Produção por Cultura — % da Meta</div>
      <canvas id="chart-cultura" height="180"></canvas>
    </div>
    <div class="card">
      <div class="card-title">Alertas Agrícolas Activos</div>
      <div id="alertas-agricolas"></div>
    </div>
  </div>
`;

SINAGEPE.load().then(renderDashboardAgricultura);

function renderDashboardAgricultura(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  const a = data.dashboardAgricultura;
  const kpiDefs = [
    { label: 'Produção Estimada', valor: (a.kpis.producaoEstimadaTon / 1e6).toFixed(2) + 'M ton', estado: 'Normal', tipo: 'ok' },
    { label: 'Área Cultivada', valor: (a.kpis.areaCultivadaHa / 1e6).toFixed(2) + 'M ha', estado: 'Estável', tipo: 'info' },
    { label: 'Previsão Próx. Safra', valor: (a.kpis.previsaoProxSafraTon / 1e6).toFixed(2) + 'M ton', estado: '+9.8%', tipo: 'ok' },
    { label: 'Taxa de Auto-Suficiência', valor: a.kpis.taxaAutoSuficienciaPercent + '%', estado: 'Alerta', tipo: 'warn' },
    { label: 'Produtores Registados', valor: (a.kpis.produtoresRegistados / 1e6).toFixed(2) + 'M', estado: 'Estável', tipo: 'info' },
  ];
  document.getElementById('kpi-row').innerHTML = kpiDefs.map(SINAGEPE.kpiCard).join('');

  document.getElementById('produtividade-list').innerHTML = a.produtividadeProvincial.map(p => {
    const tipo = p.tHa > 2.5 ? 'ok' : p.tHa >= 1.2 ? 'warn' : 'crit';
    return `<div class="medida-row"><span>${p.provincia}</span><span class="state-tag" style="background:var(--${tipo}-bg);color:var(--${tipo})">${p.tHa} t/ha</span></div>`;
  }).join('');

  document.getElementById('calendario-list').innerHTML = a.calendarioRegional.map(c => `
    <div class="medida-row" style="display:block;padding:10px 0">
      <div style="display:flex;justify-content:space-between"><b style="font-size:12.5px">${c.regiao}</b><span class="pill pill-info">${c.fase}</span></div>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:3px">${c.provincias}</div>
      <div style="font-size:12px;color:var(--ink-dim);margin-top:3px">${c.nota}</div>
    </div>`).join('');

  new Chart(document.getElementById('chart-cultura'), {
    type: 'bar',
    data: { labels: a.producaoCultura.map(c => c.cultura), datasets: [{ data: a.producaoCultura.map(c => c.percentMeta), backgroundColor: '#d9a441', borderRadius: 6 }] },
    options: {
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: '#97a3c2', font: { size: 10.5 } }, grid: { display: false } }, y: { ticks: { color: '#5f6d90', font: { size: 10 } }, grid: { color: 'rgba(179,130,74,0.08)' } } }
    }
  });

  const SEV_TIPO = { 'Crítico': 'crit', 'Atenção': 'warn', 'Favorável': 'ok' };
  document.getElementById('alertas-agricolas').innerHTML = a.alertas.map(al => `
    <div class="alert-card ${SEV_TIPO[al.severidade]}"><div class="alert-title">${al.provincia} — ${al.titulo}</div><div class="alert-meta">${al.severidade}</div></div>`).join('');
}
</script>
</body>
</html>
