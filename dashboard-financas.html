<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Finanças — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="assets/chart.umd.min.js"></script>
<script>
/* A biblioteca de gráficos vinha de cdnjs.cloudflare.com, num endereço que
   nunca existiu: a versão 4.4.4 não está publicada nesse repositório, e o
   pedido devolvia sempre 404. Consequência: `new Chart(...)` rebentava e
   interrompia a função de desenho, deixando em branco não só o gráfico mas
   tudo o que vinha depois dele no ecrã — sem aviso nenhum ao utilizador.

   Passa a ser servida do próprio repositório (assets/chart.umd.min.js,
   versão 4.4.1), pelo que funciona sem Internet e sem depender de terceiros.

   O bloco abaixo é a rede de segurança: se um dia a biblioteca faltar, cada
   tela de gráfico é substituída por uma linha a dizê-lo, e o resto do ecrã
   continua a desenhar. Um gráfico em falta deve declarar-se, não desaparecer
   em silêncio nem levar o ecrã atrás. */
if (typeof Chart === 'undefined') {
  window.Chart = function (alvo) {
    var tela = alvo && alvo.canvas ? alvo.canvas : alvo;
    if (tela && tela.parentNode) {
      var aviso = document.createElement('div');
      aviso.className = 'grafico-indisponivel';
      aviso.textContent = 'Gráfico indisponível — a biblioteca de gráficos não carregou.';
      aviso.style.cssText = 'display:flex;align-items:center;justify-content:center;' +
        'min-height:120px;padding:18px;border:1px dashed rgba(237,184,110,.62);' +
        'border-radius:10px;color:#C2D1E4;font-size:12px;text-align:center';
      tela.parentNode.replaceChild(aviso, tela);
    }
    return { destroy: function () {}, update: function () {}, resize: function () {} };
  };
}
</script>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('dash-financas', 'Dashboard Finanças', 'Ministério das Finanças — Receita e Fugas Fiscais');

document.getElementById('content-mount').innerHTML = `
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)" id="kpi-row-1"></div>
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)" id="kpi-row-2"></div>

  <div class="row-2">
    <div class="card">
      <div class="card-title">Arrecadação de Receita por Produto</div>
      <canvas id="chart-receita" height="200"></canvas>
    </div>
    <div class="card">
      <div class="card-title">Análise Detalhada de Fugas &amp; Perdas Fiscais</div>
      <div class="card-subtitle">Calculadas de forma independente — não vêm do módulo IRAE</div>
      <div id="perdas-list"></div>
    </div>
  </div>

  <div class="row-2">
    <div class="card">
      <div class="card-title">Impacto Macroeconómico</div>
      <div class="medida-row"><span>Contribuição no PIB</span><span style="color:var(--ok)" id="pib-valor"></span></div>
      <div class="medida-row"><span>Balança Comercial (Défice Alimentar)</span><span style="color:var(--crit)" id="balanca-valor"></span></div>
    </div>
    <div class="card" style="background:var(--navy-800);border-color:var(--bronze-dim)">
      <div class="kpi-label" style="margin-bottom:8px">Recomendações da Inteligência IA</div>
      <ol id="recomendacoes-list" style="font-size:12.5px;color:var(--ink-dim);padding-left:18px;line-height:1.8;margin:0"></ol>
    </div>
  </div>
`;

SINAGEPE.load().then(renderDashboardFinancas);

function renderDashboardFinancas(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  const f = data.dashboardFinancas;
  const kpi1 = [
    { label: 'Receita Fiscal Estimada', valor: (f.kpis.receitaFiscalEstimadaMzn / 1e9).toFixed(1) + 'B MZN', estado: 'Ideal', tipo: 'ok' },
    { label: 'IVA Potencial (Essenciais)', valor: (f.kpis.ivaPotencialMzn / 1e6).toFixed(0) + 'M MZN', estado: 'Forte', tipo: 'ok' },
    { label: 'Importações (CIF, Mês)', valor: (f.kpis.importacoesCifUsd / 1e6).toFixed(0) + 'M USD', estado: '+4% MoM', tipo: 'info' },
  ];
  const kpi2 = [
    { label: 'Exportações FOB', valor: (f.kpis.exportacoesFobUsd / 1e6).toFixed(0) + 'M USD', estado: 'Estável', tipo: 'info' },
    { label: 'Perdas Fiscais Estimadas', valor: f.kpis.perdasFiscaisPercent + '%', estado: 'Aviso', tipo: 'warn' },
    { label: 'Evolução do Consumo', valor: '+' + f.kpis.evolucaoConsumoPercent + '%', estado: 'Crescendo', tipo: 'ok' },
  ];
  document.getElementById('kpi-row-1').innerHTML = kpi1.map(SINAGEPE.kpiCard).join('');
  document.getElementById('kpi-row-2').innerHTML = kpi2.map(SINAGEPE.kpiCard).join('');

  new Chart(document.getElementById('chart-receita'), {
    type: 'bar',
    data: { labels: f.receitaPorProduto.map(p => p.produto), datasets: [{ data: f.receitaPorProduto.map(p => p.valorMzn / 1e6), backgroundColor: '#5b8ac9', borderRadius: 6 }] },
    options: {
      indexAxis: 'y', plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: '#9DB0C8', font: { size: 10 } }, grid: { color: 'rgba(179,130,74,0.08)' } }, y: { ticks: { color: '#97a3c2', font: { size: 10.5 } }, grid: { display: false } } }
    }
  });

  document.getElementById('perdas-list').innerHTML = f.perdasFiscais.map(p => `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between"><b style="font-size:12.5px">${p.tipo}</b><span style="color:var(--crit);font-family:var(--font-data)">-${(p.valorAnualMzn / 1e6).toFixed(0)}M MZN/ano</span></div>
      <div style="font-size:11.5px;color:var(--ink-faint);margin-top:3px">${p.descricao}</div>
    </div>`).join('');

  document.getElementById('pib-valor').textContent = '+' + f.impactoMacro.contribuicaoPibPercent + '%';
  document.getElementById('balanca-valor').textContent = (f.impactoMacro.balancaComercialUsd / 1e6).toFixed(0) + 'M USD';
  document.getElementById('recomendacoes-list').innerHTML = f.recomendacoes.map(r => `<li>${r}</li>`).join('');
}
</script>
</body>
</html>
