<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Armazéns — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('armazens', 'Cadastro de Armazéns', 'Registo Cadastral + Estado Vivo');

document.getElementById('content-mount').innerHTML = `
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)" id="kpi-row"></div>

  <div class="card">
    <div class="card-title">Inventário de Armazéns</div>
    <div class="card-subtitle">Clica numa linha para ver o detalhe (distribuição de stock e condições de conservação)</div>
    <table class="balance-table">
      <thead><tr><th>Nome</th><th>Província</th><th>Operador</th><th>Capacidade</th><th>Ocup.</th><th>Condição</th><th>Últ. Inspecção</th></tr></thead>
      <tbody id="armazens-body"></tbody>
    </table>
  </div>

  <div class="card" id="detalhe-armazem" style="display:none"></div>
`;

SINAGEPE.load().then(renderCadastroArmazens);

function renderCadastroArmazens(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  const arm = data.armazens;
  const capacidadeTotal = arm.reduce((a, w) => a + w.capacidadeTotalT, 0);
  const ocupacaoMedia = Math.round(arm.reduce((a, w) => a + w.ocupacaoPercent, 0) / arm.length);
  const criticos = arm.filter(w => w.ocupacaoPercent > 95).length;

  const kpiDefs = [
    { label: 'Total de Armazéns', valor: arm.length, estado: 'Registado', tipo: 'info' },
    { label: 'Capacidade Total', valor: (capacidadeTotal / 1000).toFixed(1) + 'k t', estado: 'Normal', tipo: 'ok' },
    { label: 'Ocupação Média', valor: ocupacaoMedia + '%', estado: ocupacaoMedia > 80 ? 'Elevada' : 'Estável', tipo: ocupacaoMedia > 80 ? 'warn' : 'ok' },
    { label: 'Armazéns Críticos', valor: criticos, estado: criticos > 0 ? 'Ocupação Extrema' : 'Nenhum', tipo: criticos > 0 ? 'crit' : 'ok' },
  ];
  document.getElementById('kpi-row').innerHTML = kpiDefs.map(SINAGEPE.kpiCard).join('');

  // ocupação: Normal <60 / Aviso 60-80 / Alerta 80-95 / Crítico >95
  function classificaOcupacao(pct) {
    if (pct > 95) return { t: 'Crítico', tipo: 'crit' };
    if (pct >= 80) return { t: 'Alerta', tipo: 'warn' };
    if (pct >= 60) return { t: 'Aviso', tipo: 'warn' };
    return { t: 'Normal', tipo: 'ok' };
  }
  const CONDICAO_TIPO = { 'Boa': 'ok', 'Razoável': 'warn', 'Deficiente': 'crit' };

  document.getElementById('armazens-body').innerHTML = arm.map((w, i) => {
    const oc = classificaOcupacao(w.ocupacaoPercent);
    return `<tr style="cursor:pointer" data-idx="${i}">
      <td>${w.nome}<div style="font-family:var(--font-data);font-size:10px;color:var(--ink-faint)">${w.codigo}</div></td>
      <td>${w.provincia}</td><td>${w.operador}</td><td>${SINAGEPE.fmt(w.capacidadeTotalT)} t</td>
      <td><span class="state-tag" style="background:var(--${oc.tipo}-bg);color:var(--${oc.tipo})">${w.ocupacaoPercent}% ${oc.t}</span></td>
      <td><span class="state-tag" style="background:var(--${CONDICAO_TIPO[w.condicaoFisica]}-bg);color:var(--${CONDICAO_TIPO[w.condicaoFisica]})">${w.condicaoFisica}</span></td>
      <td>${w.ultimaInspeccao}</td>
    </tr>`;
  }).join('');

  document.querySelectorAll('#armazens-body tr').forEach(tr =>
    tr.addEventListener('click', () => renderDetalhe(arm[Number(tr.dataset.idx)])));

  // mostra o armazém com dados completos por defeito (o único com produtos + condições, secção 45-47 do documento)
  const primeiroCompleto = arm.find(w => w.produtos) || arm[0];
  renderDetalhe(primeiroCompleto);
}

function renderDetalhe(w) {
  const el = document.getElementById('detalhe-armazem');
  if (!w.produtos) {
    el.style.display = 'block';
    el.innerHTML = `<div class="card-title">${w.nome}</div><div class="card-subtitle" style="margin-bottom:0">Dados cadastrais registados. Distribuição de stock detalhada ainda não disponível para este armazém.</div>`;
    return;
  }
  el.style.display = 'block';
  const overcapacity = w.ocupacaoPercent > 95;
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
      <div><div class="card-title" style="margin-bottom:2px">${w.nome}</div><div class="card-subtitle" style="margin-bottom:0">${w.codigo} · ${w.provincia} · <a href="detalhe-armazem.html?codigo=${w.codigo}" style="color:var(--bronze)">Ver Detalhe Completo →</a></div></div>
      ${overcapacity ? '<span class="pill pill-crit">RUPTURA IMINENTE / OVERCAPACITY</span>' : ''}
    </div>
    <div class="row-2">
      <div>
        <div class="kpi-label" style="margin-bottom:10px">Distribuição de Armazenamento</div>
        <canvas id="chart-produtos" height="160"></canvas>
      </div>
      <div>
        <div class="kpi-label" style="margin-bottom:10px">Condições Físicas de Conservação</div>
        <div class="medida-row"><span>Tempo Médio de Permanência</span><span>${w.condicoesConservacao.tempoMedioPermanenciaDias} dias</span></div>
        <div class="medida-row"><span>Taxa de Perdas de Stock</span><span style="color:${w.condicoesConservacao.taxaPerdasPercent > 1 ? 'var(--warn)' : 'var(--ok)'}">${w.condicoesConservacao.taxaPerdasPercent}% ${w.condicoesConservacao.taxaPerdasPercent > 1 ? '(Acima da meta 1,0%)' : ''}</span></div>
        <div class="medida-row"><span>Humidade</span><span>${w.condicoesConservacao.humidadePercent}%</span></div>
        <div class="medida-row"><span>Temperatura</span><span>${w.condicoesConservacao.temperaturaC}°C</span></div>
        <div class="medida-row"><span>Pragas Detectadas</span><span>${w.condicoesConservacao.pragas}</span></div>
      </div>
    </div>`;

  new Chart(document.getElementById('chart-produtos'), {
    type: 'bar',
    data: {
      labels: w.produtos.map(p => p.produto),
      datasets: [{ data: w.produtos.map(p => p.toneladas), backgroundColor: ['#d9a441', '#5b8ac9', '#3ecf8e'], borderRadius: 6 }]
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#5f6d90', font: { size: 10 } }, grid: { color: 'rgba(179,130,74,0.08)' } },
        y: { ticks: { color: '#97a3c2', font: { size: 11 } }, grid: { display: false } },
      }
    }
  });
}
</script>
</body>
</html>
