<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clima e Desastres — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .alert-banner { background: var(--crit-bg); border: 1px solid var(--crit); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .alert-banner b { color: var(--crit); }
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .timeline-item { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('mapa', 'Clima e Desastres', 'Alertas Climáticos e Plano de Acção de Emergência');

document.getElementById('content-mount').innerHTML = `
  <div class="alert-banner" id="alert-banner"></div>

  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)" id="kpi-row"></div>

  <div class="row-2">
    <div class="card">
      <div class="card-title">Impacto Económico Estimado</div>
      <div class="card-subtitle">Cobertura calculada assumindo perda da rota em risco</div>
      <table class="balance-table">
        <thead><tr><th>Produto</th><th>Stock em Risco</th><th>Consumo Diário</th><th>Cobertura S/ Rota</th><th>Perda Estimada</th></tr></thead>
        <tbody id="impacto-body"></tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-title">Cronograma de Acção</div>
      <div class="card-subtitle">T-72h até T-0h, com instituição responsável por fase</div>
      <div class="timeline" id="cronograma-list"></div>
    </div>
  </div>
`;

SINAGEPE.load().then(renderClima);

function renderClima(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  const c = data.climaDesastres;
  document.getElementById('alert-banner').innerHTML = `
    <div><b>AVISO CRÍTICO:</b> ${c.alerta.nome} (Categoria ${c.alerta.categoria}) — landfall previsto em ${c.alerta.horasParaImpacto}h.</div>
    <div style="font-size:12px;color:var(--ink-dim)">Ventos ${c.alerta.ventoKmh} km/h · Precipitação &gt;${c.alerta.precipitacaoMm}mm · Corredores em risco: ${c.alerta.corredoresRisco.join(', ')}</div>
  `;

  const kpiDefs = [
    { label: 'Províncias em Risco', valor: c.kpis.provinciasRisco, estado: 'Aviso Vermelho', tipo: 'crit' },
    { label: 'Corredores Afectados', valor: c.kpis.corredoresAfectados, estado: 'Críticos', tipo: 'crit' },
    { label: 'Toneladas em Risco', valor: SINAGEPE.fmt(c.kpis.toneladasRisco) + ' t', estado: 'Monitorizar', tipo: 'warn' },
    { label: 'População Potencialmente Afectada', valor: SINAGEPE.fmt(c.kpis.populacaoAfectada), estado: 'Ajuda Humanitária', tipo: 'warn' },
  ];
  document.getElementById('kpi-row').innerHTML = kpiDefs.map(SINAGEPE.kpiCard).join('');

  document.getElementById('impacto-body').innerHTML = c.impactoEconomico.map(p => {
    const coberturaSemRota = Math.round(p.stockRiscoT / p.consumoDiarioT);
    return `<tr><td>${p.produto}</td><td>${SINAGEPE.fmt(p.stockRiscoT)} t</td><td>${p.consumoDiarioT} t/dia</td>
      <td><span class="state-tag" style="background:var(--crit-bg);color:var(--crit)">${coberturaSemRota} dias</span></td>
      <td>${SINAGEPE.fmt(p.perdaEstimadaUsd)} USD</td></tr>`;
  }).join('');

  const ESTADO_TIPO = { 'Concluído': 'ok', 'Em Progresso': 'warn', 'Agendado': 'info', 'Pendente': 'crit' };
  document.getElementById('cronograma-list').innerHTML = c.cronograma.map(f => `
    <div class="timeline-item">
      <div class="timeline-dot" style="background:var(--${ESTADO_TIPO[f.estado]})"></div>
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>${f.fase} — ${f.titulo}</span>
        <span class="state-tag" style="background:var(--${ESTADO_TIPO[f.estado]}-bg);color:var(--${ESTADO_TIPO[f.estado]})">${f.estado}</span></div>
        <div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px">${f.responsavel}</div>
      </div>
    </div>`).join('');
}
</script>
</body>
</html>
