<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Consumidor — Detalhe do Alerta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app-consumidor.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><b>09:41</b><span class="status-icons">📶 📡 🔋</span></div>
  <div class="mob-header">
    <a class="mob-back" href="app-consumidor-alertas.html">‹ Alertas</a>
  </div>
  <div class="mob-content">
    <div class="mob-card" id="alerta-card"></div>
  </div>
  <div class="bottom-nav">
    <a class="nav-tab" href="app-consumidor-home.html"><span class="ic">🏠</span>Início</a>
    <a class="nav-tab" href="app-consumidor-precos.html"><span class="ic">📈</span>Preços</a>
    <a class="nav-tab" href="app-consumidor-mapa.html"><span class="ic">🗺️</span>Mapa</a>
    <a class="nav-tab active" href="app-consumidor-alertas.html"><span class="ic">🔔</span>Alertas</a>
  </div>
</div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const a = data.alertasDetalhe.find(x => x.id === id) || data.alertasDetalhe[0];
  const SEV = { 'Crítico': ['var(--mob-red)','rgba(239,68,68,0.1)'], 'Atenção': ['var(--mob-amber)','rgba(245,158,11,0.1)'] };
  const [cor,bg] = SEV[a.severidade] || SEV['Atenção'];
  document.getElementById('alerta-card').innerHTML = `
    <span class="pill-tag" style="color:${cor};background:${bg}">${a.severidade}</span>
    <div style="color:var(--mob-ink);font-weight:800;font-size:19px;margin:10px 0 4px">${a.titulo}</div>
    <div style="color:var(--mob-dim);font-size:12px;margin-bottom:12px">${a.provincia} · ${a.tempo}</div>
    <div style="color:var(--mob-ink);font-size:13.5px;line-height:1.6">${a.descricao}</div>
  `;
});
</script>
</body>
</html>
