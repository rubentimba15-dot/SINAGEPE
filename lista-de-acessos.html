<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Acessos — SINAGEPE</title>
<script src="assets/access-control.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:40px 32px 70px;background:#040712;color:#f1f5f9;font-family:Inter,sans-serif}
  .wrap{max-width:1180px;margin:0 auto}
  .back{color:#d4a574;font-size:13px;margin-bottom:20px;display:inline-block;text-decoration:none}
  .back:hover{text-decoration:underline}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:18px;line-height:1.6;max-width:820px}
  .restrito{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid rgba(212,165,116,.45);
    background:rgba(212,165,116,.09);border-radius:5px;color:#d4a574;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;font-weight:600;margin-bottom:20px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;
    padding:0 12px 10px;border-bottom:1px solid rgba(30,45,75,.5);font-weight:600;white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid rgba(30,45,75,.4);font-size:13px;vertical-align:top}
  tr:hover td{background:rgba(30,45,75,.18)}
  .pin{font-family:'IBM Plex Mono',monospace;color:#d4a574;font-weight:600}
  .nome{font-weight:600}
  .inst{color:#94a3b8;font-size:11.5px}
  .ecras{color:#94a3b8;font-size:11px;line-height:1.5;max-width:400px}
  .n{font-family:'IBM Plex Mono',monospace;text-align:right;color:#cbd5e1}
  .entrada{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7c8ba1}
  .note{margin-top:26px;font-size:11.5px;color:#64748b;max-width:840px;line-height:1.65;
    border-top:1px solid rgba(30,45,75,.5);padding-top:16px}
  .note b{color:#94a3b8}
  .err{padding:20px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.07);
    border-radius:8px;color:#fca5a5;font-size:13px;line-height:1.6}
  .mono{font-family:'IBM Plex Mono',monospace}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Voltar ao Painel</a>
  <div class="restrito">Acesso restrito · Administrador</div>
  <h1>Lista Completa de Acessos</h1>
  <p class="sub" id="sub">A carregar a estrutura de acessos a partir do <span class="mono">index.html</span> publicado…</p>
  <div id="conteudo"></div>
  <div class="note" id="nota"></div>
</div>

<script>
/* Esta página lê o NIVEIS_ACESSO directamente do index.html que está publicado.
   Não guarda cópia. Assim deixa de ser possível ficar desactualizada quando se
   acrescenta um ecrã ou um parceiro — que foi exactamente o que aconteceu antes. */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function bonito(f){
  return f.replace(/\.html$/,'').split('-').map(function(p){return p.charAt(0).toUpperCase()+p.slice(1)}).join(' ');
}
fetch('index.html',{cache:'no-store'})
 .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status+' ao ler o index.html');return r.text()})
 .then(function(t){
   var m=t.match(/const NIVEIS_ACESSO = (\[[\s\S]*?\n\]);/);
   if(!m)throw new Error('Não encontrei o bloco NIVEIS_ACESSO no index.html');
   var nv=JSON.parse(m[1]);
   var demo=/const MODO_DEMO\s*=\s*true/.test(t);

   document.getElementById('sub').innerHTML=
     nv.length+' contas institucionais, cada uma com visibilidade limitada ao que precisa para a sua função. '
     +'Esta tabela é gerada a partir do <span class="mono">index.html</span> publicado, pelo que reflecte sempre o estado real do sistema.'
     +(demo?'<br><b style="color:#f0a926">Atenção: o modo demonstração está activo. As palavras-passe não estão a ser verificadas.</b>':'');

   var h='<table><thead><tr><th>PIN</th><th>E-mail</th><th>Entidade</th><th class="n">Ecrãs</th><th>Entrada</th><th>Acesso</th></tr></thead><tbody>';
   nv.forEach(function(n){
     var p=n.paginas||[];
     var amostra=p.slice(0,4).map(bonito).join(', ');
     h+='<tr>'
      +'<td class="pin">'+esc(n.pin||'—')+'</td>'
      +'<td>'+esc(n.email)+'</td>'
      +'<td><div class="nome">'+esc(n.nome||n.chave)+'</div><div class="inst">'+esc(n.instituicao||'')+'</div></td>'
      +'<td class="n">'+p.length+'</td>'
      +'<td class="entrada">'+esc(n.paginaInicial||'index.html')+'</td>'
      +'<td class="ecras">'+esc(amostra)+(p.length>4?' <span style="color:#64748b">(+'+(p.length-4)+' mais)</span>':'')+'</td>'
      +'</tr>';
   });
   h+='</tbody></table>';
   document.getElementById('conteudo').innerHTML=h;

   var total=nv.reduce(function(a,n){return a+(n.paginas||[]).length},0);
   document.getElementById('nota').innerHTML=
     '<b>Como ler.</b> A coluna Ecrãs conta as páginas que cada conta pode abrir. A coluna Entrada indica onde a sessão começa. '
     +'No total, '+total+' atribuições de acesso entre '+nv.length+' contas.'
     +'<br><br><b>Esta página é restrita.</b> Só a conta de Administrador a abre. Não mostra palavras-passe — o sistema guarda apenas o hash, que é irreversível por desenho. '
     +'As credenciais são distribuídas por via institucional e não são publicadas em nenhum ecrã.'
     +'<br><br><b>Limite estrutural, a repetir sempre.</b> Num sítio estático a restrição de acesso é feita do lado do navegador. '
     +'Os ficheiros são descarregáveis por endereço directo e os hashes estão visíveis no código-fonte. '
     +'Para dados reais do Estado, a validação tem de passar para o lado do servidor.';
 })
 .catch(function(e){
   document.getElementById('sub').textContent='';
   document.getElementById('conteudo').innerHTML=
     '<div class="err"><b>Não foi possível montar a lista.</b><br>'+esc(e.message)
     +'<br><br>Esta página tem de estar na mesma pasta que o <span class="mono">index.html</span> e ser aberta pelo endereço do site, não a partir do disco.</div>';
 });
</script>
</body>
</html>
