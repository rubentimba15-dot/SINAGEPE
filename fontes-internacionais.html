<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINAGEPE — Fontes Internacionais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#060B16; --sidebar-bg:#080E1B; --card-bg:#0C1626; --card-line:rgba(38,56,86,.75);
  --border-card:rgba(38,56,86,.75); --gold-line:rgba(201,138,60,.28);
  --gold:#C98A3C; --blue:#22B8F0; --teal:#2DD4BF; --amber:#F0A926; --red:#EF4444; --ok:#12B981;
  --crit:#EF4444; --warn:#F0A926; --info:#22B8F0;
  --ok-bg:rgba(18,185,129,.12); --warn-bg:rgba(240,169,38,.12); --crit-bg:rgba(239,68,68,.12); --info-bg:rgba(34,184,240,.12);
  --ink:#F3F7FC; --ink-dim:#8FA1B8; --ink-faint:#5E7189;
  --nav-active:#22B8F0; --nav-idle:#111E31;
  --brz:#C98A3C; --brzl:#E8BE7A; --brzg:rgba(201,138,60,.30);
  --acc:#22B8F0; --accg:rgba(34,184,240,.13); --t2:#C3D0E0; --cardh:#111E31;
  --bronze-light:#E8BE7A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg1);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 60% 40% at 12% 0%,rgba(34,184,240,.08),transparent 60%),radial-gradient(ellipse 50% 45% at 95% 100%,rgba(201,138,60,.09),transparent 60%);background-attachment:fixed}
a{color:inherit;text-decoration:none}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
#app-shell{display:flex;min-height:100vh}

/* ---- shell partilhado (classes de assets/sinagepe.js) ---- */
.sidebar{width:236px;flex:none;background:var(--sidebar-bg);border-right:1px solid var(--card-line);display:flex;flex-direction:column;justify-content:space-between;padding:20px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 18px;border-bottom:1px solid var(--gold-line)}
.brand-mark{width:38px;height:38px;border-radius:10px;border:1px solid var(--brzg);background:#0F1B2C;display:grid;place-items:center;color:var(--brzl);font-weight:600}
.brand-title{font-size:14px;font-weight:600;letter-spacing:.15em}
.brand-sub{font-size:9px;color:var(--brz);letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
.nav-list{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13px;color:var(--ink-dim);transition:.16s}
.nav-item:hover{background:var(--nav-idle);color:var(--ink)}
.nav-item.active{background:var(--accg);color:#fff;box-shadow:inset 2px 0 0 var(--nav-active)}
.nav-icon{width:16px;text-align:center;color:var(--brz)}
.sidebar-footer{display:flex;align-items:center;gap:10px;padding:13px 8px 0;border-top:1px solid var(--card-line)}
.avatar-dot{width:32px;height:32px;border-radius:9px;background:rgba(201,138,60,.16);color:var(--brzl);display:grid;place-items:center;font-size:11px;font-weight:600}
.sidebar-footer-name{font-size:12.5px}
.sidebar-footer-role{font-size:10px;color:var(--ink-faint)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--card-line);background:linear-gradient(100deg,#0B1524,#0A1421)}
.topbar-title{font-size:16px;font-weight:500}
.topbar-badge{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--brzl);border:1px solid var(--brzg);padding:3px 9px;border-radius:3px;margin-top:5px;display:inline-block}
.live-indicator{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,185,129,.5)}70%{box-shadow:0 0 0 9px rgba(18,185,129,0)}100%{box-shadow:0 0 0 0 rgba(18,185,129,0)}}
.content{flex:1;padding:22px 24px 40px}
.footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 24px;border-top:1px solid var(--card-line);font-size:10px;color:var(--ink-faint);letter-spacing:.05em}

/* ---- moldura de canto (assinatura) ---- */
.frame{position:relative}
.frame:before,.frame:after{content:"";position:absolute;width:15px;height:15px;pointer-events:none;z-index:2}
.frame:before{top:-1px;left:-1px;border-top:1.5px solid var(--brz);border-left:1.5px solid var(--brz);border-top-left-radius:13px}
.frame:after{bottom:-1px;right:-1px;border-bottom:1.5px solid var(--brz);border-right:1.5px solid var(--brz);border-bottom-right-radius:13px}
.eyebrow{font-size:9.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--brz);display:flex;align-items:center;gap:7px}
.eyebrow:before{content:"";width:12px;height:1.5px;background:var(--brz)}

/* ---- separadores (as "janelas") ---- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tab{background:var(--card-bg);border:1px solid var(--card-line);border-radius:14px;padding:0;cursor:pointer;overflow:hidden;text-align:left;transition:.22s;font:inherit;color:inherit;position:relative}
.tab:hover{border-color:var(--brzg);transform:translateY(-3px)}
.tab.on{border-color:var(--acc);box-shadow:0 0 0 1px rgba(34,184,240,.25)}
.tab .cover{height:104px;position:relative;overflow:hidden;border-bottom:1px solid var(--card-line)}
.tab .cover svg{position:absolute;inset:0;width:100%;height:100%}
.tab .body{padding:12px 14px 14px}
.tab .org{font-size:13.5px;font-weight:500}
.tab .desc{font-size:10.5px;color:var(--ink-faint);margin-top:3px;line-height:1.45}
.tab .pill{position:absolute;top:10px;right:10px;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;padding:3px 8px;border-radius:3px;font-weight:500;backdrop-filter:blur(4px)}

.card{background:var(--card-bg);border:1px solid var(--card-line);border-radius:14px}
.ch{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--card-line);flex-wrap:wrap;gap:10px}
.ch h2{font-size:12px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--t2)}
.cb{padding:18px}
.tag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--brzl);border:1px solid var(--brzg);padding:4px 9px;border-radius:3px;background:rgba(201,138,60,.07)}
.tag.live{color:var(--acc);border-color:rgba(34,184,240,.3);background:var(--accg)}
.tag.warn{color:var(--warn);border-color:rgba(240,169,38,.35);background:var(--warn-bg)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=text]{background:#080F1C;border:1px solid var(--card-line);color:var(--ink);border-radius:9px;padding:10px 12px;font:inherit;font-size:12.5px;outline:none}
select:focus,input:focus{border-color:var(--acc)}
.btn{padding:10px 16px;border:1px solid var(--brzg);background:rgba(201,138,60,.09);color:var(--brzl);border-radius:9px;font:inherit;font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.18s}
.btn:hover{background:rgba(201,138,60,.2);color:#fff;border-color:var(--brz)}
.btn.acc{border-color:rgba(34,184,240,.35);color:var(--acc);background:var(--accg)}
.btn.acc:hover{background:rgba(34,184,240,.22);color:#fff}
.out{margin-top:16px;background:#080F1C;border:1px solid var(--card-line);border-radius:11px;padding:15px;min-height:120px;font-size:12.5px}
.msg{display:flex;gap:11px;align-items:flex-start;font-size:12px;line-height:1.6}
.msg .ic{flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--card-line);font-weight:500}
td{padding:9px 10px;border-bottom:1px solid rgba(38,56,86,.4)}
tr:hover td{background:var(--cardh)}
.linkcard{display:flex;gap:12px;align-items:flex-start;padding:12px 13px;border:1px solid var(--card-line);border-radius:11px;margin-bottom:9px;transition:.16s;background:#080F1C}
.linkcard:hover{border-color:var(--brzg);background:var(--cardh)}
.linkcard .t{font-size:12.5px;font-weight:500}
.linkcard .d{font-size:10.5px;color:var(--ink-faint);margin-top:3px;line-height:1.5}
.linkcard .ar{color:var(--brz);flex:none;font-size:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.kv div{background:#080F1C;border-left:2px solid var(--brzg);border-radius:9px;padding:11px 12px}
.kv .l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.kv .n{font-size:17px;font-weight:500;margin-top:4px;line-height:1.2}
.note{font-size:10.5px;color:var(--ink-faint);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px solid var(--card-line)}
.hide{display:none}
.spin{width:15px;height:15px;border:2px solid rgba(34,184,240,.25);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1200px){.tabs{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media (max-width:820px){#app-shell{flex-direction:column}.sidebar{width:auto}.tabs{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app-shell"></div>

<script src="assets/access-control.js"></script>
<script src="assets/sinagepe.js"></script>
<script>
/* ============================================================
   FONTES INTERNACIONAIS — FAO, PAM/WFP, INE e GS1
   Quatro janelas de consulta. Cada janela declara honestamente
   se os dados vêm de chamada directa, de importação manual, ou
   apenas de ligação para a fonte oficial.
   ============================================================ */

/* ---------- capas ilustradas (SVG próprio, sem imagens externas) ---------- */
function capa(tipo){
  const A='#22B8F0', B='#C98A3C', C='#2DD4BF';
  const base='<rect width="300" height="104" fill="#0A1220"/><rect width="300" height="104" fill="url(#g'+tipo+')"/>';
  const defs=`<defs><linearGradient id="g${tipo}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="${tipo==='fao'?A:tipo==='wfp'?C:tipo==='ine'?B:A}" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#060B16" stop-opacity="0"/></linearGradient>
    <pattern id="p${tipo}" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#152740" stroke-width=".6"/></pattern></defs>`;
  const grid='<rect width="300" height="104" fill="url(#p'+tipo+')" opacity=".7"/>';
  let art='';
  if(tipo==='fao'){ // globo + espigas
    art=`<circle cx="150" cy="54" r="30" fill="none" stroke="${A}" stroke-width="1.3" opacity=".9"/>
      <ellipse cx="150" cy="54" rx="13" ry="30" fill="none" stroke="${A}" stroke-width="1" opacity=".65"/>
      <path d="M120 54h60M124 40h52M124 68h52" stroke="${A}" stroke-width="1" opacity=".55"/>
      <path d="M104 84c0-16 5-26 12-32M104 84c-9-6-13-16-13-26M104 84c9-6 13-16 13-26" stroke="${B}" stroke-width="1.4" fill="none"/>
      <path d="M196 84c0-16-5-26-12-32M196 84c9-6 13-16 13-26M196 84c-9-6-13-16-13-26" stroke="${B}" stroke-width="1.4" fill="none"/>`;
  } else if(tipo==='wfp'){ // mão + tigela + linhas de dados
    art=`<path d="M112 62h76c0 16-17 26-38 26s-38-10-38-26Z" fill="none" stroke="${C}" stroke-width="1.5"/>
      <path d="M150 58c0-8-8-10-8-18s8-10 8-16" stroke="${C}" stroke-width="1.3" fill="none" opacity=".8"/>
      <path d="M134 58c0-6-6-8-6-14M166 58c0-6 6-8 6-14" stroke="${C}" stroke-width="1.1" fill="none" opacity=".6"/>
      <path d="M92 92h116" stroke="${B}" stroke-width="1.2" opacity=".7"/>
      <path d="M40 40l14-8 14 12 14-6" stroke="${A}" stroke-width="1.3" fill="none" opacity=".7"/>
      <path d="M218 40l14-8 14 12 14-6" stroke="${A}" stroke-width="1.3" fill="none" opacity=".7"/>`;
  } else if(tipo==='ine'){ // barras estatísticas + curva
    art=`<g stroke="${B}" stroke-width="1.4" fill="none">
      <rect x="96" y="60" width="15" height="28"/><rect x="118" y="46" width="15" height="42"/>
      <rect x="140" y="54" width="15" height="34"/><rect x="162" y="34" width="15" height="54"/>
      <rect x="184" y="48" width="15" height="40"/></g>
      <path d="M96 66l22-16 22 10 22-22 22 16" stroke="${A}" stroke-width="1.5" fill="none"/>
      <circle cx="184" cy="54" r="3" fill="${A}"/><path d="M84 88h132" stroke="#22354F" stroke-width="1"/>`;
  } else { // gs1 — código de barras + datamatrix
    let bars='';let x=84;
    [3,1,2,1,4,1,2,3,1,2,1,3,2,1,4,1,2,1,3,1,2,4,1,2].forEach((w,i)=>{ if(i%2===0) bars+=`<rect x="${x}" y="28" width="${w*2}" height="46" fill="${A}" opacity=".85"/>`; x+=w*2+3;});
    art=bars+`<g stroke="${B}" stroke-width="1.2" fill="none"><rect x="196" y="30" width="42" height="42"/>
      <path d="M196 30v42M196 72h42"/><rect x="203" y="37" width="6" height="6" fill="${B}"/><rect x="216" y="44" width="6" height="6" fill="${B}"/><rect x="209" y="57" width="6" height="6" fill="${B}"/><rect x="223" y="60" width="6" height="6" fill="${B}"/></g>
      <path d="M84 82h100" stroke="${B}" stroke-width="1.2" opacity=".7"/>`;
  }
  return `<svg viewBox="0 0 300 104" preserveAspectRatio="xMidYMid slice">${defs}${base}${grid}${art}</svg>`;
}

const JANELAS=[
  {id:'fao', org:'FAO — FAOSTAT', desc:'Produção, balanços alimentares e segurança alimentar de Moçambique', estado:'Chamada directa', cor:'#22B8F0'},
  {id:'wfp', org:'PAM / WFP', desc:'HungerMap LIVE, preços de mercado e insegurança alimentar', estado:'Chamada directa', cor:'#2DD4BF'},
  {id:'gs1', org:'Sistema GS1', desc:'Validação de GTIN, prefixos e identificação de produto', estado:'Funciona offline', cor:'#22B8F0'}
];

/* ============================================================
   FAO — FAOSTAT
   Base: https://fenixservices.fao.org/faostat/api/v1/en/data/{dominio}
   Sem autenticação. Código de área de Moçambique em FAOSTAT: 144.
   ============================================================ */
const FAO_BASE='https://fenixservices.fao.org/faostat/api/v1/en/data/';
const FAO_AREA=144;
const FAO_DOMINIOS=[
  {c:'QCL', n:'Produção agrícola e pecuária'},
  {c:'FBS', n:'Balanço alimentar (Food Balance Sheets)'},
  {c:'FS',  n:'Indicadores de segurança alimentar'},
  {c:'CP',  n:'Índices de preços no consumidor (FAO)'},
  {c:'TCL', n:'Comércio de culturas e produtos pecuários'}
];

async function faoConsultar(){
  const dom=document.getElementById('fao-dom').value;
  const ano=document.getElementById('fao-ano').value;
  const out=document.getElementById('fao-out');
  const url=`${FAO_BASE}${dom}?area=${FAO_AREA}&year=${ano}&format=json&limit=25`;
  out.innerHTML=`<div class="msg"><span class="spin"></span><div>A consultar o FAOSTAT…<br><span class="mono" style="font-size:10.5px;color:var(--ink-faint)">${url}</span></div></div>`;
  try{
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const linhas=(j.data||[]).slice(0,20);
    if(!linhas.length){ out.innerHTML=aviso('warn','Sem registos','O FAOSTAT respondeu, mas não devolveu linhas para este domínio e ano. Experimente um ano anterior — os dados da FAO têm normalmente dois a três anos de desfasamento.'); return; }
    out.innerHTML=`<table><thead><tr><th>Item</th><th>Elemento</th><th>Ano</th><th style="text-align:right">Valor</th><th>Unidade</th></tr></thead><tbody>`
      + linhas.map(l=>`<tr><td>${l.Item||l.item||'—'}</td><td style="color:var(--ink-dim)">${l.Element||l.element||'—'}</td>
        <td class="mono">${l.Year||l.year||'—'}</td><td class="mono" style="text-align:right;color:var(--brzl)">${l.Value!=null?Number(l.Value).toLocaleString('pt-PT'):'—'}</td>
        <td style="color:var(--ink-faint)">${l.Unit||l.unit||''}</td></tr>`).join('')
      + `</tbody></table><div class="note">Fonte: FAOSTAT, Organização das Nações Unidas para a Alimentação e a Agricultura. Dados sujeitos aos termos de utilização da FAO.</div>`;
  }catch(e){
    out.innerHTML=aviso('crit','A chamada não passou',
      `O navegador bloqueou ou o serviço recusou a chamada (<span class="mono">${e.message}</span>). A causa quase certa é CORS: o FAOSTAT não autoriza chamadas directas a partir de um site alojado noutro domínio. Isto resolve-se com um pequeno serviço intermediário do lado do SINAGEPE — não é possível resolver só com HTML estático.`)
      + `<div style="margin-top:14px"><a class="btn acc" href="https://www.fao.org/faostat/en/#country/144" target="_blank" rel="noopener">Abrir o perfil de Moçambique no FAOSTAT</a></div>`;
  }
}

/* ============================================================
   PAM / WFP — HungerMap LIVE
   Endpoint público por país (ISO3 = MOZ).
   ============================================================ */
const WFP_URL='https://api.hungermapdata.org/v2/iso3/MOZ/countryIso3Data.json';

async function wfpConsultar(){
  const out=document.getElementById('wfp-out');
  out.innerHTML=`<div class="msg"><span class="spin"></span><div>A consultar o HungerMap LIVE…<br><span class="mono" style="font-size:10.5px;color:var(--ink-faint)">${WFP_URL}</span></div></div>`;
  try{
    const r=await fetch(WFP_URL);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const m=j.fcsGraph&&j.fcsGraph.length?j.fcsGraph[j.fcsGraph.length-1]:null;
    const pop=j.population||j.metadata&&j.metadata.population;
    out.innerHTML=`<div class="kv">
      <div><div class="l">Consumo alimentar insuficiente</div><div class="n mono" style="color:var(--amber)">${m&&m.fcs!=null?Number(m.fcs).toLocaleString('pt-PT'):'—'}</div></div>
      <div><div class="l">Data de referência</div><div class="n mono">${m&&m.x?m.x:'—'}</div></div>
      <div><div class="l">População</div><div class="n mono">${pop?Number(pop).toLocaleString('pt-PT'):'—'}</div></div>
      <div><div class="l">Registos na série</div><div class="n mono">${j.fcsGraph?j.fcsGraph.length:'—'}</div></div>
    </div><div class="note">Fonte: HungerMap LIVE, Programa Alimentar Mundial. A série pública cobre apenas os últimos 100 dias.</div>`;
  }catch(e){
    out.innerHTML=aviso('crit','A chamada não passou',
      `O pedido falhou (<span class="mono">${e.message}</span>). Tal como no FAOSTAT, a causa provável é a política CORS do serviço. O caminho fiável para produção é o SINAGEPE recolher estes dados do lado do servidor, uma vez por dia, e servi-los a partir da pasta <span class="mono">data/</span>.`)
      + `<div style="margin-top:14px" class="row">
        <a class="btn acc" href="https://hungermap.wfp.org/" target="_blank" rel="noopener">Abrir o HungerMap LIVE</a>
        <a class="btn" href="https://data.humdata.org/dataset/wfp-hungermap-data-for-moz" target="_blank" rel="noopener">Conjunto de dados no HDX</a></div>`;
  }
}

/* ============================================================
   INE — sem API pública. Importação manual de CSV.
   ============================================================ */
function ineImportar(txt){
  const out=document.getElementById('ine-out');
  const linhas=txt.trim().split(/\r?\n/).filter(l=>l.trim());
  if(linhas.length<2){ out.innerHTML=aviso('warn','Ficheiro insuficiente','São precisas pelo menos uma linha de cabeçalho e uma de dados.'); return; }
  const sep=(linhas[0].match(/;/g)||[]).length>(linhas[0].match(/,/g)||[]).length?';':',';
  const cab=linhas[0].split(sep).map(s=>s.trim().replace(/^"|"$/g,''));
  const dados=linhas.slice(1,201).map(l=>l.split(sep).map(s=>s.trim().replace(/^"|"$/g,'')));
  const numCol=cab.map((_,i)=>dados.every(d=>d[i]!==undefined&&d[i]!==''&&!isNaN(Number(d[i].replace(',','.')))));
  const iNum=numCol.indexOf(true);
  let graf='';
  if(iNum>-1){
    const vals=dados.map(d=>Number(d[iNum].replace(',','.')));
    const mn=Math.min(...vals),mx=Math.max(...vals),w=520,h=120;
    const pts=vals.map((v,i)=>[24+i/(vals.length-1||1)*(w-34),h-16-((v-mn)/((mx-mn)||1))*(h-32)]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    graf=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;margin-bottom:14px">
      <path d="${d} L${pts[pts.length-1][0]},${h-16} L${pts[0][0]},${h-16}Z" fill="#C98A3C" opacity=".12"/>
      <path d="${d}" fill="none" stroke="#C98A3C" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="4" y="14" fill="#5E7189" font-size="9.5" font-family="IBM Plex Mono">${mx.toLocaleString('pt-PT')}</text>
      <text x="4" y="${h-4}" fill="#5E7189" font-size="9.5" font-family="IBM Plex Mono">${mn.toLocaleString('pt-PT')}</text></svg>`;
  }
  out.innerHTML=graf+`<table><thead><tr>${cab.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${dados.slice(0,12).map(d=>`<tr>${d.map((v,i)=>`<td class="${numCol[i]?'mono':''}" ${numCol[i]?'style="text-align:right;color:var(--brzl)"':''}>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <div class="note">${dados.length} linha(s) lida(s); mostradas as primeiras 12. O ficheiro é processado no seu navegador e não é enviado para lado nenhum.</div>`;
}

function gs1Origem(gtin){
  const p3=parseInt(gtin.slice(0,3),10);
  const f=GS1_PREFIXOS.find(x=>p3>=x[0]&&p3<=x[1]);
  return f?f[2]:'Prefixo não atribuído nesta tabela';
}
function gs1DigitoControlo(corpo){
  let s=0;
  const inv=corpo.split('').reverse();
  for(let i=0;i<inv.length;i++) s+=Number(inv[i])*(i%2===0?3:1);
  return (10-(s%10))%10;
}
function ean13SVG(gtin){
  const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  const R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  const PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
  if(gtin.length!==13) return '';
  const d=gtin.split('').map(Number), par=PAR[d[0]];
  let bits='101';
  for(let i=1;i<=6;i++) bits+= (par[i-1]==='L'?L:G)[d[i]];
  bits+='01010';
  for(let i=7;i<=12;i++) bits+=R[d[i]];
  bits+='101';
  const uw=2.6, h=62, x0=26, w=x0+bits.length*uw+18;
  let barras='';
  for(let i=0;i<bits.length;i++){
    if(bits[i]==='1'){
      const guarda=(i<3)||(i>=45&&i<50)||(i>=bits.length-3);
      barras+=`<rect x="${(x0+i*uw).toFixed(2)}" y="6" width="${uw}" height="${guarda?h+8:h}" fill="#F3F7FC"/>`;
    }
  }
  let txt=`<text x="${x0-16}" y="${h+20}" fill="#F3F7FC" font-size="12" font-family="IBM Plex Mono">${gtin[0]}</text>`;
  txt+=`<text x="${x0+3*uw+21*uw}" y="${h+20}" fill="#F3F7FC" font-size="12" font-family="IBM Plex Mono" text-anchor="middle" letter-spacing="3">${gtin.slice(1,7)}</text>`;
  txt+=`<text x="${x0+50*uw+21*uw}" y="${h+20}" fill="#F3F7FC" font-size="12" font-family="IBM Plex Mono" text-anchor="middle" letter-spacing="3">${gtin.slice(7)}</text>`;
  return `<svg viewBox="0 0 ${w} ${h+28}" style="width:100%;max-width:340px;height:auto"><rect width="${w}" height="${h+28}" fill="#0A1220"/>${barras}${txt}</svg>`;
}
function gs1Validar(){
  const out=document.getElementById('gs1-out');
  const bruto=(document.getElementById('gs1-in').value||'').replace(/[^0-9]/g,'');
  if(!bruto){ out.innerHTML=aviso('warn','Sem número','Introduza um GTIN-8, GTIN-12, GTIN-13 ou GTIN-14 (os dígitos por baixo do código de barras).'); return; }
  if(![8,12,13,14].includes(bruto.length)){
    out.innerHTML=aviso('crit','Comprimento inválido',`Foram lidos ${bruto.length} dígitos. Um GTIN válido tem 8, 12, 13 ou 14 dígitos.`); return;
  }
  const corpo=bruto.slice(0,-1), dado=Number(bruto.slice(-1)), calc=gs1DigitoControlo(corpo);
  const ok=dado===calc;
  const gtin13 = bruto.length===13?bruto : bruto.length===12?('0'+bruto) : bruto.length===14?bruto.slice(1):null;
  out.innerHTML=aviso(ok?'ok':'crit', ok?'Estrutura válida':'Dígito de controlo incorrecto',
      ok? `O dígito de controlo confere (${calc}). O número está bem formado segundo a norma GS1.`
        : `O número termina em ${dado}, mas o dígito de controlo calculado é ${calc}. O código está mal transcrito ou é inválido.`)
    + `<div class="kv">
        <div><div class="l">Tipo</div><div class="n">GTIN-${bruto.length}</div></div>
        <div><div class="l">Dígito de controlo</div><div class="n mono" style="color:${ok?'var(--ok)':'var(--red)'}">${calc}</div></div>
        <div style="grid-column:1/-1"><div class="l">Organização emissora do prefixo</div><div class="n" style="font-size:14px">${gs1Origem(bruto.length===12?('0'+bruto):bruto)}</div></div>
      </div>`
    + (ok&&gtin13?`<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:9px">Representação EAN-13</div>${ean13SVG(gtin13)}</div>`:'')
    + `<div class="note">O prefixo identifica a organização GS1 onde a empresa se registou — <b>não</b> o país onde o produto foi fabricado. Confundir as duas coisas é um erro comum e com consequências em fiscalização.</div>`
    + `<div style="margin-top:12px"><a class="btn acc" href="https://www.gs1.org/services/verified-by-gs1" target="_blank" rel="noopener">Verificar no Verified by GS1</a></div>`;
}

/* ---------- utilitários ---------- */
function aviso(tipo,titulo,texto){
  const c={ok:'var(--ok)',warn:'var(--warn)',crit:'var(--crit)',info:'var(--info)'}[tipo];
  const bg={ok:'var(--ok-bg)',warn:'var(--warn-bg)',crit:'var(--crit-bg)',info:'var(--info-bg)'}[tipo];
  const ic={ok:'✓',warn:'!',crit:'✕',info:'i'}[tipo];
  return `<div class="msg"><span class="ic" style="background:${bg};color:${c}">${ic}</span>
    <div><b style="color:${c}">${titulo}</b><br><span style="color:var(--ink-dim)">${texto}</span></div></div>`;
}
