<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Nacional — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('mapa', 'Mapa Nacional', 'Atlas de Monitoria de Mercadorias e Corredores');

document.getElementById('content-mount').innerHTML = `
  <div class="row-2">
    <div class="card">
      <div class="card-title">Cobertura Provincial</div>
      <div class="card-subtitle">Disponibilidade (%) por província — mesma regra de cor do Painel Nacional</div>
      <div class="province-grid" id="province-grid"></div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--ok)"></span> Normal (&ge;80%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span> Aviso (50&ndash;80%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--crit)"></span> Ruptura (&lt;50%)</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Índice de Acessibilidade Municipal (IAM)</div>
      <div class="card-subtitle">Relação infraestrutura vs. custo de frete, por província</div>
      <div id="iam-list"></div>
    </div>
  </div>

  <div class="row-2">
    <div class="card">
      <div class="card-title">Corredores Logísticos Fixos</div>
      <div class="card-subtitle">Rotas nacionais principais — o estado muda em tempo real, a rota não</div>
      <table class="balance-table">
        <thead><tr><th>Corredor</th><th>Origem</th><th>Destino</th><th>Estado</th><th>Distância</th><th>Tempo</th><th>Custo t/km</th><th>Tráfego</th></tr></thead>
        <tbody id="corredores-body"></tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-title">Capacidade dos Corredores por Modal</div>
      <div class="card-subtitle">% de utilização — verde &lt;70%, amarelo 70&ndash;84%, vermelho &ge;85%</div>
      <div id="util-list"></div>
    </div>
  </div>
`;

SINAGEPE.load().then(renderMapaNacional);

function renderMapaNacional(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  // Cobertura provincial — mesma regra de cor do Painel Nacional (secção 8 do documento)
  document.getElementById('province-grid').innerHTML = data.provincias.map(p => {
    const cls = p.disponibilidade >= 80 ? 'tile-ok' : p.disponibilidade >= 50 ? 'tile-warn' : 'tile-crit';
    const nomeHtml = p.nome === data.painelProvincial.provincia
      ? `<a href="painel-provincial.html" style="color:inherit;text-decoration:underline">${p.nome}</a>`
      : p.nome === 'Tete'
      ? `<a href="detalhe-provincia.html" style="color:inherit;text-decoration:underline">${p.nome}</a>`
      : p.nome;
    return `<div class="province-tile ${cls}"><div class="province-name">${nomeHtml}</div><div class="province-value">${p.disponibilidade}%</div></div>`;
  }).join('');

  // IAM por província
  const IAM_TIPO = { 'Excelente': 'ok', 'Alto': 'ok', 'Adequado': 'info', 'Moderado': 'warn', 'Crítico': 'crit' };
  document.getElementById('iam-list').innerHTML = data.iamProvincial.map(p => `
    <div class="util-row">
      <div class="util-label-row">
        <span>${p.nome}</span>
        <span>${p.valor.toFixed(2)} · ${SINAGEPE.stateTag(p.classificacao)}</span>
      </div>
      <div class="util-track"><div class="util-fill pill-${IAM_TIPO[p.classificacao] || 'info'}" style="width:${p.valor * 100}%"></div></div>
    </div>`).join('');

  // Corredores
  const ESTADO_CORREDOR_TIPO = { 'Operacional': 'ok', 'Condicionado': 'warn', 'Interrompido': 'crit' };
  document.getElementById('corredores-body').innerHTML = data.corredores.map(c => {
    const tag = `<span class="state-tag" style="background:var(--${ESTADO_CORREDOR_TIPO[c.estado]}-bg);color:var(--${ESTADO_CORREDOR_TIPO[c.estado]})">${c.estado}</span>`;
    const tempo = c.tempoH === null ? '—' : c.tempoH + 'h';
    const custo = c.custoTKm === null ? '—' : c.custoTKm + ' USD';
    const nome = c.nome === data.corredorDetalhe.corredor
      ? `<a href="detalhe-corredor.html" style="color:var(--bronze);text-decoration:underline">${c.nome}</a>`
      : c.nome;
    return `<tr>
      <td>${nome}</td><td>${c.origem}</td><td>${c.destino}</td><td>${tag}</td>
      <td>${c.distanciaKm} km</td><td>${tempo}</td><td>${custo}</td><td>${c.trafego}</td>
    </tr>`;
  }).join('');

  // Utilização por modal — regra confirmada: <70 verde, 70-84 amarelo, >=85 vermelho
  document.getElementById('util-list').innerHTML = data.utilizacaoModal.map(u => {
    const tipo = u.percentagem >= 85 ? 'crit' : u.percentagem >= 70 ? 'warn' : 'ok';
    return `<div class="util-row">
      <div class="util-label-row"><span>${u.modal}</span><span>${u.percentagem}%</span></div>
      <div class="util-track"><div class="util-fill pill-${tipo}" style="width:${u.percentagem}%"></div></div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
