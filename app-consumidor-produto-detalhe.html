<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Consumidor — Detalhe do Produto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app-consumidor.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><b>09:41</b><span class="status-icons">📶 📡 🔋</span></div>
  <div class="mob-header">
    <a class="mob-back" href="app-consumidor-precos.html">‹ Preços</a>
    <div class="mob-title" id="prod-nome" style="margin-top:8px">—</div>
  </div>
  <div class="mob-content">
    <div class="mob-card" id="prod-card"></div>
    <a href="app-consumidor-comparador.html" class="mob-card menu-card" style="text-decoration:none">
      <div class="menu-icon" style="background:rgba(212,165,116,0.1);color:var(--mob-gold)">⚖️</div>
      <div><div class="menu-title">Comparar Lojas</div><div class="menu-desc">Vê onde este produto está mais barato</div></div>
      <div class="menu-chevron">›</div>
    </a>
  </div>
  <div class="bottom-nav">
    <a class="nav-tab" href="app-consumidor-home.html"><span class="ic">🏠</span>Início</a>
    <a class="nav-tab active" href="app-consumidor-precos.html"><span class="ic">📈</span>Preços</a>
    <a class="nav-tab" href="app-consumidor-mapa.html"><span class="ic">🗺️</span>Mapa</a>
    <a class="nav-tab" href="app-consumidor-alertas.html"><span class="ic">🔔</span>Alertas</a>
  </div>
</div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  const params = new URLSearchParams(location.search);
  const nome = params.get('produto') || 'Arroz';
  const p = data.balancoNacional.find(x => x.produto === nome) || data.balancoNacional[0];
  document.getElementById('prod-nome').textContent = p.produto;
  const ESTADO_COR = { 'Excelente':'var(--mob-teal)','Estável':'var(--mob-teal)','Atenção':'var(--mob-amber)','Crítico':'var(--mob-red)' };
  document.getElementById('prod-card').innerHTML = `
    <span class="pill-tag" style="color:${ESTADO_COR[p.estado]};background:${ESTADO_COR[p.estado]}1a">${p.estado}</span>
    <div class="price-row"><span style="color:var(--mob-dim)">Stock Nacional</span><span style="color:var(--mob-ink);font-weight:700">${SINAGEPE.fmt(p.stock)} t</span></div>
    <div class="price-row"><span style="color:var(--mob-dim)">Cobertura Estimada</span><span style="color:var(--mob-ink);font-weight:700">${p.cobertura} dias</span></div>
    <div class="price-row"><span style="color:var(--mob-dim)">Produção Nacional</span><span style="color:var(--mob-ink);font-weight:700">${SINAGEPE.fmt(p.producao)} t</span></div>
    <div class="price-row"><span style="color:var(--mob-dim)">Importações</span><span style="color:var(--mob-ink);font-weight:700">${SINAGEPE.fmt(p.importacao)} t</span></div>
  `;
});
</script>
</body>
</html>
