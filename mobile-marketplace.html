<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile — Marketplace — SINAGEPE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app-consumidor.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><b>09:41</b><span class="status-icons">📶 📡 🔋</span></div>
  <div class="mob-header"><div class="mob-title">Marketplace B2B</div><div class="mob-sub">Ofertas activas na sua área</div></div>
  <div class="mob-content" id="mob-content"></div>
  <div class="bottom-nav">
    <a class="nav-tab" href="mobile-painel-nacional.html"><span class="ic">🏠</span>Painel</a>
    <a class="nav-tab" href="mobile-centro-alertas.html"><span class="ic">⚠</span>Alertas</a>
    <a class="nav-tab active" href="mobile-marketplace.html"><span class="ic">🛒</span>Mercado</a>
    <a class="nav-tab" href="mobile-configuracoes.html"><span class="ic">⚙</span>Config</a>
  </div>
</div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  const ESTADO_COR = { 'Activo':'var(--mob-teal)', 'Em Negociação':'#f2991a', 'Vendido':'#4d99e5' };
  document.getElementById('mob-content').innerHTML = data.marketplace.anuncios.map(a => `
    <div class="mob-card">
      <div class="row-between"><span style="color:var(--mob-ink);font-weight:700;font-size:14px">${a.produto}</span>
      <span class="pill-tag" style="color:${ESTADO_COR[a.estado]};background:${ESTADO_COR[a.estado]}22">${a.estado}</span></div>
      <div style="color:var(--mob-dim);font-size:11.5px;margin-top:4px">${a.vendedor} · ${a.provincia}</div>
      <div style="color:var(--mob-gold);font-weight:700;font-size:13px;margin-top:6px">${a.quantidadeT} t · ${a.precoMznT} MZN/t</div>
    </div>`).join('');
});
</script>
</body>
</html>
