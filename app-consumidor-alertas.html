<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Consumidor — Alertas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app-consumidor.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><b>09:41</b><span class="status-icons">📶 📡 🔋</span></div>
  <div class="mob-header">
    <div class="mob-title">Alertas Locais</div>
    <div class="mob-sub">Avisos relevantes para a sua zona</div>
  </div>
  <div class="mob-content">
    <div id="alertas-list"></div>
  </div>
  <div class="bottom-nav">
    <a class="nav-tab" href="app-consumidor-home.html"><span class="ic">🏠</span>Início</a>
    <a class="nav-tab" href="app-consumidor-precos.html"><span class="ic">📈</span>Preços</a>
    <a class="nav-tab" href="app-consumidor-mapa.html"><span class="ic">🗺️</span>Mapa</a>
    <a class="nav-tab active" href="app-consumidor-alertas.html"><span class="ic">🔔</span>Alertas</a>
  </div>
</div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  const SEV = { 'Crítico': ['var(--mob-red)','rgba(239,68,68,0.1)'], 'Atenção': ['var(--mob-amber)','rgba(245,158,11,0.1)'] };
  document.getElementById('alertas-list').innerHTML = data.alertasDetalhe.slice(0,5).map(a => {
    const [cor,bg] = SEV[a.severidade] || SEV['Atenção'];
    return `<a href="app-consumidor-alerta-detalhe.html?id=${a.id}" style="text-decoration:none">
      <div class="mob-card" style="border-left:3px solid ${cor};margin-bottom:12px">
        <span class="pill-tag" style="color:${cor};background:${bg}">${a.severidade}</span>
        <div style="color:var(--mob-ink);font-weight:700;font-size:14px;margin-top:8px">${a.titulo}</div>
        <div style="color:var(--mob-dim);font-size:11.5px;margin-top:2px">${a.provincia} · ${a.tempo}</div>
      </div></a>`;
  }).join('');
});
</script>
</body>
</html>
