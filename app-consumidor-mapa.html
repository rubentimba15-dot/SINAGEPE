<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Consumidor — Mapa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app-consumidor.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><b>09:41</b><span class="status-icons">📶 📡 🔋</span></div>
  <div class="mob-header">
    <div class="mob-title">Onde Comprar</div>
    <div class="mob-sub">Mercados e lojas licenciadas perto de si</div>
  </div>
  <div class="mob-content">
    <div id="lojas-list"></div>
  </div>
  <div class="bottom-nav">
    <a class="nav-tab" href="app-consumidor-home.html"><span class="ic">🏠</span>Início</a>
    <a class="nav-tab" href="app-consumidor-precos.html"><span class="ic">📈</span>Preços</a>
    <a class="nav-tab active" href="app-consumidor-mapa.html"><span class="ic">🗺️</span>Mapa</a>
    <a class="nav-tab" href="app-consumidor-alertas.html"><span class="ic">🔔</span>Alertas</a>
  </div>
</div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  document.getElementById('lojas-list').innerHTML = data.appConsumidor.lojasPreco.map(l => `
    <a href="app-consumidor-loja-detalhe.html?loja=${encodeURIComponent(l.loja)}" style="text-decoration:none">
    <div class="mob-card menu-card" style="margin-bottom:12px">
      <div class="menu-icon" style="background:rgba(45,212,191,0.1);color:var(--mob-teal)">🏪</div>
      <div><div class="menu-title">${l.loja}</div><div class="menu-desc">${l.distanciaKm} km · ${l.preco} MZN/kg (Arroz)</div></div>
      <div class="menu-chevron">›</div>
    </div></a>`).join('');
});
</script>
</body>
</html>
