<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A carregar — SINAGEPE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; padding:0; background:#171c2b; font-family:'Inter',sans-serif; min-height:100vh; }
  .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  .spinner { width:60px; height:60px; border-radius:50%; border:4px solid #262b3d; border-top-color:#d9a621; animation:girar 0.9s linear infinite; }
  @keyframes girar { to { transform:rotate(360deg); } }
  .txt { color:#f2f5f7; font-size:15px; font-weight:600; }
  .sub { color:#8c94a1; font-size:12.5px; }
  .skeleton-row { width:600px; max-width:90vw; display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .skel { height:14px; border-radius:6px; background:linear-gradient(90deg,#1c2133 25%,#262b3d 50%,#1c2133 75%); background-size:200% 100%; animation:pulso 1.4s ease-in-out infinite; }
  @keyframes pulso { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <div class="txt">A carregar o Marketplace B2B...</div>
  <div class="sub">A sincronizar anúncios e negociações</div>
  <div class="skeleton-row">
    <div class="skel" style="width:100%"></div>
    <div class="skel" style="width:85%"></div>
    <div class="skel" style="width:92%"></div>
  </div>
</div>
</body>
</html>
