<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>
<script src="assets/selo-proveniencia.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Banco Central — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('painel', 'Dashboard Banco Central', 'Banco de Moçambique — Pressão Cambial e Reservas');

document.getElementById('content-mount').innerHTML = `
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)" id="kpi-row-1"></div>
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)" id="kpi-row-2"></div>

  <div class="card">
    <div class="card-title">Necessidade de Intervenção Cambial</div>
    <div class="card-subtitle">Projecção a 30/60/90 dias</div>
    <div class="row-3" id="intervencao-grid" style="grid-template-columns:repeat(3,1fr)"></div>
  </div>

  <div class="card">
    <div class="card-title">Demanda Cambial por Produto Essencial</div>
    <div class="card-subtitle">Ligado directamente ao preço CIF × quantidade do Simulador de Importações</div>
    <div id="demanda-list"></div>
  </div>
`;

SINAGEPE.load().then(function (data) {
  /* A fonte declara-se simulada; o ecrã tem de o dizer. Os nomes das entidades
     mantêm-se com aparência realista por decisão de apresentação — o aviso de
     simulação é dado por esta faixa e verbalmente em cada demonstração. */
  if (window.SeloProveniencia) SeloProveniencia.aplicar({
    modo: (data.meta && data.meta.modo) || null,
    bloco: 'dashboardBancoCentral',
    quando: data.meta && data.meta.ultimaActualizacao
  });
  return renderDashboardBC(data);
});

function renderDashboardBC(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  const b = data.dashboardBancoCentral;
  const kpi1 = [
    { label: 'Pressão Cambial Index', valor: b.kpis.pressaoCambialIndex.toFixed(2), estado: 'Moderado', tipo: 'warn' },
    { label: 'Necessidade de Divisas (Mês)', valor: (b.kpis.necessidadeDivisasMesUsd / 1e6).toFixed(0) + 'M USD', estado: 'Urgente', tipo: 'crit' },
    { label: 'Reservas (Cobertura)', valor: b.kpis.reservasCoberturaMeses + ' Meses', estado: b.kpis.reservasCoberturaMeses > b.kpis.nivelCriticoMeses ? 'Seguro' : 'Crítico', tipo: b.kpis.reservasCoberturaMeses > b.kpis.nivelCriticoMeses ? 'ok' : 'crit' },
  ];
  const kpi2 = [
    { label: 'Inflação Mensal', valor: b.kpis.inflacaoMensalPercent + '%', estado: 'Controlada', tipo: 'ok' },
    { label: 'Pressão de Importações', valor: '+' + b.kpis.pressaoImportacoesPercent + '% YoY', estado: 'Alto', tipo: 'warn' },
    { label: 'Taxa de Câmbio USD/MZN', valor: b.kpis.taxaCambio, estado: 'Estável', tipo: 'info' },
  ];
  document.getElementById('kpi-row-1').innerHTML = kpi1.map(SINAGEPE.kpiCard).join('');
  document.getElementById('kpi-row-2').innerHTML = kpi2.map(SINAGEPE.kpiCard).join('');

  document.getElementById('intervencao-grid').innerHTML = b.intervencao.map(i => `
    <div class="card" style="background:var(--navy-800)">
      <div class="kpi-label">T+${i.horizonteDias} dias</div>
      <div class="kpi-value" style="font-size:18px;margin:4px 0">${(i.valorUsd / 1e6).toFixed(0)}M USD</div>
      <div style="font-size:11px;color:var(--ink-faint)">${i.justificacao}</div>
    </div>`).join('');

  document.getElementById('demanda-list').innerHTML = data.dashboardBancoCentral.demandaCambialProduto.map(d => `
    <div class="util-row">
      <div class="util-label-row"><span>${d.produto}</span><span>${(d.valorUsd / 1e6).toFixed(0)}M USD (${d.percentCota}% da cota)</span></div>
      <div class="util-track"><div class="util-fill" style="width:${d.percentCota}%;background:var(--bronze)"></div></div>
    </div>`).join('');
}
</script>
</body>
</html>
