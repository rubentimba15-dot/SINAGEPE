<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bem-vindo — SINAGEPE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; padding:0; background:#171c2b; font-family:'Inter',sans-serif; min-height:100vh; }
  .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:#1c2133; border-radius:20px; padding:50px 60px; width:700px; max-width:92vw; text-align:center; }
  .icon-circle { width:120px; height:120px; border-radius:60px; background:#218c59; margin:0 auto 30px; display:flex; align-items:center; justify-content:center; font-size:44px; }
  h1 { color:#fff; font-size:32px; margin:0 0 8px; }
  h2 { color:#99a6b2; font-size:16px; font-weight:400; margin:0 0 30px; }
  p { color:#808c99; font-size:14px; line-height:1.6; margin:0 0 34px; }
  .btn-solid { display:inline-block; background:#d9a621; color:#0d0d1a; border-radius:25px; padding:14px 60px; font-size:16px; font-weight:700; text-decoration:none; }
  .dots { margin-top:24px; display:flex; gap:8px; justify-content:center; }
  .dot { width:10px; height:10px; border-radius:50%; background:#404554; }
  .dot.on { background:#d9a621; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon-circle">🌐</div>
    <h1>Bem-vindo ao SINAGEPE</h1>
    <h2>Sistema Nacional de Gestão de Preços e Estoques</h2>
    <p>Configure o seu perfil institucional para começar a monitorizar preços e estoques em tempo real.</p>
    <a class="btn-solid" href="onboarding-selecionar-perfil.html">Começar Configuração</a>
    <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
</div>
</body>
</html>
