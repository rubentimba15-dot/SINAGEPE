<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicadores do Painel &mdash; SINAGEPE</title>
<script src="assets/access-control.js"></script>
<script src="assets/nav-sinagepe.js"></script>
<script src="assets/pesquisa-sinagepe.js"></script>
<script src="assets/indicadores-sinagepe.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#060B16;--sidebar-bg:#080E1B;--card-bg:#0C1626;--card-line:rgba(38,56,86,.75);
--gold-line:rgba(201,138,60,.28);--brz:#C98A3C;--brzl:#E8BE7A;--brzg:rgba(201,138,60,.30);
--blue:#22B8F0;--teal:#2DD4BF;--amber:#F0A926;--red:#EF4444;--ok:#12B981;--viol:#A78BFA;
--ink:#F3F7FC;--t2:#C3D0E0;--t3:#8FA1B8;--t4:#5E7189;--cardh:#111E31;--nav-idle:#111E31;--accg:rgba(34,184,240,.13)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg1);color:var(--ink);font-family:Inter,sans-serif;font-size:13px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}
.sidebar{width:236px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--card-line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:6px 10px 16px;border-bottom:1px solid var(--card-line);margin-bottom:14px}
.brand-t{font-size:15px;font-weight:700;letter-spacing:.06em}
.brand-s{font-size:9px;color:var(--brz);letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 14px;border-radius:8px;border:1px solid var(--gold-line);background:var(--nav-idle);cursor:pointer;text-decoration:none;color:var(--t2);margin-bottom:5px;font-size:12px}
.nav-item:hover{background:var(--cardh)}
.nav-item.active{background:var(--blue);color:#02121c}
.nav-item.active .nav-label{font-weight:600}
.nav-icon{width:16px;text-align:center;opacity:.85}
main{flex:1;padding:22px 26px 60px;max-width:1560px}
.eyebrow{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--brz);display:flex;align-items:center;gap:7px;margin-bottom:9px}
.eyebrow:before{content:"";width:12px;height:1.5px;background:var(--brz)}
h1{font-size:25px;margin:0 0 6px;letter-spacing:-.015em}
.sub{color:var(--t3);font-size:13px;margin-bottom:20px;max-width:900px;line-height:1.6}
.card{background:var(--card-bg);border:1px solid var(--card-line);border-radius:14px;margin-bottom:14px}
.frame{position:relative}
.frame:before,.frame:after{content:"";position:absolute;width:15px;height:15px;pointer-events:none;z-index:3}
.frame:before{top:-1px;left:-1px;border-top:1.5px solid var(--brz);border-left:1.5px solid var(--brz);border-top-left-radius:13px}
.frame:after{bottom:-1px;right:-1px;border-bottom:1.5px solid var(--brz);border-right:1.5px solid var(--brz);border-bottom-right-radius:13px}
.ch{display:flex;align-items:flex-start;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--card-line);gap:12px;flex-wrap:wrap}
.ch h2{font-size:14.5px;font-weight:600;margin:0 0 3px}
.ch p{font-size:11.5px;color:var(--t3);margin:0;line-height:1.5}
.tag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--brzl);border:1px solid var(--brzg);padding:4px 9px;border-radius:3px;background:rgba(201,138,60,.07);white-space:nowrap;flex-shrink:0}
.tag.ok{color:var(--ok);border-color:rgba(18,185,129,.35);background:rgba(18,185,129,.08)}
.bd{padding:17px 18px}
@keyframes surge{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes crescer{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.entra{animation:surge .5s cubic-bezier(.16,1,.3,1) both}
.cresce{transform-origin:left center;animation:crescer .85s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion:reduce){.entra,.cresce{animation:none!important;opacity:1!important;transform:none!important}}

/* ---- ficha de indicador ---- */
.ind-card{background:linear-gradient(158deg,#101B2E,#0A1220);border:1px solid var(--card-line);
 border-radius:14px;margin-bottom:14px;overflow:hidden;position:relative}
.ind-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.ic-topo{display:flex;align-items:flex-start;gap:20px;padding:20px 22px 18px;flex-wrap:wrap}
.ic-num{flex-shrink:0;min-width:150px}
.ic-v{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1;
 font-family:'IBM Plex Mono',monospace}
.ic-v small{font-size:17px;margin-left:5px;opacity:.75}
.ic-e{font-size:11.5px;color:var(--t3);margin-top:8px;line-height:1.5}
.ic-txt{flex:1;min-width:260px}
.ic-n{font-size:17px;font-weight:600;margin-bottom:7px;letter-spacing:-.01em}
.ic-r{font-size:12.5px;color:var(--t2);line-height:1.7}
.ic-porque{margin:0 22px 18px;padding:15px 17px;background:rgba(201,138,60,.06);
 border-left:3px solid var(--brz);border-radius:0 10px 10px 0}
.ic-porque-t{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--brz);margin-bottom:8px}
.ic-porque-c{font-size:12.5px;color:var(--ink);line-height:1.75}
.ic-grelha{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--card-line)}
@media(max-width:840px){.ic-grelha{grid-template-columns:1fr}}
.ic-bloco{padding:15px 22px}
.ic-bloco:first-child{border-right:1px solid var(--card-line)}
@media(max-width:840px){.ic-bloco:first-child{border-right:none;border-bottom:1px solid var(--card-line)}}
.ic-bt{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--t4);margin-bottom:8px}
.ic-bc{font-size:12px;color:var(--t2);line-height:1.7}
.usa{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.usa span{font-size:11px;padding:5px 11px;border-radius:20px;background:rgba(34,184,240,.09);
 border:1px solid rgba(34,184,240,.26);color:#9EDCF7}
.ic-fundo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
 padding:13px 22px;border-top:1px solid var(--card-line);background:rgba(6,11,22,.4)}
.ic-fonte{font-size:11px;color:var(--t4);line-height:1.6}
.ic-fonte b{color:var(--t3);font-weight:500}
.ic-ir{font-size:11.5px;color:var(--brzl);text-decoration:none;white-space:nowrap;
 padding:7px 14px;border:1px solid var(--brzg);border-radius:7px;transition:.16s}
.ic-ir:hover{background:rgba(201,138,60,.12);color:var(--brz)}
.comp{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:11.5px}
.comp-n{flex:1;color:var(--t3)}
.comp-v{font-family:'IBM Plex Mono',monospace;color:var(--t2)}
.aviso{margin:14px 18px;padding:13px 15px;border-radius:10px;font-size:11.5px;line-height:1.7;border:1px solid}
.aviso.i{background:rgba(34,184,240,.07);border-color:rgba(34,184,240,.26);color:#9EDCF7}
.err{padding:22px;color:var(--red);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="nav-mount"></aside>
  <main>
    <div class="eyebrow">Torre de Controlo Nacional</div>
    <h1>Os seis n&uacute;meros do painel</h1>
    <p class="sub">Cada um mede uma coisa concreta do abastecimento nacional. Aqui est&aacute; <b>o que mede, porque importa, que decis&atilde;o permite e quem o usa</b> &mdash; com a f&oacute;rmula e a fonte &agrave; vista.</p>

    <div id="lista"></div>

    <div class="card frame">
      <div class="ch"><div><h2>Como ler estes n&uacute;meros</h2>
        <p>Tr&ecirc;s regras que se aplicam a todos</p></div>
        <span class="tag ok">Governa&ccedil;&atilde;o do dado</span></div>
      <div class="bd" id="regras"></div>
    </div>
  </main>
</div>

<script>
if(window.SinagepeNav) SinagepeNav.montar('indicadores');
if(window.SinagepePesquisa) SinagepePesquisa.iniciar();
if(window.IndicadoresSinagepe) IndicadoresSinagepe.iniciar();

var COR={red:'#EF4444',amber:'#F0A926',ok:'#12B981',blue:'#22B8F0',teal:'#2DD4BF',viol:'#A78BFA'};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(n){
  if(typeof n!=='number') return esc(n);
  return String(n).replace('.',',');
}

/* Cada indicador é uma ficha completa: número grande, o que é, porque
   importa, que decisão permite, quem o usa, como se calcula e de onde vem.
   A versão anterior deste ecrã dedicava metade do espaço a listar o que
   tinha sido retirado — informação de auditoria interna, sem utilidade
   para quem abre uma torre de controlo. */
function ficha(i,idx){
  var c=COR[i.cor]||'#8FA1B8';
  var comp=(i.componentes||[]).map(function(x){
    return '<div class="comp"><span class="comp-n">'+esc(x[0])+'</span>'
     +'<span class="comp-v">'+fmt(x[1])+(x[2]?' <span style="opacity:.6">'+esc(x[2])+'</span>':'')+'</span></div>';
  }).join('');

  return '<div class="ind-card entra" style="animation-delay:'+(idx*.08)+'s">'
   +'<span style="position:absolute;left:0;top:0;bottom:0;width:3px;background:'+c+'"></span>'
   +'<div class="ic-topo">'
   +'<div class="ic-num"><div class="ic-v" style="color:'+c+'">'+fmt(i.valor)
   +(i.unidade?'<small>'+esc(i.unidade)+'</small>':'')+'</div>'
   +'<div class="ic-e">'+esc(i.estado)+'</div></div>'
   +'<div class="ic-txt"><div class="ic-n">'+esc(i.rotulo)+'</div>'
   +'<div class="ic-r">'+esc(i.resumo)+'</div></div></div>'

   +(i.porqueImporta?'<div class="ic-porque"><div class="ic-porque-t">Porque importa</div>'
     +'<div class="ic-porque-c">'+esc(i.porqueImporta)+'</div></div>':'')

   +'<div class="ic-grelha">'
   +'<div class="ic-bloco"><div class="ic-bt">Que decis&atilde;o permite</div>'
   +'<div class="ic-bc">'+esc(i.queDecisaoPermite||'&mdash;')+'</div>'
   +(i.quemUsa?'<div class="ic-bt" style="margin-top:14px">Quem o usa</div>'
     +'<div class="usa">'+i.quemUsa.map(function(q){return '<span>'+esc(q)+'</span>'}).join('')+'</div>':'')
   +'</div>'
   +'<div class="ic-bloco"><div class="ic-bt">Como se calcula</div>'
   +'<div class="ic-bc" style="margin-bottom:10px">'+esc(i.formula)+'</div>'
   +comp
   +(i.leitura?'<div class="ic-bt" style="margin-top:14px">O que o n&uacute;mero diz</div>'
     +'<div class="ic-bc">'+esc(i.leitura)+'</div>':'')
   +'</div></div>'

   +'<div class="ic-fundo">'
   +'<div class="ic-fonte"><b>Fonte:</b> '+esc(i.fonte)
   +' &nbsp;&middot;&nbsp; <b>Dados de:</b> '+esc(i.dataDados)
   +' &nbsp;&middot;&nbsp; <b>'+esc(i.classificacao)+'</b></div>'
   +(i.ecra?'<a class="ic-ir" href="'+esc(i.ecra)+'">Abrir o ecr&atilde; que o det&eacute;m &rarr;</a>':'')
   +'</div></div>';
}

var REGRAS=[
 ['Cada n&uacute;mero declara a origem','Facto significa que deriva de dado com fonte publicada. '
  +'Estimativa significa que foi calculado com pressupostos, e os pressupostos est&atilde;o &agrave; vista. '
  +'N&atilde;o h&aacute; aqui n&uacute;meros de terceira categoria.'],
 ['A data importa tanto como o valor','Um pre&ccedil;o de Julho de 2023 &eacute; verdadeiro e n&atilde;o descreve hoje. '
  +'Cada indicador mostra a data dos dados, e o sistema assinala quando uma fonte est&aacute; atrasada '
  +'face &agrave; periodicidade com que devia publicar.'],
 ['O que n&atilde;o se sabe tamb&eacute;m est&aacute; aqui','A capacidade cega de 100% e os zero produtos com '
  +'identifica&ccedil;&atilde;o nacional s&atilde;o indicadores de aus&ecirc;ncia. <b>S&atilde;o dos mais &uacute;teis do painel</b>, '
  +'porque dizem onde uma decis&atilde;o n&atilde;o pode assentar em dado nenhum.']
];

function desenharRegras(){
  document.getElementById('regras').innerHTML=REGRAS.map(function(r,i){
    return '<div class="entra" style="animation-delay:'+(i*.06)+'s;padding:11px 0'
     +(i<REGRAS.length-1?';border-bottom:1px solid rgba(38,56,86,.4)':'')+'">'
     +'<div style="font-size:13px;font-weight:600;margin-bottom:6px">'+r[0]+'</div>'
     +'<div style="font-size:12px;color:var(--t3);line-height:1.7">'+r[1]+'</div></div>';
  }).join('')
   +'<div class="aviso i" style="margin:14px 0 0">A regra completa est&aacute; na '
   +'<a href="governanca-dado.html" style="color:var(--blue)">Governa&ccedil;&atilde;o do Dado</a>, '
   +'e a idade de cada fonte na <a href="actualidade-dados.html" style="color:var(--blue)">Actualidade dos dados</a>.</div>';
}

fetch('data/indicadores-painel.json',{cache:'no-store'})
 .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status+' em data/indicadores-painel.json');return r.json()})
 .then(function(d){
   document.getElementById('lista').innerHTML=d.indicadores.map(ficha).join('');
   desenharRegras();
 })
 .catch(function(e){
   document.getElementById('lista').innerHTML=
     '<div class="err"><b>N&atilde;o foi poss&iacute;vel carregar.</b><br>'+esc(e.message)+'</div>';
 });
</script>
</body>
</html>
