<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRAE — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .check-icons { display: flex; gap: 4px; }
  .check-dot { width: 9px; height: 9px; border-radius: 50%; }
</style>
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('alertas', 'IRAE — Retenção Artificial', 'Detecção de Retenção Especulativa · Sub-módulo de Alertas');

document.getElementById('content-mount').innerHTML = `
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)" id="kpi-row"></div>

  <div class="row-2">
    <div class="card">
      <div class="card-title">Casos Sinalizados</div>
      <div class="card-subtitle">Auto-checks: ● verde = nenhuma causa legítima encontrada (reforça suspeita) · ● vermelho = causa legítima confirmada</div>
      <table class="balance-table">
        <thead><tr><th>Operador</th><th>Produto</th><th>Província</th><th>IRAE Score</th><th>Duração</th><th>Checks</th><th>Estado IGSAE</th></tr></thead>
        <tbody id="casos-body"></tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-title">Classificação de Escassez</div>
      <div class="card-subtitle">Distingue causas legítimas de possível retenção artificial</div>
      <div id="classificacao-list" style="margin-bottom:16px"></div>
      <div class="kpi-label" style="margin-bottom:8px">Circuito de Calibração (IA)</div>
      <div class="medida-row"><span>Precisão do Modelo</span><span id="precisao-modelo">—</span></div>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:6px" id="ultimo-treino"></div>
    </div>
  </div>
`;

SINAGEPE.load().then(renderIRAE);

function renderIRAE(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  const irae = data.irae;
  const kpiDefs = [
    { label: 'IRAE Médio Nacional', valor: irae.kpis.iraeMedioNacional.toFixed(2), estado: 'Normal', tipo: 'ok' },
    { label: 'Operadores Monitorizados', valor: SINAGEPE.fmt(irae.kpis.operadoresMonitorizados), estado: 'Activo', tipo: 'info' },
    { label: 'Alertas de Retenção Activos', valor: irae.kpis.alertasRetencaoActivos, estado: 'Crítico', tipo: 'crit' },
    { label: 'Casos Confirmados (IGSAE)', valor: irae.kpis.casosConfirmados, estado: 'Sinalizado', tipo: 'warn' },
  ];
  document.getElementById('kpi-row').innerHTML = kpiDefs.map(SINAGEPE.kpiCard).join('');

  const ESTADO_TIPO = { 'Pendente': 'info', 'Em Verificação': 'warn', 'Justificado': 'ok', 'Confirmado': 'crit', 'Falso Positivo': 'ok' };
  document.getElementById('casos-body').innerHTML = irae.casos.map(c => {
    const scoreTipo = c.score >= 0.7 ? 'crit' : c.score >= 0.5 ? 'warn' : 'ok';
    const checkDot = legitimo => `<span class="check-dot" style="background:${legitimo ? 'var(--crit)' : 'var(--ok)'}" title="${legitimo ? 'Causa legítima confirmada' : 'Nenhuma causa legítima encontrada — reforça suspeita'}"></span>`;
    return `<tr><td>${c.operador}</td><td>${c.produto}</td><td>${c.provincia}</td>
      <td><span class="state-tag" style="background:var(--${scoreTipo}-bg);color:var(--${scoreTipo})">${c.score.toFixed(2)}</span></td>
      <td>${c.duracaoDias} dias</td>
      <td><div class="check-icons">${checkDot(c.checks.logistica)}${checkDot(c.checks.clima)}${checkDot(c.checks.outro)}</div></td>
      <td><span class="state-tag" style="background:var(--${ESTADO_TIPO[c.estadoIGSAE]}-bg);color:var(--${ESTADO_TIPO[c.estadoIGSAE]})">${c.estadoIGSAE}</span></td></tr>`;
  }).join('');

  const CLASS_TIPO = { 'Sem Alerta': 'ok', 'Monitorizar': 'info', 'Estável': 'ok', 'Aviso': 'warn', 'Risco Alto': 'crit' };
  document.getElementById('classificacao-list').innerHTML = irae.classificacaoEscassez.map(c => `
    <div class="medida-row"><span>${c.tipo}</span><span class="state-tag" style="background:var(--${CLASS_TIPO[c.estado]}-bg);color:var(--${CLASS_TIPO[c.estado]})">${c.estado}</span></div>`).join('');

  document.getElementById('precisao-modelo').textContent = irae.calibracao.precisaoModeloPercent + '%';
  document.getElementById('ultimo-treino').textContent = 'Último treino: ' + irae.calibracao.ultimoTreino;
}
</script>
</body>
</html>
