<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhe do KPI — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .breadcrumb { font-size: 12px; color: var(--ink-faint); margin-bottom: 4px; }
  .page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-title { font-size: 24px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 14px; }
  .back-btn { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--bronze); }
</style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<script src="assets/chart.umd.min.js"></script>
<script>
/* A biblioteca de gráficos vinha de cdnjs.cloudflare.com, num endereço que
   nunca existiu: a versão 4.4.4 não está publicada nesse repositório, e o
   pedido devolvia sempre 404. Consequência: `new Chart(...)` rebentava e
   interrompia a função de desenho, deixando em branco não só o gráfico mas
   tudo o que vinha depois dele no ecrã — sem aviso nenhum ao utilizador.

   Passa a ser servida do próprio repositório (assets/chart.umd.min.js,
   versão 4.4.1), pelo que funciona sem Internet e sem depender de terceiros.

   O bloco abaixo é a rede de segurança: se um dia a biblioteca faltar, cada
   tela de gráfico é substituída por uma linha a dizê-lo, e o resto do ecrã
   continua a desenhar. Um gráfico em falta deve declarar-se, não desaparecer
   em silêncio nem levar o ecrã atrás. */
if (typeof Chart === 'undefined') {
  window.Chart = function (alvo) {
    var tela = alvo && alvo.canvas ? alvo.canvas : alvo;
    if (tela && tela.parentNode) {
      var aviso = document.createElement('div');
      aviso.className = 'grafico-indisponivel';
      aviso.textContent = 'Gráfico indisponível — a biblioteca de gráficos não carregou.';
      aviso.style.cssText = 'display:flex;align-items:center;justify-content:center;' +
        'min-height:120px;padding:18px;border:1px dashed rgba(237,184,110,.62);' +
        'border-radius:10px;color:#C2D1E4;font-size:12px;text-align:center';
      tela.parentNode.replaceChild(aviso, tela);
    }
    return { destroy: function () {}, update: function () {}, resize: function () {} };
  };
}
</script>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('painel', 'Atlas de Monitoria de Mercadorias e Corredores', 'Sistema Vivo');

document.getElementById('content-mount').innerHTML = `
  <div class="page-title-row">
    <div><div class="breadcrumb">Painel &gt; KPI</div>
    <div class="page-title">Disponibilidade Nacional <span class="pill pill-warn">Regular</span></div></div>
    <a class="back-btn" href="index.html">← Voltar ao Painel</a>
  </div>
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)" id="kpi-row"></div>
  <div class="row-2">
    <div class="card">
      <div class="card-title">Evolução do Indicador (6 meses)</div>
      <canvas id="chart-kpi" height="140"></canvas>
    </div>
    <div class="card">
      <div class="card-title">Composição por Produto</div>
      <div id="composicao-list"></div>
    </div>
  </div>
`;

SINAGEPE.load().then(data => {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = data.meta.ultimaActualizacao;

  const k = data.kpis.disponibilidadeNacional;
  const kpis = [
    { label: 'Valor Actual', valor: k.valor + '%', estado: k.estado, tipo: 'warn' },
    { label: 'Meta Nacional', valor: (data.portalPublico?.meta || 85) + '%', estado: 'Referência', tipo: 'info' },
    { label: 'Produtos Monitorizados', valor: data.balancoNacional.length, estado: 'Activos', tipo: 'info' },
    { label: 'Fórmula', valor: 'Stock/Referência', estado: 'Auditável', tipo: 'ok' },
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(SINAGEPE.kpiCard).join('');

  const historicoIlustrativo = [82, 84, 83, 86, 85, k.valor];
  new Chart(document.getElementById('chart-kpi'), {
    type: 'line',
    data: { labels: ['M-5','M-4','M-3','M-2','M-1','Actual'], datasets: [{ data: historicoIlustrativo, borderColor: '#d97706', backgroundColor: 'rgba(217,119,6,0.12)', fill: true, tension: 0.35, pointRadius: 3 }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#9DB0C8', font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: '#9DB0C8', font: { size: 10 } }, grid: { color: 'rgba(30,45,75,0.4)' } } } }
  });

  const ESTADO_TIPO = { 'Excelente':'ok','Estável':'ok','Atenção':'warn','Crítico':'crit' };
  document.getElementById('composicao-list').innerHTML = data.balancoNacional.map(p => `
    <div class="medida-row"><span>${p.produto}</span><span class="state-tag" style="background:var(--${ESTADO_TIPO[p.estado]}-bg);color:var(--${ESTADO_TIPO[p.estado]})">${p.cobertura} dias · ${p.estado}</span></div>`).join('');
});
</script>
</body>
</html>
