<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal do Produtor — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .weather-row { display: flex; gap: 8px; overflow-x: auto; }
  .weather-day { flex-shrink: 0; width: 90px; background: var(--navy-800); border-radius: 8px; padding: 10px; text-align: center; }
  .weather-temp { font-family: var(--font-data); font-size: 16px; font-weight: 700; margin: 4px 0; }
  .weather-rec { font-size: 9.5px; color: var(--ink-faint); }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand"><div class="brand-mark">P</div><div class="brand-text"><div class="brand-title">Portal Privado</div><div class="brand-sub">SINAGEPE — Produtores</div></div></div>
      <nav class="nav-list">
        <a class="nav-item active" href="portal-produtores.html"><span class="nav-icon">▦</span> Painel</a>
        <a class="nav-item" href="#"><span class="nav-icon">◎</span> Mercado</a>
        <a class="nav-item" href="#"><span class="nav-icon">⇄</span> Logística</a>
        <a class="nav-item" href="#"><span class="nav-icon">▤</span> Armazéns</a>
        <a class="nav-item" href="#"><span class="nav-icon">≋</span> Simulador</a>
        <a class="nav-item" href="#"><span class="nav-icon">▧</span> Relatórios</a>
        <a class="nav-item" href="#"><span class="nav-icon">⚙</span> Configurações</a>
      </nav>
    </div>
    <div class="sidebar-footer"><div class="avatar-dot" id="user-initials">CO</div><div class="sidebar-footer-text"><div class="sidebar-footer-name" id="user-nome">—</div><div class="sidebar-footer-role" id="user-cargo">—</div></div></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title-group"><div class="topbar-title">Portal do Produtor</div><div class="topbar-badge">Produção &amp; Clima</div></div>
      <div class="live-indicator"><span class="live-dot"></span> Dados em tempo real</div>
    </div>
    <div class="content" id="content-mount"></div>
    <div class="footer"><span>© 2026 SINAGEPE Moçambique — Acesso Privado</span><span id="footer-updated">—</span></div>
  </div>
</div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  const p = data.portalProdutores;
  SINAGEPE.renderUserFooter({ utilizador: { nome: p.cooperativa, instituicao: 'Sector Agrícola', direccao: 'Gerente de Produção' } });
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  document.getElementById('content-mount').innerHTML = `
    <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)">
      ${SINAGEPE.kpiCard({ label: 'Área Cultivada', valor: p.kpis.areaCultivadaHa + ' ha', estado: 'Registada', tipo: 'info' })}
      ${SINAGEPE.kpiCard({ label: 'Produção Prevista', valor: p.kpis.producaoPrevistaTon + ' ton', estado: 'Estimado', tipo: 'ok' })}
      ${SINAGEPE.kpiCard({ label: 'Rentabilidade Estimada', valor: p.kpis.rentabilidadeEstimadaPercent + '%', estado: p.kpis.procuraRegional, tipo: 'ok' })}
    </div>

    <div class="card">
      <div class="card-title">Clima — Próximos 7 Dias</div>
      <div class="card-subtitle">Recomendação agrícola por dia (chuva prevista + fase da cultura)</div>
      <div class="weather-row" id="weather-row"></div>
    </div>

    <div class="row-2">
      <div class="card">
        <div class="card-title">Recomendações de IA</div>
        <div id="recomendacoes-list"></div>
      </div>
      <div class="card">
        <div class="card-title">Preços Futuros Estimados vs. Actual</div>
        <table class="balance-table">
          <thead><tr><th>Cultura</th><th>Actual</th><th>Futuro</th><th>Variação</th></tr></thead>
          <tbody id="precos-body"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Culturas Recomendadas para a sua Região</div>
      <div id="culturas-list"></div>
    </div>
  `;

  document.getElementById('weather-row').innerHTML = p.previsaoTempo.map(d => `
    <div class="weather-day"><div style="font-size:11px;font-weight:600">${d.dia}</div><div class="weather-temp">${d.tempC}°C</div><div class="weather-rec">${d.recomendacao}</div></div>`).join('');

  document.getElementById('recomendacoes-list').innerHTML = p.recomendacoes.map(r => `
    <div class="medida-row" style="display:block;padding:10px 0"><b style="font-size:12.5px">${r.tipo}</b><div style="font-size:12px;color:var(--ink-dim);margin-top:4px">${r.texto}</div></div>`).join('');

  document.getElementById('precos-body').innerHTML = p.precosFuturos.map(c => `
    <tr><td>${c.cultura}</td><td>${c.precoActual} MZN/kg</td><td>${c.precoFuturo} MZN/kg</td>
    <td style="color:${c.variacaoPercent >= 0 ? 'var(--ok)' : 'var(--crit)'}">${c.variacaoPercent >= 0 ? '+' : ''}${c.variacaoPercent}%</td></tr>`).join('');

  document.getElementById('culturas-list').innerHTML = p.culturasRecomendadas.map((c, i) => `
    <div class="medida-row"><span>${i + 1}. ${c.cultura}</span><span class="pill pill-info">${c.razao}</span></div>`).join('');
});
</script>
</body>
</html>
