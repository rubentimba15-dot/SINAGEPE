<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard ARC — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand"><div class="brand-mark">A</div><div class="brand-text"><div class="brand-title">ARC</div><div class="brand-sub">Regulação da Concorrência</div></div></div>
      <nav class="nav-list">
        <a class="nav-item active" href="dashboard-arc.html"><span class="nav-icon">▦</span> Painel Antitruste</a>
        <a class="nav-item" href="#"><span class="nav-icon">⚠</span> Investigações Activas</a>
        <a class="nav-item" href="#"><span class="nav-icon">◎</span> Concentração HHI</a>
        <a class="nav-item" href="#"><span class="nav-icon">▧</span> Evolução de Tarifas</a>
        <a class="nav-item" href="#"><span class="nav-icon">⚙</span> Configurações</a>
        <a class="nav-item" href="index.html" onclick="sessionStorage.removeItem('sinagepe_nivel')" style="margin-top:8px;border-top:1px solid rgba(212,165,116,0.15);border-radius:0;padding-top:14px"><span class="nav-icon">↩</span> <span style="color:#ef4444">Sair (Logout)</span></a>
      </nav>
    </div>
    <div class="sidebar-footer"><div class="avatar-dot" id="user-initials">AR</div><div class="sidebar-footer-text"><div class="sidebar-footer-name" id="user-nome">—</div><div class="sidebar-footer-role" id="user-cargo">—</div></div></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title-group"><div class="topbar-title">Dashboard ARC</div><div class="topbar-badge">Portal Vivo de Inteligência Integrada (SIMULADO)</div></div>
      <div class="live-indicator"><span class="live-dot"></span> Dados em tempo real</div>
    </div>
    <div class="content" id="content-mount"></div>
    <div class="footer"><span>© 2026 SINAGEPE Moçambique - ARC</span><span id="footer-updated">—</span></div>
  </div>
</div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  const a = data.dashboardARC;
  SINAGEPE.renderUserFooter({ utilizador: { nome: 'Dr. J. Sitoe', instituicao: 'ARC', direccao: 'Analista de Concorrência' } });
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  document.getElementById('content-mount').innerHTML = `
    <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">
      ${SINAGEPE.kpiCard({ label: 'Índice de Concentração (HHI)', valor: a.kpis.hhiNacional.toFixed(2), estado: 'Concentrado', tipo: 'warn' })}
      ${SINAGEPE.kpiCard({ label: 'Mercados Monitorizados', valor: a.kpis.mercadosMonitorizados + ' Sectores', estado: 'Normal', tipo: 'info' })}
      ${SINAGEPE.kpiCard({ label: 'Alertas Concorrenciais', valor: a.kpis.alertasConcorrenciaisActivos, estado: 'Risco Cartel', tipo: 'crit' })}
      ${SINAGEPE.kpiCard({ label: 'Investigações Activas', valor: a.kpis.investigacoesActivas + ' Casos', estado: 'Em Progresso', tipo: 'warn' })}
    </div>

    <div class="row-2">
      <div class="card">
        <div class="card-title">Índice HHI por Produto Essencial</div>
        <div class="card-subtitle">Escala 0-1 &mdash; &lt;0,3 Baixo, 0,3&ndash;0,6 Moderado, &gt;0,6 Alto</div>
        <div id="hhi-list"></div>
      </div>
      <div class="card">
        <div class="card-title">Barreiras de Entrada</div>
        <div id="barreiras-list"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Quotas de Mercado das Empresas Dominantes</div>
      <div class="card-subtitle">Identificadas por nome — quota de mercado de líderes de sector é informação regulatória tipicamente pública</div>
      <table class="balance-table">
        <thead><tr><th>Produto</th><th>Empresa Dominante</th><th>Quota</th><th>Tendência</th><th>Risco Conc.</th></tr></thead>
        <tbody id="empresas-body"></tbody>
      </table>
    </div>

    <div class="card" style="background:var(--navy-800);border-color:var(--crit)">
      <div class="pill pill-crit" style="margin-bottom:8px">PREV. ATIVA — Detecção Preventiva de Cartéis</div>
      <p style="font-size:12.5px;color:var(--ink-dim);line-height:1.6;margin:0" id="cartel-texto"></p>
    </div>
  `;

  const HHI_TIPO = h => h > 0.6 ? 'crit' : h >= 0.3 ? 'warn' : 'ok';
  document.getElementById('hhi-list').innerHTML = a.hhiPorProduto.map(h => `
    <div class="util-row"><div class="util-label-row"><span>${h.produto}</span><span>${h.hhi.toFixed(2)}</span></div>
    <div class="util-track"><div class="util-fill pill-${HHI_TIPO(h.hhi)}" style="width:${h.hhi * 100}%"></div></div></div>`).join('');

  document.getElementById('barreiras-list').innerHTML = a.barreirasEntrada.map(b => `
    <div class="util-row"><div class="util-label-row"><span>${b.tipo}</span><span>${b.pontuacao}/10</span></div>
    <div class="util-track"><div class="util-fill" style="width:${b.pontuacao * 10}%;background:var(--bronze)"></div></div>
    <div style="font-size:10.5px;color:var(--ink-faint);margin-top:2px">${b.descricao}</div></div>`).join('');

  const RISCO_TIPO = { 'Crítico': 'crit', 'Alto': 'crit', 'Médio': 'warn', 'Baixo': 'ok' };
  document.getElementById('empresas-body').innerHTML = a.empresasDominantes.map(e => `
    <tr><td>${e.produto}</td><td>${e.empresa}</td><td>${e.quotaPercent}%</td><td>${e.tendencia}</td>
    <td><span class="state-tag" style="background:var(--${RISCO_TIPO[e.risco]}-bg);color:var(--${RISCO_TIPO[e.risco]})">${e.risco}</span></td></tr>`).join('');

  document.getElementById('cartel-texto').textContent = a.alertaCartel.descricao;
});
</script>
</body>
</html>
