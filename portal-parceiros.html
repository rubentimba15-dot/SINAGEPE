<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Parceiros — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .ipc-tile { text-align: center; padding: 12px 8px; border-radius: 8px; }
  .ipc-fase { font-family: var(--font-data); font-size: 20px; font-weight: 700; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand"><div class="brand-mark">P</div><div class="brand-text"><div class="brand-title">Portal Parceiros</div><div class="brand-sub">SINAGEPE — Cooperação Internacional</div></div></div>
      <nav class="nav-list">
        <a class="nav-item active" href="portal-parceiros.html"><span class="nav-icon">▦</span> Painel Geral</a>
        <a class="nav-item" href="#"><span class="nav-icon">◎</span> Mapa de Vulnerabilidade</a>
        <a class="nav-item" href="#"><span class="nav-icon">⛁</span> Doadores &amp; FAO</a>
        <a class="nav-item" href="#"><span class="nav-icon">▧</span> Financiamentos</a>
        <a class="nav-item" href="#"><span class="nav-icon">⚙</span> Relatórios ODS</a>
      </nav>
    </div>
    <div class="sidebar-footer"><div class="avatar-dot" id="user-initials">HM</div><div class="sidebar-footer-text"><div class="sidebar-footer-name" id="user-nome">—</div><div class="sidebar-footer-role" id="user-cargo">—</div></div></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title-group"><div class="topbar-title">Portal Parceiros</div><div class="topbar-badge">Cooperação Internacional</div></div>
      <div class="live-indicator"><span class="live-dot"></span> Dados em tempo real</div>
    </div>
    <div class="content" id="content-mount"></div>
    <div class="footer"><span>© 2026 SINAGEPE Moçambique — Acesso Parceiro</span><span id="footer-updated">—</span></div>
  </div>
</div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.load().then(data => {
  const p = data.portalParceiros;
  SINAGEPE.renderUserFooter({ utilizador: { nome: 'Dr. Hans Meyer', instituicao: p.organizacao, direccao: 'Monitor Executivo (WFP)' } });
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  document.getElementById('content-mount').innerHTML = `
    <div class="card">
      <div class="card-title">Classificação IPC por Província</div>
      <div class="card-subtitle">Sistema internacional (FAO/WFP), paralelo e independente da Disponibilidade/Cobertura interna do SINAGEPE — medem coisas diferentes: IPC mede insegurança alimentar da população, Disponibilidade mede stock físico</div>
      <div class="province-grid" id="ipc-grid"></div>
      <div class="legend" style="flex-wrap:wrap">
        <div class="legend-item"><span class="legend-dot" style="background:var(--ok)"></span> Fase 1 — Mínimo</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--info)"></span> Fase 2 — Sob Pressão</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span> Fase 3 — Crise</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--crit)"></span> Fase 4 — Emergência</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Eventos Climáticos e Impactos Económicos Recentes</div>
      <div id="eventos-list"></div>
    </div>
  `;

  const FASE_COR = { 1: 'var(--ok)', 2: 'var(--info)', 3: 'var(--warn)', 4: 'var(--crit)', 5: 'var(--crit)' };
  document.getElementById('ipc-grid').innerHTML = p.classificacaoIPC.map(c => `
    <div class="ipc-tile" style="background:${FASE_COR[c.fase]}22"><div class="province-name">${c.provincia}</div><div class="ipc-fase" style="color:${FASE_COR[c.fase]}">Fase ${c.fase}</div></div>`).join('');

  document.getElementById('eventos-list').innerHTML = p.eventosClimaticos.map(e => `
    <div class="alert-card ${e.estado === 'Crítico' ? 'crit' : 'warn'}">
      <div class="alert-title">${e.nome} — ${e.local}</div>
      <div class="alert-desc">${e.perdaHa ? 'Perda de ' + SINAGEPE.fmt(e.perdaHa) + ' ha, recuperação estimada em ' + e.recuperacaoMeses + ' meses.' : e.nota}</div>
    </div>`).join('');
});
</script>
</body>
</html>
