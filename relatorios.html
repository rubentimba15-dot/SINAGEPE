<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatórios e Exportação — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .report-card { background: var(--navy-800); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  .report-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .report-name { font-size: 13.5px; font-weight: 700; }
  .report-desc { font-size: 12px; color: var(--ink-dim); margin: 4px 0 10px; }
  .report-meta { font-size: 10.5px; color: var(--ink-faint); }
  .report-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-sm { font-size: 11.5px; font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .btn-sm.primary { background: var(--bronze); color: var(--navy-950); border: none; }
  .gen-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .gen-field label { font-size: 11px; color: var(--ink-faint); font-weight: 600; }
  .gen-field select { background: var(--navy-900); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font-size: 12.5px; }
</style>
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('relatorios', 'Relatórios e Exportação', 'Periódicos, Sectoriais e Auditoria');

document.getElementById('content-mount').innerHTML = `
  <div class="row-2">
    <div class="card">
      <div class="card-title">Relatórios Periódicos</div>
      <div class="card-subtitle">Gerados automaticamente pelo sistema, segundo a sua frequência</div>
      <div id="reports-list"></div>
    </div>

    <div class="card">
      <div class="card-title">Gerador Customizado</div>
      <div class="card-subtitle">Compila um relatório à medida a partir dos parâmetros escolhidos</div>
      <div class="gen-field"><label>Produto</label>
        <select id="gen-produto"><option>Todos os Produtos</option></select>
      </div>
      <div class="gen-field"><label>Período</label>
        <select id="gen-periodo"><option>Últimos 7 dias</option><option>Últimos 30 dias</option><option>Último Trimestre</option><option>Último Ano</option></select>
      </div>
      <div class="gen-field"><label>Província / Região</label>
        <select id="gen-provincia"><option>Todo o País</option></select>
      </div>
      <div class="gen-field"><label>Formato</label>
        <select id="gen-formato"><option>PDF</option><option>Excel (XLSX)</option><option>CSV</option></select>
      </div>
      <button class="btn-sm primary" id="btn-compilar" style="width:100%;padding:10px">Compilar &amp; Exportar</button>
      <div id="gen-status" style="margin-top:10px;font-size:11.5px;color:var(--ink-faint)"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Exportações Recentes</div>
    <table class="balance-table">
      <thead><tr><th>Ficheiro</th><th>Formato</th><th>Data</th><th>Tamanho</th><th>Gerado Por</th></tr></thead>
      <tbody id="export-body"></tbody>
    </table>
  </div>
`;

SINAGEPE.load().then(renderRelatorios);

function renderRelatorios(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;

  document.getElementById('reports-list').innerHTML = data.relatoriosModelo.map(r => `
    <div class="report-card">
      <div class="report-top"><span class="report-name">${r.nome}</span><span class="pill pill-info">${r.frequencia}</span></div>
      <div class="report-desc">${r.descricao}</div>
      <div class="report-meta">Gerado: ${r.geradoEm}</div>
      <div class="report-actions">
        <button class="btn-sm">Visualizar</button>
        <button class="btn-sm primary">Descarregar</button>
      </div>
    </div>`).join('');

  const produtos = [...new Set(data.balancoNacional.map(p => p.produto))];
  document.getElementById('gen-produto').innerHTML += produtos.map(p => `<option>${p}</option>`).join('');
  document.getElementById('gen-provincia').innerHTML += data.provincias.map(p => `<option>${p.nome}</option>`).join('');

  document.getElementById('export-body').innerHTML = data.exportacoesRecentes.map(e => `
    <tr><td>${e.ficheiro}</td><td>${e.formato}</td><td>${e.data}</td><td>${e.tamanho}</td><td>${e.geradoPor}</td></tr>`).join('');

  document.getElementById('btn-compilar').addEventListener('click', function () {
    const produto = document.getElementById('gen-produto').value;
    const periodo = document.getElementById('gen-periodo').value;
    const provincia = document.getElementById('gen-provincia').value;
    const formato = document.getElementById('gen-formato').value;
    document.getElementById('gen-status').innerHTML =
      `⏳ A compilar: ${produto} · ${periodo} · ${provincia} · ${formato}. (Simulação — geração real de ficheiro requer backend, ainda não implementado neste protótipo.)`;
  });
}
</script>
</body>
</html>
