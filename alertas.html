<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Alertas — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('alertas', 'Centro de Alertas', 'Inteligência de Alertas Nacionais');

document.getElementById('content-mount').innerHTML = `
  <div class="card">
    <div class="filter-bar">
      <select id="f-produto"><option value="">Todos os Produtos</option></select>
      <select id="f-provincia"><option value="">Todas as Províncias</option></select>
      <select id="f-tipo"><option value="">Todos os Tipos</option></select>
      <select id="f-confianca">
        <option value="0">Qualquer Confiança</option>
        <option value="90">≥ 90%</option>
        <option value="75">≥ 75%</option>
        <option value="50">≥ 50%</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;color:var(--ink-faint)">Alertas de retenção especulativa são detectados por um sub-módulo dedicado.</span>
      <a href="irae.html" style="font-size:12px;font-weight:600;color:var(--bronze)">Ver Casos IRAE (Retenção Artificial) →</a>
    </div>
  </div>

  <div class="split-panel">
    <div id="alert-list"></div>
    <div class="card detail-panel" id="alert-detail"></div>
  </div>
`;

SINAGEPE.load().then(renderAlertas);

let TODOS_ALERTAS = [];
let SELECCIONADO = null;

function renderAlertas(data) {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = 'Última actualização: ' + data.meta.ultimaActualizacao;
  TODOS_ALERTAS = data.alertasDetalhe;

  // preencher filtros a partir dos dados reais, sem valores fixos
  const produtos = [...new Set(TODOS_ALERTAS.map(a => a.produto))];
  const provincias = [...new Set(TODOS_ALERTAS.map(a => a.provincia))];
  const tipos = [...new Set(TODOS_ALERTAS.map(a => a.tipo))];
  document.getElementById('f-produto').innerHTML += produtos.map(p => `<option value="${p}">${p}</option>`).join('');
  document.getElementById('f-provincia').innerHTML += provincias.map(p => `<option value="${p}">${p}</option>`).join('');
  document.getElementById('f-tipo').innerHTML += tipos.map(t => `<option value="${t}">${t}</option>`).join('');

  ['f-produto', 'f-provincia', 'f-tipo', 'f-confianca'].forEach(id =>
    document.getElementById(id).addEventListener('change', aplicarFiltros));

  // Deep-link opcional: alertas.html?provincia=Tete pré-selecciona o filtro
  // (usado pelo mapa central do dashboard) — não afecta o uso normal do ecrã.
  const params = new URLSearchParams(window.location.search);
  const provinciaParam = params.get('provincia');
  if (provinciaParam) document.getElementById('f-provincia').value = provinciaParam;

  SELECCIONADO = TODOS_ALERTAS[0].id;
  aplicarFiltros();
}

function aplicarFiltros() {
  const produto = document.getElementById('f-produto').value;
  const provincia = document.getElementById('f-provincia').value;
  const tipo = document.getElementById('f-tipo').value;
  const confianca = Number(document.getElementById('f-confianca').value);

  const filtrados = TODOS_ALERTAS.filter(a =>
    (!produto || a.produto === produto) &&
    (!provincia || a.provincia === provincia) &&
    (!tipo || a.tipo === tipo) &&
    (a.confianca >= confianca)
  );

  renderLista(filtrados);
  const aindaVisivel = filtrados.find(a => a.id === SELECCIONADO);
  renderDetalhe(aindaVisivel || filtrados[0] || null);
}

const SEV_TIPO = { 'Crítico': 'crit', 'Atenção': 'warn', 'Normal': 'ok' };

function renderLista(alertas) {
  const el = document.getElementById('alert-list');
  if (alertas.length === 0) { el.innerHTML = `<div class="card">Nenhum alerta corresponde aos filtros seleccionados.</div>`; return; }
  el.innerHTML = alertas.map(a => `
    <div class="alert-card ${SEV_TIPO[a.severidade]} ${a.id === SELECCIONADO ? 'selected' : ''}" data-id="${a.id}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span class="pill pill-info" style="font-size:9px">${a.tipo}</span>
        <span class="confidence-badge">${a.confianca}% Confiança</span>
      </div>
      <div class="alert-title">${a.titulo}</div>
      <div class="alert-meta">${a.provincia} · ${a.tempo} · ${a.estado}</div>
      <div class="alert-desc">${a.descricao}</div>
    </div>`).join('');

  el.querySelectorAll('.alert-card').forEach(card => card.addEventListener('click', () => {
    SELECCIONADO = card.dataset.id;
    aplicarFiltros();
  }));
}

function renderDetalhe(a) {
  const el = document.getElementById('alert-detail');
  if (!a) { el.innerHTML = `<div class="card-subtitle">Sem alerta seleccionado.</div>`; return; }

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
      <span class="pill pill-${SEV_TIPO[a.severidade]}">SEVERIDADE ${a.severidade.toUpperCase()}</span>
      <span style="font-family:var(--font-data);font-size:11px;color:var(--ink-faint)">#<a href="detalhe-alerta.html?id=${a.id}" style="color:var(--bronze)">${a.id}</a></span>
    </div>
    <div class="card-title" style="margin-bottom:2px">${a.titulo}</div>
    <div class="card-subtitle">${a.provincia} · Actualizado ${a.tempo}</div>
    <p style="font-size:13px;color:var(--ink-dim);line-height:1.6">${a.descricao}</p>

    <details style="margin-bottom:16px">
      <summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--bronze)">Por que recebi este alerta?</summary>
      <div class="expand-box">
        <b>Fontes de dados:</b> ${a.fontes.join(', ')}<br>
        <b>Regra de decisão:</b> ${a.regra}<br>
        <b>Grau de confiança:</b> ${a.confianca}%
      </div>
    </details>

    <div class="kpi-label" style="margin-bottom:8px">Medidas de Contingência Recomendadas</div>
    ${a.medidas.map(m => `<div class="medida-row"><span>${m.descricao}</span><span class="pill pill-info">${m.responsavel}</span></div>`).join('')}

    <div style="display:flex;gap:10px;margin-top:18px">
      <button id="btn-mitigar" style="background:var(--bronze);color:var(--navy-950);border:none;border-radius:8px;padding:10px 16px;font-weight:700;font-size:12.5px;cursor:pointer">Mitigar Rápido</button>
      <button id="btn-oficio" style="background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:700;font-size:12.5px;cursor:pointer">Disparar Ofício</button>
    </div>
    <div id="acao-status" style="margin-top:10px;font-size:11.5px;color:var(--ink-faint)"></div>
  `;

  document.getElementById('btn-mitigar').addEventListener('click', function () {
    this.disabled = true;
    document.getElementById('acao-status').textContent =
      '✔ Instituição responsável notificada. Nenhuma acção foi aplicada automaticamente — decisão fica com a instituição. (Simulação.)';
  });
  document.getElementById('btn-oficio').addEventListener('click', function () {
    this.disabled = true;
    document.getElementById('acao-status').textContent =
      '📄 Rascunho de ofício gerado, a aguardar revisão humana antes de envio. (Simulação — sem envio real neste protótipo.)';
  });
}
</script>
</body>
</html>
