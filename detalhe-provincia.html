<!doctype html>
<html lang="pt-PT">
<head>
<script src="assets/access-control.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhe da Província — SINAGEPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sinagepe.css">
<style>
  .breadcrumb { font-size: 12px; color: var(--ink-faint); margin-bottom: 4px; }
  .page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-title { font-size: 26px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 14px; }
  .back-btn { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--bronze); }
</style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<script src="assets/sinagepe.js"></script>
<script>
SINAGEPE.mountShell('mapa', 'Atlas de Monitoria de Mercadorias e Corredores', 'Sistema Vivo');

document.getElementById('content-mount').innerHTML = `
  <div class="page-title-row">
    <div>
      <div class="breadcrumb">Mapa Nacional &gt; Província de <span id="prov-nome">—</span></div>
      <div class="page-title">Província de <span id="prov-nome2">—</span> <span class="pill pill-crit" id="prov-badge"></span></div>
    </div>
    <a class="back-btn" href="mapa-nacional.html">← Voltar ao Mapa Nacional</a>
  </div>
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)" id="kpi-row"></div>
  <div class="row-2">
    <div class="card">
      <div class="card-title">Balanço de Stock e Consumo Provincial</div>
      <table class="balance-table">
        <thead><tr><th>Produto</th><th>Stock</th><th>Requisito Diário</th><th>Cobertura</th><th>Estado</th></tr></thead>
        <tbody id="produtos-body"></tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-title">Timeline de Alertas</div>
      <div id="timeline-list"></div>
    </div>
  </div>
`;

SINAGEPE.load().then(data => {
  SINAGEPE.renderUserFooter(data);
  document.getElementById('footer-updated').textContent = data.meta.ultimaActualizacao;

  const prov = data.provincias.find(p => p.nome === 'Tete');
  const dp = data.detalheProvincia;
  document.getElementById('prov-nome').textContent = prov.nome;
  document.getElementById('prov-nome2').textContent = prov.nome;
  document.getElementById('prov-badge').textContent = `Estado Crítico (${prov.disponibilidade}%)`;

  const coberturaMedia = Math.round(dp.produtos.reduce((a,p)=>a+p.coberturaDias,0) / dp.produtos.length);
  const criticos = data.alertasDetalhe.filter(a => a.provincia === 'Tete' && a.severidade === 'Crítico').length;
  const kpis = [
    { label: 'Cobertura Média de Stock', valor: coberturaMedia + ' Dias', estado: 'Nível Vermelho', tipo: 'crit' },
    { label: 'Alertas Activos na Província', valor: (criticos || 1) + ' Críticos', estado: 'Foco Imediato', tipo: 'crit' },
    { label: 'População Sob Risco', valor: dp.populacaoSobRiscoM + 'M Habitantes', estado: 'Alta Densidade', tipo: 'warn' },
    { label: 'Custos Logísticos Adicionais', valor: '+' + dp.custosLogisticosAdicionaisPercent + '% MZN', estado: 'Rotas Alternativas', tipo: 'warn' },
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(SINAGEPE.kpiCard).join('');

  document.getElementById('produtos-body').innerHTML = dp.produtos.map(p => `
    <tr><td>${p.produto}</td><td>${SINAGEPE.fmt(p.stock)} ${p.unidade}</td><td>${p.requisitoDiario} ${p.unidade}/dia</td>
    <td>${SINAGEPE.stateTag(p.coberturaDias < 7 ? 'Crítico' : p.coberturaDias < 15 ? 'Atenção' : 'Estável')}</td>
    <td>${SINAGEPE.stateTag(p.estado)}</td></tr>`).join('');

  const SEV = { 'Crítico': 'crit', 'Atenção': 'warn' };
  document.getElementById('timeline-list').innerHTML = dp.timeline.map(t => `
    <div class="alert-card ${SEV[t.severidade]}">
      <div style="display:flex;justify-content:space-between"><span class="alert-title">${t.titulo}</span><span class="alert-meta">${t.tempo}</span></div>
      <div class="alert-desc">${t.descricao}</div>
    </div>`).join('');
});
</script>
</body>
</html>
