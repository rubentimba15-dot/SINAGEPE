<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINAGEPE — Simulador Preditivo</title>
<link rel="stylesheet" href="assets/sinagepe-tema.css">
<style>
.sp-top{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;align-items:start}
.cen{display:flex;gap:11px;padding:11px;border:1px solid transparent;border-radius:10px;cursor:pointer;transition:.16s;margin-bottom:5px}
.cen:hover{background:var(--cardh)}
.cen.on{background:var(--accg);border-color:rgba(34,184,240,.32)}
.cen .ic{width:34px;height:34px;border-radius:9px;background:#080F1C;display:grid;place-items:center;flex:none}
.cen b{font-size:12.5px;font-weight:500;display:block}
.cen span{font-size:10px;color:var(--ink-faint);line-height:1.4;display:block;margin-top:2px}
.par{margin-bottom:16px}
.par .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-dim);margin-bottom:7px}
.par .lb b{font-size:15px;color:var(--brzl);font-weight:500}
input[type=range]{width:100%;accent-color:#22B8F0;background:transparent}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card-bg);border:1px solid var(--card-line);border-radius:13px;padding:14px 16px;position:relative}
.kpi .cap{font-size:9.5px;color:var(--ink-faint);letter-spacing:.13em;text-transform:uppercase}
.kpi .v{font-size:27px;font-weight:500;margin-top:8px;line-height:1}
.kpi .v small{font-size:12px;color:var(--ink-dim);margin-left:3px}
.kpi .sub{font-size:10.5px;color:var(--ink-dim);margin-top:7px;line-height:1.4}
.kpi .rail{position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px}
.interv{padding:15px 18px;border-bottom:1px solid var(--card-line)}
.interv:last-child{border-bottom:none}
.interv .h{display:flex;align-items:flex-start;gap:10px}
.interv .h b{font-size:13px;font-weight:500;flex:1}
.interv .p{font-size:11.5px;color:var(--ink-dim);margin-top:7px;line-height:1.65}
.interv .m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.interv .m div{background:#080F1C;border-left:2px solid var(--brzg);border-radius:0 8px 8px 0;padding:8px 10px}
.interv .m .l{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.interv .m .n{font-size:14px;font-weight:500;margin-top:3px}
.interv .f{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
.chip{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:3px;font-weight:500}
.dd{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.nivel{background:#080F1C;border:1px solid var(--card-line);border-radius:12px;padding:14px}
.nivel .t{font-size:12px;font-weight:500;display:flex;align-items:center;gap:9px}
.nivel .row2{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim);padding:6px 0;border-top:1px solid rgba(38,56,86,.4)}
.crumb{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-faint);margin-bottom:12px;flex-wrap:wrap}
.crumb b{color:var(--brzl);font-weight:500}
.crumb button{background:none;border:none;color:var(--acc);font:inherit;font-size:11px;cursor:pointer;padding:0}
table.risco td.p{cursor:pointer}
table.risco tr:hover td{background:var(--cardh)}
@media (max-width:1250px){.sp-top{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app-shell"></div>

<script src="assets/access-control.js"></script>
<script src="assets/sinagepe.js"></script>
<script src="assets/sinagepe-produtos.js"></script>
<script>
/* ============================================================
   SIMULADOR PREDITIVO — SINAGEPE
   ------------------------------------------------------------
   NATUREZA DO MODELO, declarada à cabeça para que ninguém a
   descubra tarde: isto é um modelo determinístico de cenários
   com coeficientes assumidos, não previsão estatística. Não há
   série histórica suficiente no sistema para estimar nada. O que
   o modelo faz é propagar, de forma transparente e reproduzível,
   o efeito de um choque sobre a cobertura, os produtores e as
   contas — e ordenar as intervenções possíveis por eficácia.

   Todos os coeficientes vivem em data/produtores-agrarios.json,
   no bloco "elasticidades". Alterar lá altera o modelo inteiro.
   ============================================================ */
let D=null, FX=null, RL=null, PA=null;
let CEN='seca', PAR={}, DRILL={produto:null, provincia:null};
const $=id=>document.getElementById(id);
const nf=(n,d=0)=>(n==null||isNaN(n))?'—':Number(n).toLocaleString('pt-PT',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n,d=1)=>n==null?'—':(n>0?'+':'')+nf(n,d)+'%';

/* ---------- cenários ---------- */
const CENARIOS = {
  seca: { nome:'Défice de chuva', sub:'Campanha com precipitação abaixo do normal',
    ic:'M12 3v3M5 8l2 2M19 8l-2 2M4 15h16M7 19h10M9 22h6', cor:'#F0A926',
    params:[{k:'deficit', nome:'Défice de precipitação', un:'%', min:5, max:60, val:25, passo:5},
            {k:'meses', nome:'Duração', un:' meses', min:1, max:6, val:3, passo:1}] },
  praga: { nome:'Praga fitossanitária', sub:'Surto com perdas na cultura em pé',
    ic:'M12 4v16M8 8l8 8M16 8l-8 8M6 12h12', cor:'#EF4444',
    params:[{k:'incidencia', nome:'Incidência nas explorações', un:'%', min:5, max:70, val:20, passo:5},
            {k:'provAfect', nome:'Províncias afectadas', un:'', min:1, max:10, val:3, passo:1}] },
  corredor: { nome:'Interrupção de corredor', sub:'Bloqueio de eixo ou de terminal portuário',
    ic:'M3 17h3l2-6h8l2 6h3M7 17a2 2 0 1 0 4 0M15 17a2 2 0 1 0 4 0M4 4l16 16', cor:'#EF4444',
    params:[{k:'dias', nome:'Dias de interrupção', un:' dias', min:2, max:60, val:14, passo:2}] },
  combustivel: { nome:'Choque de combustível', sub:'Subida do preço do gasóleo',
    ic:'M6 4h9l3 4v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2ZM18 10h3v8a2 2 0 0 1-4 0', cor:'#E0A458',
    params:[{k:'subida', nome:'Subida do preço', un:'%', min:5, max:80, val:30, passo:5}] },
  divisas: { nome:'Escassez de divisas', sub:'Restrição cambial nas importações',
    ic:'M12 3v18M8 7h6a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6', cor:'#22B8F0',
    params:[{k:'corte', nome:'Corte no volume importado', un:'%', min:5, max:60, val:25, passo:5},
            {k:'atraso', nome:'Atraso nas cartas de crédito', un:' dias', min:0, max:60, val:20, passo:5}] },
  preco: { nome:'Choque de preço internacional', sub:'Subida nos mercados de origem',
    ic:'M4 18l5-6 4 4 7-9M17 7h4v4', cor:'#2DD4BF',
    params:[{k:'subida', nome:'Subida do preço FOB', un:'%', min:5, max:80, val:25, passo:5}] },
  ciclone: { nome:'Ciclone tropical', sub:'Perda de colheita, armazém e estrada em simultâneo',
    ic:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM12 12c-5 0-8 3-8 6M12 12c5 0 8-3 8-6M4 18h16', cor:'#EF4444',
    params:[{k:'intensidade', nome:'Perda na zona de impacto', un:'%', min:10, max:80, val:40, passo:5},
            {k:'provAfect', nome:'Províncias na trajectória', un:'', min:1, max:5, val:2, passo:1}] }
};

/* ---------- utilitários do modelo ---------- */
function faseSazonal(){
  const m=new Date().getMonth()+1;
  const f=PA.calendarioAgricola.fases.find(x=>x.meses.indexOf(m)>-1);
  return f || {fase:'—', pressaoAbastecimento:'media'};
}
const PESO_SAZONAL={baixa:0.9, media:1.0, alta:1.12, critica:1.25};

// Capacidade de um produtor resistir ao choque, a partir do CUPA.
// Irrigação, semente certificada e extensão reduzem a perda; é isto que
// transforma o cadastro num instrumento de decisão e não num arquivo.
function resiliencia(p){
  const e=PA.elasticidades;
  const r = 1
    - (p.irrigacaoPercent/100)*e.reducaoPerdaPorIrrigacaoFactor
    - (p.sementeCertificadaPercent/100)*e.reducaoPerdaPorSementeCertificadaFactor
    - (p.extensaoPercent/100)*e.reducaoPerdaPorExtensaoFactor;
  return Math.max(0.35, r);
}

function provinciasOrdenadasPorExposicao(){
  return [...PA.provincias].sort((a,b)=> (b.exploracoes*resiliencia(b)) - (a.exploracoes*resiliencia(a)) );
}

/* ---------- motor de simulação ---------- */
function simular(){
  const e=PA.elasticidades, s=CENARIOS[CEN], p=PAR;
  const faseP=PESO_SAZONAL[faseSazonal().pressaoAbastecimento];
  const ipcSerie=FX.ine.ipc.serie;
  const premio=((ipcSerie[ipcSerie.length-1].indiceAlimentar/ipcSerie[0].indiceAlimentar-1)
              -(ipcSerie[ipcSerie.length-1].indiceGeral/ipcSerie[0].indiceGeral-1))*100;
  const fProcuraBase = 1 + (premio/100)*e.procuraPorInflacaoAlimentarFactor;

  let perdaColheitaPct=0, provAfectadas=[], diasLogisticos=0, custoLogFactor=1,
      cortesImportPct=0, subidaCustoPct=0, capacidadeArmazemPerdidaPct=0, corredoresAfectados=[];

  const ordenadas=provinciasOrdenadasPorExposicao();

  if(CEN==='seca'){
    perdaColheitaPct = p.deficit * e.perdaColheitaPorDeficitChuvaPercent * (p.meses/3);
    provAfectadas = ordenadas;
  } else if(CEN==='praga'){
    perdaColheitaPct = p.incidencia * e.perdaColheitaPorPragaPercent;
    provAfectadas = ordenadas.slice(0, p.provAfect);
  } else if(CEN==='corredor'){
    diasLogisticos = e.diasAdicionaisPorDesvioCorredor * Math.min(4, p.dias/7);
    corredoresAfectados = ['nacala'];
    provAfectadas = PA.provincias.filter(x=>PA.dependenciaCorredor.mapa[x.nome]==='nacala');
    capacidadeArmazemPerdidaPct = 18;
  } else if(CEN==='combustivel'){
    custoLogFactor = 1 + (p.subida/100)*e.custoLogisticoPorSubidaCombustivelFactor;
    subidaCustoPct = (custoLogFactor-1)*100;
    provAfectadas = ordenadas;
  } else if(CEN==='divisas'){
    cortesImportPct = p.corte;
    diasLogisticos = p.atraso*0.4;
    provAfectadas = ordenadas;
  } else if(CEN==='preco'){
    subidaCustoPct = p.subida;
    cortesImportPct = p.subida*0.35;   // menos volume pelo mesmo envelope cambial
    provAfectadas = ordenadas;
  } else if(CEN==='ciclone'){
    perdaColheitaPct = p.intensidade;
    provAfectadas = ordenadas.slice(0, p.provAfect);
    capacidadeArmazemPerdidaPct = p.intensidade*0.45;
    diasLogisticos = 6;
  }

  // efeito por produto
  const produtos = D.balancoNacional.map(b=>{
    const consumoDia = b.cobertura>0 ? b.stock/b.cobertura : 0;
    const importado = b.importacao>0;
    const nacional  = b.producao>0;
    const fProcura = fProcuraBase*faseP;

    let stockCen = b.stock;
    if(cortesImportPct && importado) stockCen -= b.importacao*(cortesImportPct/100)*(30/365);
    if(capacidadeArmazemPerdidaPct) stockCen -= b.stock*(capacidadeArmazemPerdidaPct/100)*0.5;
    stockCen = Math.max(0, stockCen);

    let consumoCen = consumoDia*fProcura;
    const cobBase = consumoDia>0 ? b.stock/consumoDia : 0;
    let cobCen = consumoCen>0 ? stockCen/consumoCen : 0;
    if(diasLogisticos) cobCen = Math.max(0, cobCen - diasLogisticos);

    // perda de colheita futura: só afecta o que é produzido no país
    let perdaT=0;
    if(perdaColheitaPct && nacional){
      const pesoProv = provAfectadas.reduce((s2,x)=>s2+x.exploracoes*resiliencia(x),0)
                     / PA.provincias.reduce((s2,x)=>s2+x.exploracoes,0);
      perdaT = b.producao*(perdaColheitaPct/100)*Math.min(1,pesoProv);
      cobCen -= perdaT/Math.max(1,consumoCen)*0.35;   // efeito diferido para a próxima campanha
      cobCen = Math.max(0, cobCen);
    }
    const custoExtra = subidaCustoPct ? b.importacao*(subidaCustoPct/100) : 0;
    return { nome:b.produto, cobBase, cobCen, delta:cobCen-cobBase, perdaT, consumoCen,
             stockBase:b.stock, stockCen, importado, nacional, custoExtraT:custoExtra,
             risco: cobCen<15?'crit':cobCen<30?'warn':'ok' };
  }).sort((a,b)=>a.cobCen-b.cobCen);

  const rupturas = produtos.filter(x=>x.risco==='crit');
  const primeiro = produtos[0];
  const produtoresAfectados = provAfectadas.reduce((s2,x)=>s2+x.exploracoes,0);
  const custoTotalT = produtos.reduce((s2,x)=>s2+x.custoExtraT,0);

  return { produtos, rupturas, primeiro, provAfectadas, produtoresAfectados, perdaColheitaPct,
           diasLogisticos, custoLogFactor, cortesImportPct, subidaCustoPct, custoTotalT,
           capacidadeArmazemPerdidaPct, corredoresAfectados, premio, faseP, fase:faseSazonal() };
}

/* ---------- intervenções proactivas ---------- */
function intervencoes(R){
  const I=[];
  const meta=FX.icm.reservaEstrategica;

  R.rupturas.forEach(p=>{
    const faltaDias = 30-p.cobCen;
    const toneladas = Math.max(0, faltaDias*p.consumoCen);
    I.push({ pri:1, t:`Libertar reserva estratégica — ${p.nome}`,
      p:`Repor ${nf(faltaDias,0)} dias de cobertura exige cerca de ${nf(toneladas)} t. A reserva do ICM tem ${nf(meta.actualToneladas)} t registadas, pelo que esta operação consome ${nf(toneladas/meta.actualToneladas*100,1)}% do que existe.`,
      efeito:`+${nf(faltaDias,0)} dias`, prazo:'7 a 14 dias', custo:toneladas>20000?'Alto':'Médio',
      apr:'Aprovação ministerial', ok:toneladas<=meta.actualToneladas });
  });

  if(R.cortesImportPct>0){
    I.push({ pri:1, t:'Priorizar divisas para a cesta essencial',
      p:`Com um corte de ${nf(R.cortesImportPct,0)}% no volume importado, a alocação de divisas deixa de ser neutra: sem regra de prioridade, o corte reparte-se por igual e atinge primeiro os produtos com menor margem. Fixar uma ordem de prioridade — cereais, óleo, combustível — antes do corte, não durante.`,
      efeito:'Evita ruptura simultânea', prazo:'Imediato', custo:'Nulo',
      apr:'Banco Central + Finanças + MIC', ok:true });
  }
  if(R.diasLogisticos>0){
    const alt = R.corredoresAfectados.length ? 'Pemba e Beira' : 'corredores alternativos';
    I.push({ pri:1, t:`Desvio para ${alt}`,
      p:`A interrupção acrescenta ${nf(R.diasLogisticos,1)} dias ao tempo médio de entrega. Activar o desvio recupera parte desse tempo, com penalização de custo por tonelada-quilómetro. Decidir nas primeiras 48 horas: depois disso, a fila no terminal alternativo já anula o ganho.`,
      efeito:`−${nf(R.diasLogisticos*0.6,1)} dias`, prazo:'48 horas', custo:'Médio',
      apr:'MTL + CFM + MIC', ok:true });
  }
  if(R.perdaColheitaPct>0){
    const fracas=[...R.provAfectadas].sort((a,b)=>a.irrigacaoPercent-b.irrigacaoPercent).slice(0,3);
    I.push({ pri:2, t:'Reforço de extensão e semente nas províncias menos resilientes',
      p:`As províncias com menor capacidade de absorver o choque são ${fracas.map(x=>x.nome).join(', ')} — irrigação abaixo de ${nf(Math.max(...fracas.map(f=>f.irrigacaoPercent)),1)}% e semente certificada abaixo de ${nf(Math.max(...fracas.map(f=>f.sementeCertificadaPercent)),1)}%. O modelo estima que subir a cobertura de semente certificada em 10 pontos reduz a perda em cerca de ${nf(10*PA.elasticidades.reducaoPerdaPorSementeCertificadaFactor,1)}%.`,
      efeito:`−${nf(R.perdaColheitaPct*0.18,1)}% de perda`, prazo:'Antes da campanha', custo:'Alto',
      apr:'MAAP + Finanças', ok:true });
    I.push({ pri:2, t:'Antecipar compra da produção local em risco',
      p:`Accionar o ICM como comprador de último recurso nas províncias afectadas, absorvendo a produção antes que a perda pós-colheita a destrua. Cumpre mandato legal existente e converte perda em reserva.`,
      efeito:'Converte perda em stock', prazo:'2 a 4 semanas', custo:'Médio',
      apr:'ICM + MIC', ok:true });
  }
  if(R.subidaCustoPct>0){
    I.push({ pri:2, t:'Renegociar o ciclo de aquisição antes do próximo concurso',
      p:`A subida de ${nf(R.subidaCustoPct,1)}% acrescenta cerca de ${nf(R.custoTotalT/1000,1)} mil unidades de custo sobre o volume anual importado. Se a subida for conjuntural, vale antecipar volume no contrato em vigor; se for estrutural, o preço ao consumidor terá de acompanhar ou o subsídio implícito cresce sem decisão.`,
      efeito:'Diferimento do impacto', prazo:'Antes do concurso', custo:'A avaliar',
      apr:'MIC + MIREME + ARENE', ok:true });
  }
  if(R.capacidadeArmazemPerdidaPct>0){
    const cegos=RL?RL.armazens.filter(a=>a.iot.estado==='sem-sensor').length:0;
    I.push({ pri:1, t:'Verificação física dos armazéns na zona de impacto',
      p:`O cenário retira ${nf(R.capacidadeArmazemPerdidaPct,1)}% da capacidade útil. ${cegos} unidades da rede não têm sensor instalado, pelo que o dano nessas só se conhece por inspecção presencial — o sistema não o vai detectar. Enviar equipas às unidades sem instrumentação é a primeira acção, não a última.`,
      efeito:'Recupera visibilidade', prazo:'72 horas', custo:'Baixo',
      apr:'MIC + Delegados Provinciais', ok:true });
  }
  if(R.fase.pressaoAbastecimento==='critica'||R.fase.pressaoAbastecimento==='alta'){
    I.push({ pri:1, t:`Antecipar reposições — estamos em fase de ${R.fase.fase.toLowerCase()}`,
      p:`O calendário agrícola coloca o país numa fase de pressão ${R.fase.pressaoAbastecimento} sobre o abastecimento: as reservas domésticas dos produtores estão baixas e a colheita ainda não chegou. O modelo aplica por isso um factor de ${nf(R.faseP,2)} à procura. Qualquer choque nesta janela vale mais do que o mesmo choque em época de colheita.`,
      efeito:'Reduz exposição sazonal', prazo:'Imediato', custo:'Médio',
      apr:'MIC + ICM', ok:true });
  }
  I.push({ pri:3, t:'Fechar as lacunas de dados que este cenário expôs',
      p:`A simulação assenta em coeficientes assumidos e em cadastros por confirmar. Antes de repetir este exercício em sede de decisão, é preciso: extracção oficial do CUPA, confirmação do stock do ICM, cadastro dos armazéns privados e instrumentação das unidades sem sensor. Sem isso, o resultado é uma ordem de grandeza, não um número.`,
      efeito:'Torna o modelo defensável', prazo:'Contínuo', custo:'Baixo',
      apr:'MAAP + ICM + MTL', ok:true });

  return I.sort((a,b)=>a.pri-b.pri);
}

/* ---------- render ---------- */
function renderCenarios(){
  $('sp-cenarios').innerHTML=Object.keys(CENARIOS).map(k=>{const c=CENARIOS[k];
    return `<div class="cen${k===CEN?' on':''}" data-k="${k}">
      <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c.cor}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${c.ic}"/></svg></div>
      <div><b>${c.nome}</b><span>${c.sub}</span></div></div>`;}).join('');
  document.querySelectorAll('.cen').forEach(n=>n.addEventListener('click',()=>{
    CEN=n.dataset.k; PAR={}; CENARIOS[CEN].params.forEach(p=>PAR[p.k]=p.val);
    DRILL={produto:null,provincia:null}; renderCenarios(); renderParams(); correr();
  }));
}
function renderParams(){
  const s=CENARIOS[CEN];
  $('sp-params').innerHTML=s.params.map(p=>`<div class="par">
    <div class="lb"><span>${p.nome}</span><b class="mono" id="v-${p.k}">${PAR[p.k]}${p.un}</b></div>
    <input type="range" id="r-${p.k}" min="${p.min}" max="${p.max}" step="${p.passo}" value="${PAR[p.k]}">
  </div>`).join('')
  + `<div class="note">Fase agrícola actual: <b style="color:var(--brzl)">${faseSazonal().fase}</b> — pressão de abastecimento ${faseSazonal().pressaoAbastecimento}. O modelo aplica um factor de ${nf(PESO_SAZONAL[faseSazonal().pressaoAbastecimento],2)} à procura por causa disso.</div>`;
  s.params.forEach(p=>{
    const r=$('r-'+p.k);
    r.addEventListener('input',()=>{ PAR[p.k]=Number(r.value); $('v-'+p.k).textContent=r.value+p.un; correr(); });
  });
}

function correr(){
  const R=simular();
  const corR={crit:'#EF4444',warn:'#F0A926',ok:'#12B981'};
  const maisAtingido=[...R.produtos].sort((x,y)=>x.delta-y.delta)[0];
  const nProd=R.produtoresAfectados>=1e6?nf(R.produtoresAfectados/1e6,2):nf(R.produtoresAfectados/1000,0);
  const uProd=R.produtoresAfectados>=1e6?'milhões':'mil';
  const K=[
    {c:'Maior queda de cobertura',v:maisAtingido.nome,u:'',
     s:`${nf(maisAtingido.delta,1)} dias — de ${nf(maisAtingido.cobBase,0)} para ${nf(maisAtingido.cobCen,1)}`,
     col:corR[maisAtingido.risco],pequeno:true},
    {c:'Produtos em ruptura',v:R.rupturas.length,u:'/'+R.produtos.length,
     s:R.rupturas.length?'Abaixo de 15 dias: '+R.rupturas.slice(0,3).map(x=>x.nome).join(', '):'Nenhum produto abaixo do limiar',
     col:R.rupturas.length?'#EF4444':'#12B981'},
    {c:'Produtores expostos',v:nProd,u:uProd,s:`${R.provAfectadas.length} de ${PA.provincias.length} províncias no cenário`,col:'#22B8F0'},
    {c:'Custo adicional anual',v:nf(R.custoTotalT/1000,1),u:'mil t·%',
     s:R.custoTotalT?`Sobrecusto de ${nf(R.subidaCustoPct,1)}% sobre o volume importado`:'O cenário não altera o custo de aquisição',
     col:R.custoTotalT?'#F0A926':'#12B981'}
  ];
  $('sp-kpis').innerHTML=K.map(k=>`<div class="kpi frame"><span class="rail" style="background:${k.col}"></span>
    <div class="cap">${k.c}</div><div class="v ${k.pequeno?'':'mono'}" style="color:${k.col};${k.pequeno?'font-size:19px':''}">${k.v}<small>${k.u}</small></div>
    <div class="sub">${k.s}</div></div>`).join('');

  // curva comparada
  const H=120, w=760, h=250, pl=40, pb=28;
  const alvo=R.produtos.slice(0,3);
  const maxY=Math.max(45,...alvo.map(p=>p.cobBase));
  const X=d=>pl+d/H*(w-pl-14), Y=v=>h-pb-(Math.max(0,v)/maxY)*(h-pb-18);
  let g='';for(let i=0;i<=4;i++){const v=maxY*i/4;
    g+=`<line x1="${pl}" y1="${Y(v)}" x2="${w-14}" y2="${Y(v)}" stroke="#22354F" stroke-width=".7"/><text x="6" y="${Y(v)+4}" fill="#5E7189" font-size="9.5" font-family="IBM Plex Mono">${nf(v,0)}</text>`;}
  let lab='';for(let d=0;d<=H;d+=20) lab+=`<text x="${X(d)}" y="${h-8}" fill="#5E7189" font-size="9.5" text-anchor="middle">${d}d</text>`;
  const lim=`<line x1="${pl}" y1="${Y(15)}" x2="${w-14}" y2="${Y(15)}" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="6 5" opacity=".85"/>
    <text x="${w-18}" y="${Y(15)-6}" fill="#EF4444" font-size="9.5" text-anchor="end">limiar de ruptura</text>`;
  const cores=['#EF4444','#F0A926','#22B8F0'];
  const linhas=alvo.map((p,i)=>{
    const B=[],C=[];
    for(let d=0;d<=H;d+=3){ B.push([X(d),Y(p.cobBase-d)]); C.push([X(d),Y(p.cobCen-d)]); }
    const P=a=>a.map((q,j)=>(j?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
    return `<path d="${P(B)}" fill="none" stroke="${cores[i]}" stroke-width="1.4" stroke-dasharray="5 4" opacity=".5"/>
            <path d="${P(C)}" fill="none" stroke="${cores[i]}" stroke-width="2.5"/>`;
  }).join('');
  $('sp-curva').innerHTML=`<div class="row" style="font-size:10.5px;color:var(--ink-dim);margin-bottom:10px">
    ${alvo.map((p,i)=>`<span style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:${cores[i]}"></i>${p.nome}</span>`).join('')}
    <span style="margin-left:auto;color:var(--ink-faint)">Tracejado: sem choque · Cheio: com o cenário aplicado</span></div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Cobertura projectada com e sem o cenário">${g}${lab}${lim}${linhas}</svg>`;

  // tabela de produtos (nível 1 do detalhe)
  $('sp-produtos').innerHTML=`<table class="risco"><thead><tr><th>Produto</th>
    <th style="text-align:right">Cobertura base</th><th style="text-align:right">Com cenário</th>
    <th style="text-align:right">Variação</th><th style="text-align:right">Perda de colheita</th><th></th></tr></thead><tbody>
    ${R.produtos.map(p=>`<tr>
      <td class="p" onclick="abrirProduto('${p.nome.replace(/'/g,"\\'")}')">
        <div style="display:flex;align-items:center;gap:10px">${(typeof PRODUTOS!=='undefined')?PRODUTOS.imagem(p.nome,36):''}
        <span style="font-size:12.5px">${p.nome}</span></div></td>
      <td class="mono" style="text-align:right;color:var(--ink-dim)">${nf(p.cobBase,0)} d</td>
      <td class="mono" style="text-align:right;color:${corR[p.risco]}">${nf(p.cobCen,1)} d</td>
      <td class="mono" style="text-align:right;color:${p.delta<0?'var(--crit)':'var(--ok)'}">${nf(p.delta,1)} d</td>
      <td class="mono" style="text-align:right">${p.perdaT?nf(p.perdaT)+' t':'—'}</td>
      <td style="text-align:right;color:var(--acc);font-size:11px">detalhe →</td></tr>`).join('')}
    </tbody></table>`;

  // intervenções
  const I=intervencoes(R);
  const corP={1:'var(--crit)',2:'var(--warn)',3:'var(--info)'};
  const rotP={1:'Agir agora',2:'Programar',3:'Estrutural'};
  $('sp-conta-int').textContent=I.length+' intervenções';
  $('sp-intervencoes').innerHTML=I.map(x=>`<div class="interv">
    <div class="h"><span class="chip" style="background:${corP[x.pri]}1F;color:${corP[x.pri]}">${rotP[x.pri]}</span><b>${x.t}</b></div>
    <div class="p">${x.p}</div>
    <div class="m">
      <div><div class="l">Efeito estimado</div><div class="n" style="color:var(--ok)">${x.efeito}</div></div>
      <div><div class="l">Prazo</div><div class="n">${x.prazo}</div></div>
      <div><div class="l">Ordem de custo</div><div class="n">${x.custo}</div></div>
    </div>
    <div class="f"><span class="chip" style="background:rgba(201,138,60,.12);color:var(--brz)">🔒 ${x.apr}</span>
      ${x.ok===false?'<span class="chip" style="background:var(--crit-bg);color:var(--crit)">excede a reserva disponível</span>':''}
      <span style="flex:1"></span><button class="btn acc no-print" type="button">Submeter a aprovação</button></div>
  </div>`).join('');

  renderDrill(R);
}

/* ---------- níveis de detalhe abaixo do produto ---------- */
function abrirProduto(nome){ DRILL={produto:nome, provincia:null}; correr(); if($('sp-drill').scrollIntoView) $('sp-drill').scrollIntoView({behavior:'smooth',block:'center'}); }
function abrirProvincia(nome){ DRILL.provincia=nome; correr(); }
function voltar(n){ if(n===1){DRILL={produto:null,provincia:null};} else {DRILL.provincia=null;} correr(); }

function renderDrill(R){
  const c=$('sp-crumb');
  if(!DRILL.produto){
    c.innerHTML='<span>Escolha um produto na tabela acima para descer ao detalhe por província e por segmento de produtor.</span>';
    $('sp-drill').innerHTML='';
    return;
  }
  const prod=R.produtos.find(p=>p.nome===DRILL.produto);
  c.innerHTML=`<button onclick="voltar(1)">Todos os produtos</button><span>›</span>`
    +(DRILL.provincia?`<button onclick="voltar(2)">${DRILL.produto}</button><span>›</span><b>${DRILL.provincia}</b>`
                     :`<b>${DRILL.produto}</b>`);

  if(!DRILL.provincia){
    // nível 2 — províncias produtoras deste produto
    const cultura = DRILL.produto.replace(' (Diesel)','').replace('Farinha de ','');
    const provs = PA.provincias.filter(p=>p.culturas.some(x=>cultura.toLowerCase().indexOf(x.toLowerCase())>-1
        || x.toLowerCase().indexOf(cultura.toLowerCase())>-1));
    const lista = provs.length?provs:PA.provincias;
    const afect = new Set(R.provAfectadas.map(x=>x.nome));
    $('sp-drill').innerHTML=`
      <div class="note" style="margin:0 0 14px;border:none;padding:0">${provs.length
        ? `${provs.length} província(s) com esta cultura registada no cadastro. `
        : 'Nenhuma província tem esta cultura registada no cadastro — mostradas todas, porque o produto é importado e a exposição é de consumo, não de produção. '}
        A resiliência é calculada a partir da irrigação, semente certificada e extensão de cada província.</div>
      <div class="dd">${lista.map(p=>{
        const res=resiliencia(p), no=afect.has(p.nome);
        return `<div class="nivel" style="cursor:pointer;${no?'border-color:rgba(239,68,68,.4)':''}" onclick="abrirProvincia('${p.nome}')">
          <div class="t"><span style="width:8px;height:8px;border-radius:50%;background:${no?'var(--crit)':'var(--ink-faint)'}"></span>
            ${p.nome}${no?'<span class="chip" style="background:var(--crit-bg);color:var(--crit);margin-left:auto">no cenário</span>':''}</div>
          <div class="row2"><span>Explorações</span><span class="mono">${nf(p.exploracoes)}</span></div>
          <div class="row2"><span>Área cultivada</span><span class="mono">${nf(p.areaCultivadaHa)} ha</span></div>
          <div class="row2"><span>Perda relativa esperada</span><span class="mono" style="color:${res>0.8?'var(--crit)':res>0.65?'var(--warn)':'var(--ok)'}">${nf(res*100,0)}%</span></div>
          <div class="bar" style="margin-top:9px"><i style="width:${res*100}%;background:${res>0.8?'#EF4444':res>0.65?'#F0A926':'#12B981'}"></i></div>
          <div style="font-size:10px;color:var(--ink-faint);margin-top:8px">Ver segmentos de produtor →</div></div>`;}).join('')}</div>`;
    return;
  }

  // nível 3 — segmentos de produtor dentro da província
  const p=PA.provincias.find(x=>x.nome===DRILL.provincia);
  const segs=[
    {n:'Pequenas explorações', q:p.pequenas, nota:'Agricultura familiar. Baixa mecanização, quase sem irrigação; é o segmento que absorve o choque no consumo próprio antes de o mercado o notar.'},
    {n:'Médias explorações', q:p.medias, nota:'Já compra insumos e vende excedente. É aqui que a extensão e a semente certificada rendem mais por metical.'},
    {n:'Grandes explorações', q:p.grandes, nota:'Poucas unidades, peso desproporcionado na produção comercializada. Uma perda aqui move o balanço nacional.'}
  ];
  const cegos = RL ? RL.armazens.filter(a=>a.provincia===p.nome).length : 0;
  $('sp-drill').innerHTML=`
    <div class="dd" style="margin-bottom:14px">
      <div class="nivel"><div class="t">Capacidade de resposta</div>
        <div class="row2"><span>Irrigação</span><span class="mono" style="color:${p.irrigacaoPercent<5?'var(--crit)':'var(--ok)'}">${nf(p.irrigacaoPercent,1)}%</span></div>
        <div class="row2"><span>Semente certificada</span><span class="mono">${nf(p.sementeCertificadaPercent,1)}%</span></div>
        <div class="row2"><span>Fertilizante químico</span><span class="mono">${nf(p.fertilizantePercent,1)}%</span></div>
        <div class="row2"><span>Serviços de extensão</span><span class="mono">${nf(p.extensaoPercent,1)}%</span></div>
        <div style="font-size:10px;color:var(--ink-faint);margin-top:9px">Média nacional de fertilizante em 2023: ${nf(PA.ancorasNacionais.usoFertilizanteQuimicoPercent.valor,1)}%</div></div>
      <div class="nivel"><div class="t">Ligação ao mercado</div>
        <div class="row2"><span>Associados</span><span class="mono">${nf(p.associadoPercent,1)}%</span></div>
        <div class="row2"><span>Com acesso a crédito</span><span class="mono" style="color:${p.creditoPercent<5?'var(--warn)':'var(--ok)'}">${nf(p.creditoPercent,1)}%</span></div>
        <div class="row2"><span>Distância ao armazém</span><span class="mono">${nf(p.distanciaMediaArmazemKm)} km</span></div>
        <div class="row2"><span>Armazéns na província</span><span class="mono">${cegos}</span></div>
        <div class="row2"><span>Corredor de escoamento</span><span class="mono">${PA.dependenciaCorredor.mapa[p.nome]||'—'}</span></div></div>
      <div class="nivel"><div class="t">Culturas registadas</div>
        <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:10px">${p.culturas.map(x=>`<span class="chip" style="background:rgba(34,184,240,.12);color:var(--acc)">${x}</span>`).join('')}</div>
        <div style="font-size:10.5px;color:var(--ink-dim);line-height:1.6;margin-top:12px">
          ${p.creditoPercent<5?'Menos de 5% das explorações têm acesso a crédito: sem financiamento, qualquer recomendação de insumos fica no papel.':'O acesso a crédito nesta província está acima do padrão nacional, o que torna viáveis intervenções que exigem contrapartida do produtor.'}</div></div>
    </div>
    <div class="dd">${segs.map(s=>`<div class="nivel">
      <div class="t">${s.n}<span class="mono" style="margin-left:auto;color:var(--brzl)">${nf(s.q,1)}%</span></div>
      <div class="bar" style="margin-top:9px"><i style="width:${s.q}%;background:var(--brz)"></i></div>
      <div class="row2" style="border:none"><span>Explorações estimadas</span><span class="mono">${nf(p.exploracoes*s.q/100)}</span></div>
      <div style="font-size:10.5px;color:var(--ink-dim);line-height:1.6;margin-top:6px">${s.nota}</div></div>`).join('')}</div>
    <div class="note">Os segmentos usam a distribuição do cadastro para esta província. A classificação em pequenas, médias e grandes explorações segue os limites do Inquérito Agrário Integrado. Os agregados provinciais estão marcados como por confirmar e devem ser substituídos por extracção oficial do CUPA.</div>`;
}

/* ---------- arranque ---------- */
(async function iniciar(){
  if(typeof SINAGEPE!=='undefined'&&SINAGEPE.mountShell) SINAGEPE.mountShell('simulador','Simulador Preditivo','CENÁRIOS · CUPA · INTERVENÇÕES');
  const alvo=document.getElementById('content-mount')||document.getElementById('app-shell');
  alvo.innerHTML=`
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="eyebrow">Modelo determinístico de cenários — coeficientes declarados</div>
      <button class="btn no-print" onclick="window.print()">Imprimir</button></div>
    <div class="sp-top">
      <div>
        <div class="card frame"><div class="ch"><h2>Cenários</h2></div><div class="cb" id="sp-cenarios"></div></div>
        <div class="card frame" style="margin-top:12px"><div class="ch"><h2>Parâmetros</h2></div><div class="cb" id="sp-params"></div></div>
      </div>
      <div>
        <div class="kpis" id="sp-kpis"></div>
        <div class="card frame"><div class="ch"><h2>Cobertura projectada a 120 dias</h2><span class="tag warn">Modelo assumido</span></div>
          <div class="cb" id="sp-curva"></div></div>
      </div>
    </div>
    <div class="card frame" style="margin-top:12px"><div class="ch"><h2>Impacto por produto</h2>
      <span class="tag live">Clique para descer no detalhe</span></div><div class="cb" id="sp-produtos"></div></div>
    <div class="card frame" style="margin-top:12px"><div class="ch"><h2>Detalhe em profundidade</h2>
      <span class="tag">Produto › Província › Segmento de produtor</span></div>
      <div class="cb"><div class="crumb" id="sp-crumb"></div><div id="sp-drill"></div></div></div>
    <div class="card frame" style="margin-top:12px"><div class="ch"><h2>Intervenções sugeridas</h2>
      <span class="tag crit" id="sp-conta-int">—</span></div><div id="sp-intervencoes"></div></div>
    <div class="card frame" style="margin-top:12px"><div class="cb">
      <div class="eyebrow">Natureza do modelo</div>
      <div style="font-size:12px;color:var(--ink-dim);line-height:1.75;margin-top:10px">
        Isto é um modelo determinístico de cenários, não previsão estatística. Não existe no sistema série histórica
        suficiente para estimar probabilidades, e apresentar intervalos de confiança sobre coeficientes assumidos seria
        dar uma falsa aparência de rigor. O que o modelo faz — e faz de forma reproduzível — é propagar um choque
        declarado pelos dados de stock, cadastro de produtores e rede logística, e ordenar as intervenções por efeito.
        Todos os coeficientes estão em <span class="mono">data/produtores-agrarios.json</span>, no bloco
        <span class="mono">elasticidades</span>. Serve para ordenar prioridades e preparar decisões; não serve como
        prova em documento oficial enquanto os cadastros estiverem por confirmar.
      </div></div></div>`;

  async function ler(caminho){
    const r=await fetch(caminho,{cache:'no-store'});
    const b=await r.text();
    if(!r.ok || /^\s*</.test(b)) throw new Error(caminho+' — '+(r.ok?'devolveu HTML em vez de JSON':'HTTP '+r.status));
    return JSON.parse(b);
  }
  try{
    [D,FX,PA]=await Promise.all([ler('data/sinagepe-data.json'),ler('data/fontes-externas.json'),ler('data/produtores-agrarios.json')]);
    try{ RL=await ler('data/rede-logistica.json'); }catch(e){ RL=null; }
  }catch(e){
    alvo.innerHTML=`<div class="card frame"><div class="cb"><div class="msg">
      <span class="ic" style="background:var(--crit-bg);color:var(--crit)">✕</span>
      <div><b style="color:var(--crit)">Não foi possível arrancar o simulador</b><br>
      <span style="color:var(--ink-dim)">${e.message}. Confirme que os ficheiros estão publicados na pasta <span class="mono">data/</span>.</span></div></div></div></div>`;
    return;
  }

  CENARIOS[CEN].params.forEach(p=>PAR[p.k]=p.val);
  renderCenarios(); renderParams(); correr();
  if(typeof SINAGEPE!=='undefined'&&SINAGEPE.renderUserFooter) SINAGEPE.renderUserFooter(D);
})();
</script>
</body>
</html>
